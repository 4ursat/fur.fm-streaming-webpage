<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fur FM</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
  <script src="supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #141414;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
    }

    /* ── Full-page centring shell ── */
    .page-wrap {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.8rem 2.5rem;
    }

    /* ── Column: above + stage + below, all same width ── */
    .content-col {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      width: 88vw;
      /* max-width: tallest possible stage given vh, plus strip heights + gaps */
      max-width: calc((100vh - 9rem) * 1.7778);
    }

    /* ── Above-video strip ── */
    .above {
      display: flex;
      justify-content: flex-end;
    }

    .session-notice {
      font-size: 0.84rem; letter-spacing: 0.03em;
      color: rgba(255,255,255,0.8);
      line-height: 1.5;
    }

    /* ── Contained video stage ── */
    .stage {
      position: relative;
      width: 100%;
      height: 0;
      padding-top: 56.25%; /* 16:9 */
      overflow: hidden;
      outline: 1px solid rgba(255,255,255,0.07);
      flex-shrink: 0;
    }

    #obs-player {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: none; display: block;
    }

    /* ── Overlays — absolutely positioned inside .stage ── */
    .ov {
      position: absolute;
      z-index: 10;
      pointer-events: none;
    }

    /* Top-left: Logo */
    .ov-tl { top: 1.2rem; left: 1.4rem; }

    .logo { display: flex; align-items: flex-start; gap: 0.5rem; }
    .logo-name {
      font-size: 1.05rem; font-weight: bold; letter-spacing: 0.07em;
      color: rgba(255,255,255,0.95); line-height: 1;
      text-shadow: 0 1px 12px rgba(0,0,0,0.8);
    }
    .logo-dot {
      display: inline-block; width: 3px; height: 3px;
      background: rgba(255,255,255,0.85); border-radius: 50%;
      vertical-align: middle; margin: 0 0.18em;
      position: relative; top: -1px;
    }

    /* Live rings */
    #ring-inner  { opacity: 0.65; }
    #ring-mid    { opacity: 0.44; }
    #ring-outer  { opacity: 0.26; }
    .logo.is-live #ring-inner { animation: ring-broadcast 2.4s ease-in-out infinite; }
    .logo.is-live #ring-mid   { animation: ring-broadcast 2.4s ease-in-out 0.5s infinite; }
    .logo.is-live #ring-outer { animation: ring-broadcast 2.4s ease-in-out 1s infinite; }
    @keyframes ring-broadcast {
      0%, 100% { opacity: 0.06; }
      40%      { opacity: 0.9; }
    }

    /* Top-right: Session info */
    .ov-tr { top: 1.2rem; right: 1.4rem; text-align: right; max-width: 50%; }
    .session-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.05rem; font-weight: 300; font-style: italic;
      color: rgba(255,255,255,0.95);
    }
    .session-timer {
      font-size: 1.0rem; letter-spacing: 0.14em;
      color: rgba(255,255,255,0.95);
      margin-top: 0.3rem; text-align: right;
      font-variant-numeric: tabular-nums;
    }

    /* Bottom-left: Listener count */
    .ov-bl { bottom: 1.3rem; left: 1.4rem; }
    .listener-count {
      font-size: 0.86rem; letter-spacing: 0.06em;
      color: rgba(255,255,255,0.85); font-style: italic;
    }

    /* Bottom-right: Chat overlay */
    .ov-br {
      bottom: 1.3rem; right: 1.4rem;
      width: min(240px, calc(50% - 1.8rem));
      pointer-events: all;
      display: flex; flex-direction: column;
    }
    .messages {
      max-height: 190px; overflow-y: auto;
      display: flex; flex-direction: column; gap: 0.65rem;
      padding: 0.65rem 0.75rem 0.55rem;
      background: rgba(0,0,0,0.22);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      scrollbar-width: none;
    }
    .messages::-webkit-scrollbar { display: none; }
    .msg { display: flex; flex-direction: column; gap: 0.04rem; }
    .msg-sender {
      font-size: 0.72rem; letter-spacing: 0.06em;
      color: rgba(255,255,255,0.72);
    }
    .msg-text {
      font-size: 0.82rem; color: rgba(255,255,255,0.92);
      line-height: 1.45; word-break: break-word;
    }
    .msg.system .msg-sender { color: rgba(255,255,255,0.45); }
    .msg.system .msg-text {
      font-style: italic; color: rgba(255,255,255,0.6); font-size: 0.72rem;
    }
    .chat-input-area {
      background: rgba(0,0,0,0.28);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 0.4rem 0.75rem 0.5rem;
      display: flex; align-items: center; gap: 0.55rem;
      border-top: 1px solid rgba(255,255,255,0.05);
    }
    .chat-input-area input {
      flex: 1; background: transparent; border: none;
      border-bottom: 1px solid rgba(255,255,255,0.18);
      outline: none; padding: 0.15rem 0;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.76rem; font-style: italic;
      color: rgba(255,255,255,0.88);
    }
    .chat-input-area input::placeholder { color: rgba(255,255,255,0.5); }
    .send-btn {
      background: none; border: none; padding: 0; flex-shrink: 0;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase;
      color: rgba(255,255,255,0.65); cursor: pointer; transition: color 0.2s;
    }
    .send-btn:hover { color: rgba(255,255,255,0.9); }

    /* ── Below-video strip ── */
    .below {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-link {
      font-size: 0.9rem; letter-spacing: 0.08em; text-transform: uppercase;
      color: rgba(255,255,255,0.75); text-decoration: none;
      background: none; border: none; padding: 0;
      font-family: 'Courier New', Courier, monospace;
      cursor: pointer; transition: color 0.2s;
    }
    .nav-link:hover { color: rgba(255,255,255,0.95); }

    /* ── Now Playing bar (archival) ── */
    .np-bar {
      position: absolute; bottom: 0; left: 0; right: 0;
      z-index: 9; pointer-events: none;
      background: linear-gradient(to top, rgba(0,0,0,0.72) 0%, rgba(0,0,0,0) 100%);
      padding: 2.2rem 1.4rem 0.9rem;
      display: none; flex-direction: column; gap: 0.3rem;
    }
    .np-bar.visible { display: flex; }
    .np-track-line {
      font-size: 0.8rem; font-weight: bold; letter-spacing: 0.04em;
      color: rgba(255,255,255,0.95);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .np-meta-line {
      font-size: 0.68rem; letter-spacing: 0.06em;
      color: rgba(255,255,255,0.65);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .np-translation {
      font-size: 0.72rem; font-style: italic;
      color: rgba(255,255,255,0.78); line-height: 1.5;
      margin-top: 0.15rem;
      display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden;
    }
    /* Archive image overlay (when no video) */
    .np-image-bg {
      position: absolute; inset: 0; z-index: 0;
      background-size: cover; background-position: center;
      opacity: 0; transition: opacity 0.6s;
    }
    .np-image-bg.show { opacity: 0.35; }

    /* ── Join toast ── */
    .join-toast {
      position: fixed; bottom: 2.2rem; left: 50%;
      transform: translateX(-50%) translateY(8px);
      z-index: 20; pointer-events: none;
      font-size: 0.68rem; letter-spacing: 0.12em;
      color: rgba(255,255,255,0.68);
      background: rgba(0,0,0,0.52);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.06);
      padding: 0.36rem 0.9rem;
      opacity: 0; white-space: nowrap;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }
    .join-toast.visible {
      opacity: 1; transform: translateX(-50%) translateY(0);
    }

    /* ── Audio unlock prompt ── */
    .audio-prompt {
      position: fixed; bottom: 1.4rem; left: 50%;
      transform: translateX(-50%);
      z-index: 80; display: none; align-items: center; gap: 0.5rem;
      background: rgba(255,255,255,0.95); color: #000;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.64rem; letter-spacing: 0.12em; text-transform: uppercase;
      padding: 0.55rem 1.1rem; cursor: pointer;
    }
    .audio-prompt.visible { display: flex; }

    /* ── iOS tap-to-watch overlay ── */
    .tap-overlay {
      position: absolute; inset: 0;
      z-index: 5;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.55);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .tap-overlay span {
      font-size: 0.78rem; letter-spacing: 0.22em; text-transform: uppercase;
      color: rgba(255,255,255,0.85);
      border: 1px solid rgba(255,255,255,0.3);
      padding: 0.55rem 1.4rem;
    }

    /* ── Responsive ── */

    /* Tablet (portrait iPad etc.) */
    @media (max-width: 768px) {
      .content-col { width: 94vw; }
      .page-wrap { padding: 1.4rem 1.2rem; }
    }

    /* Phone */
    @media (max-width: 600px) {
      .content-col { width: 98vw; }
      .page-wrap { padding: 0.9rem 0.6rem; }

      /* tighter overlay insets */
      .ov-tl { top: 0.6rem; left: 0.7rem; }
      .ov-tr { top: 0.6rem; right: 0.7rem; max-width: 56%; }
      .ov-bl { bottom: 0.65rem; left: 0.7rem; }
      .ov-br { bottom: 0.65rem; right: 0.7rem;
               width: min(190px, calc(55% - 0.7rem)); }

      /* overlay text */
      .logo-name    { font-size: 0.88rem; }
      .session-title { font-size: 0.82rem; }
      .session-timer { font-size: 0.8rem; letter-spacing: 0.08em; }
      .listener-count { font-size: 0.74rem; }

      /* shorter chat so it doesn't dominate the small video */
      .messages { max-height: 100px; }
      .msg-text { font-size: 0.72rem; }
      .msg-sender { font-size: 0.62rem; }
      .chat-input-area { padding: 0.3rem 0.55rem 0.35rem; }
      .chat-input-area input { font-size: 0.68rem; }
      .send-btn { font-size: 0.65rem; }

      /* strips outside video */
      .session-notice { font-size: 0.74rem; }
      .nav-link { font-size: 0.78rem; }
      .content-col { gap: 0.6rem; }
    }

    /* Landscape phone — maximize video height */
    @media (max-height: 480px) and (orientation: landscape) {
      .page-wrap { padding: 0.5rem; }
      .content-col { gap: 0.45rem; }
      .above, .below { display: none; }  /* hide strips, give video full space */
      .content-col { max-width: calc(100vh * 1.7778); width: 100vw; }
    }
  </style>
</head>
<body>

<div class="page-wrap">
  <div class="content-col">

    <!-- Above video: notice right-aligned -->
    <div class="above">
      <div class="session-notice">This session will not be recorded.</div>
    </div>

    <!-- Video stage with overlays inside -->
    <div class="stage">

      <iframe
        id="obs-player"
        src="https://vdo.ninja/?view=xYuuWBy&label=ffm_listening_room&cleanoutput&autoplay"
        allow="autoplay;camera;microphone;fullscreen;picture-in-picture;display-capture;midi;encrypted-media"
        allowfullscreen
        title="Fur FM live stream"
      ></iframe>

      <!-- iOS tap-to-watch (hidden on non-iOS) -->
      <div class="tap-overlay" id="tap-overlay" style="display:none">
        <span>tap to watch</span>
      </div>

      <!-- Archive image background (shown during archival sessions) -->
      <div class="np-image-bg" id="np-image-bg"></div>

      <!-- Now Playing bar (archival, bottom of stage) -->
      <div class="np-bar" id="np-bar">
        <div class="np-track-line" id="np-track-line"></div>
        <div class="np-meta-line" id="np-meta-line"></div>
        <div class="np-translation" id="np-translation" style="display:none"></div>
      </div>

      <!-- Top-left: Logo -->
      <div class="ov ov-tl">
        <div class="logo" id="live-badge">
          <svg viewBox="0 0 36 20" width="26" height="15" fill="none">
            <defs>
              <clipPath id="ov-rings-clip">
                <rect x="-500" y="-1000" width="1000" height="1014"/>
              </clipPath>
            </defs>
            <g clip-path="url(#ov-rings-clip)">
              <circle id="ring-inner" cx="18" cy="11" r="6"  stroke="#fff" stroke-width="1.3"/>
              <circle id="ring-mid"   cx="18" cy="11" r="11" stroke="#fff" stroke-width="1.0"/>
              <circle id="ring-outer" cx="18" cy="11" r="16" stroke="#fff" stroke-width="0.75"/>
            </g>
            <circle cx="18" cy="11" r="2.2" fill="#fff"/>
          </svg>
          <div class="logo-name">FUR<span class="logo-dot"></span>FM</div>
        </div>
      </div>

      <!-- Top-right: Session info -->
      <div class="ov ov-tr">
        <div class="session-title" id="prog-title">Live Session</div>
        <div class="session-timer" id="session-timer">00:00:00</div>
      </div>

      <!-- Bottom-left: Listener count -->
      <div class="ov ov-bl">
        <div class="listener-count" id="listener-count">—</div>
      </div>

      <!-- Bottom-right: Chat overlay -->
      <div class="ov ov-br">
        <div class="messages" id="chat-messages" role="log" aria-live="polite"></div>
        <div class="chat-input-area">
          <input type="text" id="chat-input" placeholder=""
                 maxlength="200" autocomplete="off" />
          <button class="send-btn" id="send-btn">send →</button>
        </div>
      </div>

    </div><!-- /.stage -->

    <!-- Below video -->
    <div class="below">
      <button class="nav-link nav-leave">leave quietly</button>
      <button class="nav-link nav-fullscreen">⤢ fullscreen</button>
    </div>

  </div><!-- /.content-col -->
</div><!-- /.page-wrap -->

<audio id="np-audio" style="display:none" preload="auto"></audio>
<div class="audio-prompt" id="audio-prompt">🔈 Tap to enable audio</div>

<script>
(async () => {
  const { createClient } = window.supabase;
  const db = createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

  /* ── iOS tap-to-watch ── */
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  if (isIOS) {
    const tapOverlay = document.getElementById('tap-overlay');
    const iframe     = document.getElementById('obs-player');
    tapOverlay.style.display = 'flex';
    tapOverlay.addEventListener('click', () => {
      tapOverlay.remove();
      iframe.src = iframe.src; /* reload inside gesture = iOS autoplay allowed */
    });
  }

  /* ── Auth gate ── */
  const isBroadcaster = window.location.hash === '#broadcast';
  const { data: { session } } = await db.auth.getSession();
  if (!session && !isBroadcaster) { window.location.replace('index.html'); return; }

  const user = session?.user || null;
  let userName = user?.user_metadata?.username || user?.email?.split('@')[0] || (isBroadcaster ? 'Broadcaster' : 'Listener');

  let myUserId = null;
  if (user) {
    const { data: profile } = await db.from('users').select('id, name').eq('auth_id', user.id).single();
    if (profile) {
      myUserId = profile.id;
      if (profile.name) userName = profile.name;
    }
  }

  const sessionId = new Date().toISOString().slice(0, 10);
  const countEl   = document.getElementById('listener-count');
  let dbSessionId  = null;

  /* ── Live badge ── */
  const liveBadge = document.getElementById('live-badge');
  function setLive(isLive) { liveBadge.classList.toggle('is-live', isLive); }

  window.addEventListener('message', e => {
    if (!String(e.origin).includes('vdo.ninja')) return;
    const msg = e.data; if (!msg) return;
    const action = msg.action || msg.type || '';
    if (/view|join|connect|stream/i.test(action)) {
      setLive(true);
      if (dbSessionId && !timerInterval) {
        db.from('sessions').update({ stream_started_at: new Date().toISOString() })
          .eq('id', dbSessionId).is('stream_started_at', null).then(() => {});
      }
    }
    if (/hangup|disconnect|leave/i.test(action)) {
      setLive(false);
    }
  });

  /* ── Leave quietly ── */
  document.querySelector('.nav-leave').addEventListener('click', async () => {
    await db.auth.signOut();
    window.location.href = 'index.html';
  });

  /* ── Fullscreen ── */
  const fsBtn = document.querySelector('.nav-fullscreen');
  fsBtn.addEventListener('click', () => {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen().catch(() => {});
    }
  });
  document.addEventListener('fullscreenchange', () => {
    fsBtn.textContent = document.fullscreenElement ? '↙ exit fullscreen' : '⤢ fullscreen';
  });

  /* ── Chat ── */
  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  const log   = document.getElementById('chat-messages');
  const input = document.getElementById('chat-input');
  const btn   = document.getElementById('send-btn');

  function appendMessage(sender, text, type = 'user') {
    const msg = document.createElement('div');
    msg.className = `msg${type === 'system' ? ' system' : ''}`;
    msg.innerHTML = `<span class="msg-sender">${esc(sender)}</span><span class="msg-text">${esc(text)}</span>`;
    gsap.set(msg, { opacity: 0, y: 5 });
    log.appendChild(msg);
    gsap.to(msg, { opacity: 1, y: 0, duration: 0.3, ease: 'power2.out' });
    log.scrollTop = log.scrollHeight;
  }

  const { data: history } = await db
    .from('chat_messages')
    .select('user_id, username, content')
    .eq('session_id', sessionId)
    .order('created_at', { ascending: true })
    .limit(60);

  if (history && history.length > 0) {
    log.innerHTML = '';
    history.forEach(m => appendMessage(m.username || 'Listener', m.content));
  }

  db.channel(`chat:${sessionId}`)
    .on('postgres_changes', {
      event: 'INSERT', schema: 'public', table: 'chat_messages',
      filter: `session_id=eq.${sessionId}`,
    }, payload => {
      if (payload.new.user_id !== myUserId)
        appendMessage(payload.new.username || 'Listener', payload.new.content);
    })
    .subscribe();

  async function send() {
    const text = input.value.trim();
    if (!text) return;
    appendMessage(userName, text);
    input.value = ''; input.focus();
    await db.from('chat_messages').insert({
      user_id: myUserId, username: userName,
      content: text, session_id: sessionId,
    });
  }
  btn.addEventListener('click', send);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });

  /* ── Programme info + global timer ── */
  const timerEl     = document.getElementById('session-timer');
  const titleEl     = document.getElementById('prog-title');
  let timerInterval = null;

  function startTimerFrom(ts) {
    if (timerInterval) clearInterval(timerInterval);
    setLive(true);
    const startMs = new Date(ts).getTime();
    function tick() {
      const s = Math.max(0, Math.floor((Date.now() - startMs) / 1000));
      timerEl.textContent = [
        Math.floor(s / 3600),
        Math.floor((s % 3600) / 60),
        s % 60,
      ].map(n => String(n).padStart(2, '0')).join(':');
    }
    tick();
    timerInterval = setInterval(tick, 1000);
  }

  function stopTimer() {
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
    setLive(false);
    timerEl.textContent = '00:00:00';
  }

  /* Load current session */
  try {
    const { data: sessionRow } = await db
      .from('sessions')
      .select('id, title, stream_started_at')
      .order('date', { ascending: false })
      .limit(1)
      .single();
    if (sessionRow) {
      dbSessionId = sessionRow.id;
      if (sessionRow.title) titleEl.textContent = sessionRow.title;
      if (sessionRow.stream_started_at) startTimerFrom(sessionRow.stream_started_at);
    }
  } catch (_) {}

  /* Realtime: sync timer across all viewers */
  db.channel('sessions-timer')
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'sessions' }, payload => {
      if (!dbSessionId || payload.new.id !== dbSessionId) return;
      if (payload.new.stream_started_at) startTimerFrom(payload.new.stream_started_at);
      else stopTimer();
    }).subscribe();

  /* Click the timer to start/stop — only works with #broadcast in URL */
  if (window.location.hash === '#broadcast') {
    timerEl.parentElement.style.pointerEvents = 'all';
    timerEl.style.pointerEvents = 'all';
    timerEl.style.cursor = 'pointer';
    timerEl.style.outline = '1px solid rgba(255,255,255,0.25)';
    timerEl.style.padding = '0.1rem 0.3rem';
    timerEl.title = 'click to start / stop';
    timerEl.addEventListener('click', async () => {
      if (!dbSessionId) {
        if (timerInterval) stopTimer();
        else startTimerFrom(new Date().toISOString());
        return;
      }
      if (timerInterval) {
        await db.from('sessions').update({ stream_started_at: null }).eq('id', dbSessionId);
      } else {
        await db.from('sessions').update({ stream_started_at: new Date().toISOString() }).eq('id', dbSessionId);
      }
    });
  }

  /* ── Archival now-playing ── */
  const npBar        = document.getElementById('np-bar');
  const npTrackLine  = document.getElementById('np-track-line');
  const npMetaLine   = document.getElementById('np-meta-line');
  const npTranslation = document.getElementById('np-translation');
  const npImageBg    = document.getElementById('np-image-bg');
  const npAudio      = document.getElementById('np-audio');
  const audioPrompt  = document.getElementById('audio-prompt');

  /* ── Synced audio playback (archival tracks) ── */
  let wantPlaying = false;
  let wantUrl     = null;

  function attemptPlay() {
    npAudio.play().then(() => {
      audioPrompt.classList.remove('visible');
    }).catch(() => {
      audioPrompt.classList.add('visible');
    });
  }

  function syncAudio(d) {
    const url = d.audio_url || null;
    wantPlaying = !!d.is_playing;

    if (url !== wantUrl) {
      wantUrl = url;
      if (url) {
        npAudio.src = url;
        npAudio.currentTime = d.playhead_pos || 0;
      } else {
        npAudio.removeAttribute('src');
      }
    } else if (url && typeof d.playhead_pos === 'number'
               && Math.abs(npAudio.currentTime - d.playhead_pos) > 1.5) {
      npAudio.currentTime = d.playhead_pos;
    }

    if (wantPlaying && url) {
      if (npAudio.paused) attemptPlay();
    } else {
      npAudio.pause();
    }
  }

  document.addEventListener('click', () => {
    if (wantPlaying && npAudio.paused) attemptPlay();
  }, true);
  audioPrompt.addEventListener('click', () => attemptPlay());

  function applyNP(d) {
    if (!d) return;
    syncAudio(d);
    const hasContent = d.track_title || d.artist;
    npBar.classList.toggle('visible', !!hasContent);

    const track = [d.track_title, d.artist].filter(Boolean).join(' — ');
    npTrackLine.textContent = track || '';

    const meta = [d.archive_source].filter(Boolean).join(' · ');
    npMetaLine.textContent = meta || '';

    if (d.translation) {
      npTranslation.textContent = d.translation;
      npTranslation.style.display = '';
    } else {
      npTranslation.style.display = 'none';
    }

    if (d.image_url) {
      npImageBg.style.backgroundImage = `url("${d.image_url.replace(/"/g,'%22')}")`;
      npImageBg.classList.add('show');
    } else {
      npImageBg.classList.remove('show');
    }
  }

  (async () => {
    const { data } = await db.from('now_playing')
      .select('*').eq('id', '00000000-0000-0000-0000-000000000001').maybeSingle();
    if (data) applyNP(data);
  })();

  db.channel('now-playing-listener')
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'now_playing' },
      payload => applyNP(payload.new))
    .subscribe();

  /* ── Presence ── */
  function showJoinToast(name) {
    const el = document.createElement('div');
    el.className = 'join-toast';
    el.textContent = `→ ${name} found their way in`;
    document.body.appendChild(el);
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('visible')));
    setTimeout(() => { el.classList.remove('visible'); setTimeout(() => el.remove(), 400); }, 3200);
  }

  const presenceChannel = db.channel('fur-fm:room');
  presenceChannel
    .on('presence', { event: 'sync' }, () => {
      const count = Object.keys(presenceChannel.presenceState()).length;
      countEl.textContent = count === 1 ? '1 listening' : `${count} listening`;
    })
    .on('presence', { event: 'join' }, ({ newPresences }) => {
      newPresences.forEach(p => {
        if (p.username && p.username !== userName) showJoinToast(p.username);
      });
    })
    .subscribe(async status => {
      if (status === 'SUBSCRIBED') await presenceChannel.track({ username: userName });
    });

})();
</script>
