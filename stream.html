<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fur FM</title>
  <script src="supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Courier New', Courier, monospace;
    }

    /* ── Full-screen stream player ── */
    #live-player {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      z-index: 1;
    }

    /* ── Chat + volume overlay — bottom right ── */
    .overlay {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      z-index: 10;
      width: 272px;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    /* Volume bar */
    .volume-bar {
      background: rgba(12, 12, 12, 0.72);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.1);
      border-bottom: none;
      padding: 0.5rem 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .vol-label {
      font-size: 0.55rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
      flex-shrink: 0;
    }

    .vol-icon {
      flex-shrink: 0;
      cursor: pointer;
      opacity: 0.45;
      transition: opacity 0.15s;
    }
    .vol-icon:hover { opacity: 0.9; }

    #volume-slider {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 2px;
      background: rgba(255,255,255,0.2);
      outline: none;
      cursor: pointer;
    }

    #volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: rgba(255,255,255,0.75);
      cursor: pointer;
    }

    #volume-slider::-moz-range-thumb {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: rgba(255,255,255,0.75);
      border: none;
      cursor: pointer;
    }

    /* Chat panel */
    .chat-panel {
      background: rgba(12, 12, 12, 0.72);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.1);
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      padding: 0.5rem 0.8rem;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
    }

    .chat-header-left {
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .chat-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: rgba(255,255,255,0.5);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }

    .chat-label {
      font-size: 0.6rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
    }

    .chat-toggle {
      font-size: 0.65rem;
      color: rgba(255,255,255,0.25);
      line-height: 1;
      transition: color 0.15s;
    }

    .chat-header:hover .chat-toggle { color: rgba(255,255,255,0.6); }

    .chat-body {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: max-height 0.35s ease, opacity 0.25s ease;
      max-height: 400px;
      opacity: 1;
    }

    .chat-body.collapsed {
      max-height: 0;
      opacity: 0;
    }

    .chat-messages {
      height: 240px;
      overflow-y: auto;
      padding: 0.7rem 0.8rem;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      scroll-behavior: smooth;
    }

    .chat-messages::-webkit-scrollbar { width: 2px; }
    .chat-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); }

    .message { display: flex; flex-direction: column; gap: 0.08rem; }

    .message .sender {
      font-size: 0.56rem;
      color: rgba(255,255,255,0.38);
      letter-spacing: 0.06em;
    }

    .message .text {
      font-size: 0.78rem;
      color: rgba(255,255,255,0.85);
      line-height: 1.4;
      word-break: break-word;
    }

    .message.system .sender { color: rgba(255,255,255,0.22); }
    .message.system .text   { color: rgba(255,255,255,0.35); font-style: italic; font-size: 0.73rem; }

    .chat-input-area {
      border-top: 1px solid rgba(255,255,255,0.07);
      display: flex;
      align-items: center;
    }

    .chat-input-area input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      padding: 0.52rem 0.75rem;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.76rem;
      color: rgba(255,255,255,0.85);
    }

    .chat-input-area input::placeholder { color: rgba(255,255,255,0.2); }

    .chat-input-area button {
      background: none;
      border: none;
      border-left: 1px solid rgba(255,255,255,0.07);
      padding: 0.52rem 0.8rem;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.58rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
      cursor: pointer;
      transition: color 0.15s;
      flex-shrink: 0;
    }

    .chat-input-area button:hover { color: rgba(255,255,255,0.8); }
  </style>
</head>
<body>

  <!-- Full-screen VDO.ninja player -->
  <iframe
    id="live-player"
    src=""
    allow="autoplay;camera;microphone;fullscreen;picture-in-picture;display-capture;midi;encrypted-media"
    title="Fur FM live stream"
  ></iframe>

  <!-- Bottom-right overlay -->
  <div class="overlay" id="overlay" style="opacity:0">

    <!-- Volume -->
    <div class="volume-bar">
      <span class="vol-label">vol</span>
      <svg class="vol-icon" id="mute-btn" width="14" height="14" viewBox="0 0 24 24"
           fill="none" stroke="white" stroke-width="2" stroke-linecap="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
        <path id="vol-wave" d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
      </svg>
      <input type="range" id="volume-slider" min="0" max="100" value="100" />
    </div>

    <!-- Chat -->
    <div class="chat-panel">
      <div class="chat-header" id="chat-header">
        <div class="chat-header-left">
          <div class="chat-dot"></div>
          <span class="chat-label">chat</span>
        </div>
        <span class="chat-toggle" id="chat-toggle">▼</span>
      </div>

      <div class="chat-body" id="chat-body">
        <div class="chat-messages" id="chat-messages" role="log" aria-live="polite">
          <div class="message system">
            <span class="sender">fur fm</span>
            <span class="text">welcome. say hello.</span>
          </div>
        </div>
        <div class="chat-input-area">
          <input type="text" id="chat-input" placeholder="say something…"
                 maxlength="200" autocomplete="off" />
          <button id="send-btn">send</button>
        </div>
      </div>
    </div>

  </div>

  <script>
  (async () => {
    const { createClient } = window.supabase;
    const db = createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

    /* ── Auth gate ── */
    const { data: { session } } = await db.auth.getSession();
    if (!session) { window.location.replace('index.html'); return; }

    const user     = session.user;
    const userName = user.user_metadata?.username || user.email?.split('@')[0] || 'Listener';

    let myUserId = null;
    const { data: profile } = await db.from('users').select('id').eq('auth_id', user.id).single();
    if (profile) myUserId = profile.id;

    const sessionId = new Date().toISOString().slice(0, 10);

    /* ── VDO.ninja player ── */
    const VDO_STREAM_ID = 'fursatfm';
    document.getElementById('live-player').src =
      `https://vdo.ninja/?view=${VDO_STREAM_ID}&cleanoutput&autoplay&label=0`;

    /* ── Entrance animation ── */
    gsap.to('#overlay', { opacity: 1, y: 0, duration: 0.5, ease: 'power2.out', delay: 0.3 });
    gsap.set('#overlay', { y: 12 });

    /* ── Volume control via VDO.ninja postMessage ── */
    const player    = document.getElementById('live-player');
    const slider    = document.getElementById('volume-slider');
    const muteBtn   = document.getElementById('mute-btn');
    const volWave   = document.getElementById('vol-wave');
    let muted       = false;
    let lastVol     = 100;

    function sendVolume(vol) {
      try {
        player.contentWindow.postMessage({ volume: vol / 100 }, '*');
      } catch (_) {}
    }

    slider.addEventListener('input', () => {
      const v = parseInt(slider.value, 10);
      sendVolume(v);
      muted = v === 0;
      volWave.style.opacity = muted ? '0' : '1';
      if (v > 0) lastVol = v;
    });

    muteBtn.addEventListener('click', () => {
      if (muted) {
        slider.value = lastVol;
        sendVolume(lastVol);
        muted = false;
        volWave.style.opacity = '1';
      } else {
        lastVol = parseInt(slider.value, 10) || 100;
        slider.value = 0;
        sendVolume(0);
        muted = true;
        volWave.style.opacity = '0';
      }
    });

    /* ── Chat collapse toggle ── */
    const chatBody   = document.getElementById('chat-body');
    const chatToggle = document.getElementById('chat-toggle');
    let collapsed    = false;

    document.getElementById('chat-header').addEventListener('click', () => {
      collapsed = !collapsed;
      chatBody.classList.toggle('collapsed', collapsed);
      chatToggle.textContent = collapsed ? '▲' : '▼';
    });

    /* ── Chat helpers ── */
    function esc(s) {
      return String(s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    const log   = document.getElementById('chat-messages');
    const input = document.getElementById('chat-input');
    const btn   = document.getElementById('send-btn');

    function appendMessage(sender, text, type = 'user') {
      const msg = document.createElement('div');
      msg.className = `message${type === 'system' ? ' system' : ''}`;
      msg.innerHTML =
        `<span class="sender">${esc(sender)}</span>` +
        `<span class="text">${esc(text)}</span>`;
      gsap.set(msg, { opacity: 0 });
      log.appendChild(msg);
      gsap.to(msg, { opacity: 1, duration: 0.2, ease: 'power2.out' });
      log.scrollTop = log.scrollHeight;
    }

    /* ── Load history ── */
    const { data: history } = await db
      .from('chat_messages')
      .select('user_id, username, content')
      .eq('session_id', sessionId)
      .order('created_at', { ascending: true })
      .limit(100);

    if (history && history.length > 0) {
      log.innerHTML = '';
      history.forEach(m => appendMessage(m.username || 'Listener', m.content));
    }

    /* ── Real-time subscription ── */
    db.channel(`chat:${sessionId}`)
      .on('postgres_changes', {
        event: 'INSERT', schema: 'public', table: 'chat_messages',
        filter: `session_id=eq.${sessionId}`,
      }, payload => {
        if (payload.new.user_id !== myUserId) {
          appendMessage(payload.new.username || 'Listener', payload.new.content);
        }
      })
      .subscribe();

    /* ── Send message ── */
    async function send() {
      const text = input.value.trim();
      if (!text) return;
      appendMessage(userName, text);
      input.value = '';
      input.focus();
      await db.from('chat_messages').insert({
        user_id:    myUserId,
        username:   userName,
        content:    text,
        session_id: sessionId,
      });
    }

    btn.addEventListener('click', send);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    });

  })();
  </script>

</body>
</html>
