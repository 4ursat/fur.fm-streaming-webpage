<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fur FM</title>
  <link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500&family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap" rel="stylesheet">
  <script src="supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #0d1c15;
      font-family: 'Courier New', Courier, monospace;
      color: #f0e0a8;
      -webkit-tap-highlight-color: transparent;
    }

    /* Dot-grid texture — matches landing page */
    body::after {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background-image: radial-gradient(circle, rgba(200,144,32,0.045) 1px, transparent 1px);
      background-size: 26px 26px;
      pointer-events: none;
    }

    /* ── Stage: full viewport ── */
    .stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 1;
    }

    #obs-player {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      border: none; display: block;
    }

    /* ── Overlays — absolute inside stage (= fixed to viewport) ── */
    .ov {
      position: absolute;
      z-index: 10;
      pointer-events: none;
    }

    /* Top-left: Logo only */
    .ov-tl { top: 2rem; left: 1.8rem; }

    .logo { display: flex; align-items: center; gap: 0.55rem; }
    .logo-name {
      font-size: 1.15rem; font-weight: bold; letter-spacing: 0.09em;
      color: #f0e0a8; line-height: 1;
    }
    .logo-dot {
      display: inline-block; width: 4px; height: 4px;
      background: #e07828; border-radius: 50%;
      vertical-align: middle; margin: 0 0.16em;
      position: relative; top: -1px;
    }

    /* Live rings — match landing page stroke colours */
    #ring-inner  { opacity: 0.55; }
    #ring-mid    { opacity: 0.35; }
    #ring-outer  { opacity: 0.18; }
    .logo.is-live #ring-inner { animation: ring-broadcast 2.4s ease-in-out infinite; }
    .logo.is-live #ring-mid   { animation: ring-broadcast 2.4s ease-in-out 0.5s infinite; }
    .logo.is-live #ring-outer { animation: ring-broadcast 2.4s ease-in-out 1s infinite; }
    @keyframes ring-broadcast {
      0%, 100% { opacity: 0.04; }
      40%      { opacity: 0.85; }
    }

    /* Top-right: Session info */
    .ov-tr { top: 2rem; right: 1.8rem; text-align: right; max-width: 46%; }
    .session-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.1rem; font-weight: 300; font-style: italic;
      color: #f0e0a8;
    }
    .session-timer {
      font-size: 0.88rem; letter-spacing: 0.14em;
      color: rgba(200,144,32,0.65);
      margin-top: 0.2rem;
      font-variant-numeric: tabular-nums;
    }

    /* Bottom-left: Listener count + leave */
    .ov-bl {
      bottom: 1.8rem; left: 1.8rem;
      display: flex; flex-direction: column; gap: 0.45rem;
    }
    .listener-count {
      font-size: 0.75rem; letter-spacing: 0.05em;
      color: #c89020; font-style: italic;
    }
    .nav-leave {
      background: none; border: none; padding: 0;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.66rem; letter-spacing: 0.1em; text-transform: uppercase;
      color: rgba(200,144,32,0.35); cursor: pointer;
      transition: color 0.2s; pointer-events: all; text-align: left;
    }
    .nav-leave:hover { color: #f0e0a8; }

    /* Bottom-right: Chat */
    .ov-br {
      bottom: 1.8rem; right: 1.8rem;
      width: min(250px, calc(44% - 1.8rem));
      pointer-events: all;
      display: flex; flex-direction: column;
    }
    .messages {
      max-height: 180px; overflow-y: auto;
      display: flex; flex-direction: column; gap: 0.55rem;
      padding: 0.65rem 0.75rem 0.55rem;
      background: rgba(13,28,21,0.52);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      scrollbar-width: none;
    }
    .messages::-webkit-scrollbar { display: none; }
    .msg { display: flex; flex-direction: column; gap: 0.04rem; }
    .msg-sender {
      font-size: 0.7rem; letter-spacing: 0.06em;
      color: #c89020;
    }
    .msg-text {
      font-size: 0.84rem; color: #f0e0a8;
      line-height: 1.45; word-break: break-word;
    }
    .msg.system .msg-sender { color: rgba(200,144,32,0.42); }
    .msg.system .msg-text {
      font-style: italic; color: rgba(240,224,168,0.45); font-size: 0.72rem;
    }
    .chat-input-area {
      background: rgba(13,28,21,0.62);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 0.42rem 0.75rem 0.48rem;
      display: flex; align-items: center; gap: 0.5rem;
      border-top: 1px solid rgba(200,144,32,0.1);
    }
    .chat-input-area input {
      flex: 1; background: transparent; border: none;
      border-bottom: 1px solid rgba(200,144,32,0.32);
      outline: none; padding: 0.14rem 0;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.8rem; font-style: italic;
      color: #f0e0a8;
    }
    .chat-input-area input::placeholder { color: rgba(200,144,32,0.38); }
    .send-btn {
      background: none; border: none; padding: 0; flex-shrink: 0;
      font-size: 0.9rem; color: #c89020; cursor: pointer;
      transition: color 0.2s; line-height: 1;
    }
    .send-btn:hover { color: #f0e0a8; }

    /* Fullscreen — subtle, bottom-right below chat would overlap, so top of chat area */
    .nav-fullscreen {
      background: none; border: none; padding: 0;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.6rem; letter-spacing: 0.08em; text-transform: uppercase;
      color: rgba(200,144,32,0.3); cursor: pointer; transition: color 0.2s;
      pointer-events: all; display: block; text-align: right;
      margin-bottom: 0.35rem;
    }
    .nav-fullscreen:hover { color: #f0e0a8; }

    /* ── Now Playing — top-centre, aligned with logo/timer ── */
    .np-bar {
      position: absolute;
      top: 2rem; left: 50%; transform: translateX(-50%);
      z-index: 9; pointer-events: none;
      display: none; flex-direction: column; align-items: center;
      gap: 0.2rem; text-align: center;
      width: min(380px, 42vw);
    }
    .np-bar.visible { display: flex; }
    .np-track-line {
      font-size: 0.95rem; font-weight: bold; letter-spacing: 0.03em;
      color: #f0e0a8;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      width: 100%;
    }
    .np-meta-line {
      font-size: 0.72rem; letter-spacing: 0.06em;
      color: #c89020;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      width: 100%;
    }
    .np-translation {
      font-size: 0.72rem; font-style: italic;
      color: rgba(240,224,168,0.6); line-height: 1.5;
      display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden;
      width: 100%;
    }
    .np-player-row {
      display: flex; align-items: center; gap: 0.65rem;
      margin-top: 0.2rem; width: 100%;
    }
    .np-progress-wrap {
      flex: 1; height: 3px;
      background: rgba(200,144,32,0.18);
      position: relative; overflow: hidden;
    }
    .np-progress-fill {
      position: absolute; left: 0; top: 0; bottom: 0;
      background: #e07828; width: 0%;
      transition: width 0.8s linear;
    }
    .np-time {
      font-size: 0.64rem; color: rgba(200,144,32,0.6);
      font-variant-numeric: tabular-nums; letter-spacing: 0.06em;
      white-space: nowrap; flex-shrink: 0;
    }

    /* Archive image bg */
    .np-image-bg {
      position: absolute; inset: 0; z-index: 0;
      background-size: cover; background-position: center;
      opacity: 0; transition: opacity 0.6s;
    }
    .np-image-bg.show { opacity: 0.28; }

    /* ── Standby screen ── */
    #standby-screen {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #0d1c15; z-index: 1;
    }
    .standby-inner {
      text-align: center;
      color: rgba(200,144,32,0.25);
      letter-spacing: 0.2em;
    }
    .standby-inner .s-name {
      font-size: 1.1rem; font-weight: 700; margin-bottom: 0.55rem;
    }
    .standby-inner .s-sub {
      font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.24em;
    }

    /* ── Join toast ── */
    .join-toast {
      position: fixed; bottom: 2.5rem; left: 50%;
      transform: translateX(-50%) translateY(8px);
      z-index: 50; pointer-events: none;
      font-size: 0.64rem; letter-spacing: 0.1em;
      color: rgba(240,224,168,0.75);
      background: rgba(13,28,21,0.82);
      border: 1px solid rgba(200,144,32,0.18);
      padding: 0.32rem 0.85rem;
      opacity: 0; white-space: nowrap;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }
    .join-toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── Audio unlock prompt ── */
    .audio-prompt {
      position: fixed; bottom: 1.8rem; left: 50%;
      transform: translateX(-50%);
      z-index: 80; display: none; align-items: center; gap: 0.5rem;
      background: rgba(13,28,21,0.95);
      border: 1px solid rgba(200,144,32,0.28);
      color: #f0e0a8;
      font-size: 0.62rem; letter-spacing: 0.12em; text-transform: uppercase;
      padding: 0.5rem 1rem; cursor: pointer;
    }
    .audio-prompt.visible { display: flex; }

    /* ── iOS tap-to-watch ── */
    .tap-overlay {
      position: absolute; inset: 0; z-index: 5;
      display: flex; align-items: center; justify-content: center;
      background: rgba(13,28,21,0.65); cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .tap-overlay span {
      font-size: 0.76rem; letter-spacing: 0.22em; text-transform: uppercase;
      color: rgba(240,224,168,0.85);
      border: 1px solid rgba(200,144,32,0.3);
      padding: 0.5rem 1.3rem;
    }

    /* ── Mobile ── */
    @media (max-width: 600px) {
      .ov-tl { top: 1.2rem; left: 1rem; }
      .ov-tr { top: 1.2rem; right: 1rem; }
      .ov-bl { bottom: 1rem; left: 1rem; }
      .ov-br { bottom: 1rem; right: 1rem; width: min(190px, calc(56% - 1rem)); }
      .messages { max-height: 90px; }
      .np-bar { width: min(260px, 64vw); top: 1.2rem; }
      .np-track-line { font-size: 0.82rem; }
      .session-title { font-size: 0.9rem; }
      .session-timer { font-size: 0.74rem; }
      .logo-name { font-size: 0.95rem; }
    }

    @media (max-height: 480px) and (orientation: landscape) {
      .ov-br { bottom: 0.5rem; }
      .ov-bl { bottom: 0.5rem; }
    }

    /* ── Auth / OTP modal ── */
    #auth-modal {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(13,28,21,0.98);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity 0.28s ease;
    }
    #auth-modal.open { opacity: 1; pointer-events: auto; }
    #auth-panel {
      position: relative;
      width: 100%; max-width: 280px;
      padding: 0 1.5rem;
      display: flex; flex-direction: column;
    }
    .auth-back-link {
      position: absolute; top: -2.4rem; left: 1.5rem;
      font-size: 0.66rem; letter-spacing: 0.08em; text-transform: uppercase;
      color: rgba(200,144,32,0.4); cursor: pointer;
      background: none; border: none; font-family: inherit;
      transition: color 0.15s; touch-action: manipulation;
    }
    .auth-back-link:hover { color: #f0e0a8; }
    .join-heading {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1rem; font-weight: 300; font-style: italic;
      letter-spacing: 0.02em; color: #f0e0a8;
      margin-bottom: 0.35rem;
    }
    .join-sub {
      font-size: 0.72rem; color: #c89020;
      margin-bottom: 1.4rem; line-height: 1.55;
    }
    .join-input {
      background: transparent; border: none;
      border-bottom: 1px solid #c89020;
      color: #f0e0a8;
      font-family: 'Courier New', Courier, monospace; font-size: 0.9rem;
      padding: 0.4rem 0; outline: none; width: 100%;
      margin-bottom: 1.2rem;
    }
    .join-input::placeholder { color: rgba(200,144,32,0.4); }
    .join-submit {
      background: transparent; border: none;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.8rem; letter-spacing: 0.05em;
      color: #e07828; cursor: pointer; padding: 0; text-align: left;
      touch-action: manipulation; transition: color 0.15s;
    }
    .join-submit:hover { color: #f0e0a8; }
    .join-submit:disabled { color: rgba(200,144,32,0.3); cursor: default; }
    .join-err {
      font-size: 0.68rem; color: #e05030;
      margin-top: 0.8rem; min-height: 1rem; line-height: 1.5;
    }
    .join-back-step {
      font-size: 0.68rem; color: #c89020;
      cursor: pointer; background: none; border: none;
      font-family: inherit; padding: 0; margin-top: 1.2rem;
      touch-action: manipulation;
    }
    .join-back-step:hover { color: #f0e0a8; }
  </style>
</head>
<body>

<!-- Full-viewport stage -->
<div class="stage">

  <div id="standby-screen">
    <div class="standby-inner">
      <div class="s-name">FUR · FM</div>
      <div class="s-sub">not currently live</div>
    </div>
  </div>

  <iframe
    id="obs-player"
    src="https://vdo.ninja/?view=xYuuWBy&label=ffm_listening_room&cleanoutput&autoplay"
    allow="autoplay;camera;microphone;fullscreen;picture-in-picture;display-capture;midi;encrypted-media"
    allowfullscreen
    title="Fur FM live stream"
    style="display:none"
  ></iframe>

  <!-- iOS tap-to-watch -->
  <div class="tap-overlay" id="tap-overlay" style="display:none">
    <span>tap to watch</span>
  </div>

  <!-- Scene layer -->
  <div id="scene-layer" style="display:none; position:absolute; inset:0; z-index:3; pointer-events:none; overflow:hidden;"></div>

  <!-- Archive image background -->
  <div class="np-image-bg" id="np-image-bg"></div>

  <!-- Now Playing bar (bottom gradient overlay) -->
  <div class="np-bar" id="np-bar">
    <div class="np-track-line" id="np-track-line"></div>
    <div class="np-meta-line" id="np-meta-line"></div>
    <div class="np-player-row" id="np-player-row" style="display:none">
      <div class="np-progress-wrap">
        <div class="np-progress-fill" id="np-progress-fill"></div>
      </div>
      <span class="np-time" id="np-time">0:00 / 0:00</span>
    </div>
    <div class="np-translation" id="np-translation" style="display:none"></div>
  </div>

  <!-- Top-left: Logo -->
  <div class="ov ov-tl">
    <div class="logo" id="live-badge">
      <svg viewBox="0 0 36 20" width="22" height="13" fill="none">
        <defs>
          <clipPath id="ov-rings-clip">
            <rect x="-500" y="-1000" width="1000" height="1014"/>
          </clipPath>
        </defs>
        <g clip-path="url(#ov-rings-clip)">
          <circle id="ring-inner" cx="18" cy="11" r="6"  stroke="#f0e0a8" stroke-width="1.3"/>
          <circle id="ring-mid"   cx="18" cy="11" r="11" stroke="#f0e0a8" stroke-width="1.0"/>
          <circle id="ring-outer" cx="18" cy="11" r="16" stroke="#f0e0a8" stroke-width="0.75"/>
        </g>
        <circle cx="18" cy="11" r="2.2" fill="#e07828"/>
      </svg>
      <div class="logo-name">FUR<span class="logo-dot"></span>FM</div>
    </div>
  </div>

  <!-- Top-right: Session info -->
  <div class="ov ov-tr">
    <div class="session-title" id="prog-title">Live Session</div>
    <div class="session-timer" id="session-timer">00:00:00</div>
  </div>

  <!-- Bottom-left: Listener count + leave -->
  <div class="ov ov-bl">
    <div class="listener-count" id="listener-count">—</div>
    <button class="nav-leave">leave quietly</button>
  </div>

  <!-- Bottom-right: Chat + fullscreen -->
  <div class="ov ov-br">
    <button class="nav-fullscreen">⤢ fullscreen</button>
    <div class="messages" id="chat-messages" role="log" aria-live="polite"></div>
    <div class="chat-input-area">
      <input type="text" id="chat-input" placeholder="whisper..."
             maxlength="200" autocomplete="off" />
      <button class="send-btn" id="send-btn">→</button>
    </div>
  </div>

</div><!-- /.stage -->

<audio id="np-audio" style="display:none" preload="auto"></audio>
<div class="audio-prompt" id="audio-prompt">tap to enable audio</div>

<!-- Auth / OTP modal — shown when user lands without a session -->
<div id="auth-modal">
  <div id="auth-panel">
    <button class="auth-back-link" id="auth-back-home">← back to home</button>

    <!-- Step 1: email -->
    <div id="auth-step-email">
      <div class="join-heading">join the session</div>
      <div class="join-sub">we'll send a one-time code to your email</div>
      <input class="join-input" id="auth-email" type="email" placeholder="your@email.com" autocomplete="email" />
      <button class="join-submit" id="auth-send">send code →</button>
      <div class="join-err" id="auth-err1"></div>
    </div>

    <!-- Step 2: OTP code -->
    <div id="auth-step-otp" style="display:none">
      <div class="join-heading">check your email</div>
      <div class="join-sub" id="auth-otp-sub">enter the 6-digit code we sent</div>
      <input class="join-input" id="auth-otp" type="text" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="one-time-code" />
      <button class="join-submit" id="auth-verify">verify →</button>
      <div class="join-err" id="auth-err2"></div>
      <button class="join-back-step" id="auth-step-back">← use a different email</button>
    </div>
  </div>
</div>

<script>
(async () => {
  const { createClient } = window.supabase;
  const db = createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

  /* ── iOS tap-to-watch ── */
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  if (isIOS) {
    const tapOverlay = document.getElementById('tap-overlay');
    const iframe     = document.getElementById('obs-player');
    tapOverlay.style.display = 'flex';
    tapOverlay.addEventListener('click', () => {
      tapOverlay.remove();
      iframe.src = iframe.src; /* reload inside gesture = iOS autoplay allowed */
    });
  }

  /* ── Auth gate ── */
  const isBroadcaster = window.location.hash === '#broadcast';
  let { data: { session } } = await db.auth.getSession();

  if (!session && !isBroadcaster) {
    // Show OTP modal inline — resolves once user authenticates
    session = await new Promise(resolve => {
      const modal      = document.getElementById('auth-modal');
      const stepEmail  = document.getElementById('auth-step-email');
      const stepOtp    = document.getElementById('auth-step-otp');
      const emailEl    = document.getElementById('auth-email');
      const sendBtn    = document.getElementById('auth-send');
      const otpEl      = document.getElementById('auth-otp');
      const verifyBtn  = document.getElementById('auth-verify');
      const err1       = document.getElementById('auth-err1');
      const err2       = document.getElementById('auth-err2');
      const otpSub     = document.getElementById('auth-otp-sub');
      const backHome   = document.getElementById('auth-back-home');
      const stepBack   = document.getElementById('auth-step-back');
      let   otpEmail   = '';

      modal.classList.add('open');
      setTimeout(() => emailEl.focus(), 80);

      backHome.addEventListener('click', () => { window.location.replace('index.html'); });

      stepBack.addEventListener('click', () => {
        stepOtp.style.display   = 'none';
        stepEmail.style.display = '';
        emailEl.focus();
      });

      async function sendOtp() {
        const email = emailEl.value.trim();
        if (!email || !email.includes('@')) { err1.textContent = 'enter a valid email address'; return; }
        err1.textContent  = '';
        sendBtn.disabled  = true;
        sendBtn.textContent = 'sending…';
        const { error } = await db.auth.signInWithOtp({ email, options: { shouldCreateUser: true } });
        sendBtn.disabled  = false;
        sendBtn.textContent = 'send code →';
        if (error) { err1.textContent = error.message; return; }
        otpEmail = email;
        otpSub.textContent      = `enter the code we sent to ${email}`;
        err2.textContent        = '';
        otpEl.value             = '';
        stepEmail.style.display = 'none';
        stepOtp.style.display   = '';
        setTimeout(() => otpEl.focus(), 50);
      }

      async function verifyOtp() {
        const token = otpEl.value.trim().replace(/\D/g, '');
        if (token.length < 6) { err2.textContent = 'enter the 6-digit code from your email'; return; }
        err2.textContent       = '';
        verifyBtn.disabled     = true;
        verifyBtn.textContent  = 'verifying…';
        const { data, error } = await db.auth.verifyOtp({ email: otpEmail, token, type: 'email' });
        verifyBtn.disabled     = false;
        verifyBtn.textContent  = 'verify →';
        if (error) { err2.textContent = error.message; return; }
        modal.classList.remove('open');
        resolve(data.session);
      }

      sendBtn.addEventListener('click', sendOtp);
      emailEl.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); sendOtp(); } });
      verifyBtn.addEventListener('click', verifyOtp);
      otpEl.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); verifyOtp(); } });
    });

    if (!session) return;
  }

  const user = session?.user || null;
  let userName = user?.user_metadata?.username || user?.email?.split('@')[0] || (isBroadcaster ? 'Broadcaster' : 'Listener');

  let myUserId = null;
  if (user) {
    const { data: profile } = await db.from('users').select('id, name').eq('auth_id', user.id).single();
    if (profile) {
      myUserId = profile.id;
      if (profile.name) userName = profile.name;
    }
  }

  const sessionId = new Date().toISOString().slice(0, 10);
  const countEl   = document.getElementById('listener-count');
  let dbSessionId  = null;

  /* ── User interaction gate for audio autoplay ── */
  let userHasInteracted = false;
  document.addEventListener('click', () => { userHasInteracted = true; }, { once: true, capture: true });

  /* ── Live badge ── */
  const liveBadge = document.getElementById('live-badge');
  function setLive(isLive) { liveBadge.classList.toggle('is-live', isLive); }

  /* Track whether vdo.ninja already wrote stream_started_at this session
     to prevent repeated reconnect events from resetting the timer */
  let _vdoDidStartTimer = false;
  window.addEventListener('message', e => {
    if (!String(e.origin).includes('vdo.ninja')) return;
    const msg = e.data; if (!msg) return;
    const action = msg.action || msg.type || '';
    if (/view|join|connect|stream/i.test(action)) {
      setLive(true);
      if (dbSessionId && !timerInterval && !_vdoDidStartTimer) {
        _vdoDidStartTimer = true;
        db.from('sessions').update({ stream_started_at: new Date().toISOString() })
          .eq('id', dbSessionId).is('stream_started_at', null).then(() => {});
      }
    }
    if (/hangup|disconnect|leave/i.test(action)) {
      setLive(false);
    }
  });

  /* ── Leave quietly ── */
  document.querySelector('.nav-leave').addEventListener('click', async () => {
    await db.auth.signOut();
    window.location.href = 'index.html';
  });

  /* ── Fullscreen ── */
  const fsBtn = document.querySelector('.nav-fullscreen');
  fsBtn.addEventListener('click', () => {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen().catch(() => {});
    }
  });
  document.addEventListener('fullscreenchange', () => {
    fsBtn.textContent = document.fullscreenElement ? '↙ exit fullscreen' : '⤢ fullscreen';
  });

  /* ── Chat ── */
  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  const log   = document.getElementById('chat-messages');
  const input = document.getElementById('chat-input');
  const btn   = document.getElementById('send-btn');

  function appendMessage(sender, text, type = 'user') {
    const msg = document.createElement('div');
    msg.className = `msg${type === 'system' ? ' system' : ''}`;
    msg.innerHTML = `<span class="msg-sender">${esc(sender)}</span><span class="msg-text">${esc(text)}</span>`;
    gsap.set(msg, { opacity: 0, y: 5 });
    log.appendChild(msg);
    gsap.to(msg, { opacity: 1, y: 0, duration: 0.3, ease: 'power2.out' });
    log.scrollTop = log.scrollHeight;
  }

  const { data: history } = await db
    .from('chat_messages')
    .select('user_id, username, content')
    .eq('session_id', sessionId)
    .order('created_at', { ascending: true })
    .limit(60);

  if (history && history.length > 0) {
    log.innerHTML = '';
    history.forEach(m => appendMessage(m.username || 'Listener', m.content));
  }

  /* Track IDs of messages we sent locally so we don't echo them
     when the realtime event arrives. Using IDs (not user_id) is the
     only safe way — broadcaster has user_id=null, same as unauthenticated
     listeners, so null !== null comparison fails silently. */
  const _sentMsgIds = new Set();

  db.channel('chat:stream')
    .on('postgres_changes', {
      event: 'INSERT', schema: 'public', table: 'chat_messages',
      // No server-side filter — Supabase requires REPLICA IDENTITY FULL
      // on non-PK columns for row filters; without it no events fire.
      // We filter client-side instead.
    }, payload => {
      if (_sentMsgIds.has(payload.new.id)) return; // skip our own echo
      appendMessage(payload.new.username || 'Listener', payload.new.content);
    })
    .subscribe();

  async function send() {
    const text = input.value.trim();
    if (!text) return;
    input.value = ''; input.focus();
    const { data: ins } = await db.from('chat_messages').insert({
      user_id: myUserId, username: userName,
      content: text, session_id: sessionId,
    }).select('id').single();
    // Show own message only after confirmed DB insert (so we have the ID)
    if (ins?.id) {
      _sentMsgIds.add(ins.id);
      appendMessage(userName, text);
    }
  }
  btn.addEventListener('click', send);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });

  /* ── Programme info + global timer ── */
  const timerEl     = document.getElementById('session-timer');
  const titleEl     = document.getElementById('prog-title');
  let timerInterval = null;

  function startTimerFrom(ts) {
    if (timerInterval) clearInterval(timerInterval);
    setLive(true);
    const startMs = new Date(ts).getTime();
    function tick() {
      const s = Math.max(0, Math.floor((Date.now() - startMs) / 1000));
      timerEl.textContent = [
        Math.floor(s / 3600),
        Math.floor((s % 3600) / 60),
        s % 60,
      ].map(n => String(n).padStart(2, '0')).join(':');
    }
    tick();
    timerInterval = setInterval(tick, 1000);
  }

  function stopTimer() {
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
    setLive(false);
    timerEl.textContent = '00:00:00';
  }

  /* Load current session */
  try {
    const { data: sessionRow } = await db
      .from('sessions')
      .select('id, title, stream_started_at')
      .order('date', { ascending: false })
      .limit(1)
      .single();
    if (sessionRow) {
      dbSessionId = sessionRow.id;
      if (sessionRow.title) titleEl.textContent = sessionRow.title;
      if (sessionRow.stream_started_at) startTimerFrom(sessionRow.stream_started_at);
    }
  } catch (_) {}

  /* Realtime: sync timer across all viewers */
  db.channel('sessions-timer')
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'sessions' }, payload => {
      if (!dbSessionId || payload.new.id !== dbSessionId) return;
      if (payload.new.stream_started_at) startTimerFrom(payload.new.stream_started_at);
      else stopTimer();
    }).subscribe();

  /* Click the timer to start/stop — only works with #broadcast in URL */
  if (window.location.hash === '#broadcast') {
    timerEl.parentElement.style.pointerEvents = 'all';
    timerEl.style.pointerEvents = 'all';
    timerEl.style.cursor = 'pointer';
    timerEl.style.outline = '1px solid rgba(200,144,32,0.3)';
    timerEl.style.padding = '0.1rem 0.3rem';
    timerEl.title = 'click to start / stop';
    timerEl.addEventListener('click', async () => {
      if (!dbSessionId) {
        if (timerInterval) stopTimer();
        else startTimerFrom(new Date().toISOString());
        return;
      }
      if (timerInterval) {
        await db.from('sessions').update({ stream_started_at: null }).eq('id', dbSessionId);
      } else {
        await db.from('sessions').update({ stream_started_at: new Date().toISOString() }).eq('id', dbSessionId);
      }
    });
  }

  /* ── Archival now-playing ── */
  const npBar          = document.getElementById('np-bar');
  const npTrackLine    = document.getElementById('np-track-line');
  const npMetaLine     = document.getElementById('np-meta-line');
  const npTranslation  = document.getElementById('np-translation');
  const npImageBg      = document.getElementById('np-image-bg');
  const npAudio        = document.getElementById('np-audio');
  const audioPrompt    = document.getElementById('audio-prompt');
  const npPlayerRow    = document.getElementById('np-player-row');
  const npProgressFill = document.getElementById('np-progress-fill');
  const npTimeEl       = document.getElementById('np-time');

  function fmtDur(s) {
    if (!s || isNaN(s)) return '0:00';
    const m = Math.floor(s / 60), sec = Math.floor(s % 60);
    return `${m}:${String(sec).padStart(2, '0')}`;
  }

  npAudio.addEventListener('timeupdate', () => {
    if (!npAudio.duration) return;
    npProgressFill.style.width = (npAudio.currentTime / npAudio.duration * 100) + '%';
    npTimeEl.textContent = `${fmtDur(npAudio.currentTime)} / ${fmtDur(npAudio.duration)}`;
  });

  /* ── Synced audio playback (archival tracks) ── */
  let wantPlaying = false;
  let wantUrl     = null;

  function attemptPlay() {
    npAudio.play().then(() => {
      audioPrompt.classList.remove('visible');
    }).catch(() => {
      audioPrompt.classList.add('visible');
    });
  }

  function syncAudio(d) {
    const url = d.audio_url || null;
    wantPlaying = !!d.is_playing;

    if (url !== wantUrl) {
      wantUrl = url;
      if (url) {
        npAudio.src = url;
        npAudio.currentTime = d.playhead_pos || 0;
      } else {
        npAudio.removeAttribute('src');
      }
    } else if (url && typeof d.playhead_pos === 'number'
               && Math.abs(npAudio.currentTime - d.playhead_pos) > 1.5) {
      npAudio.currentTime = d.playhead_pos;
    }

    if (wantPlaying && url) {
      // Only auto-play after a user gesture — prevents audio starting
      // mid-session because the DB still has is_playing=true from a
      // previous broadcast that wasn't cleanly stopped.
      if (npAudio.paused && userHasInteracted) attemptPlay();
    } else {
      npAudio.pause();
    }
  }

  document.addEventListener('click', () => {
    userHasInteracted = true;
    if (wantPlaying && npAudio.paused) attemptPlay();
  }, true);
  audioPrompt.addEventListener('click', () => attemptPlay());

  /* ── Scene renderer (incremental — never destroys live iframes) ── */
  const sceneLayer    = document.getElementById('scene-layer');
  const obsPlayer     = document.getElementById('obs-player');
  const standbyScreen = document.getElementById('standby-screen');
  const _sceneEls     = new Map(); // moduleId → DOM element

  function buildModuleEl(m) {
    const el = document.createElement('div');
    el.dataset.modId   = m.id;
    el.dataset.modType = m.type;
    el.style.cssText   = `position:absolute;left:${m.x}%;top:${m.y}%;width:${m.w}%;height:${m.h}%;overflow:hidden;`;
    if (m.type === 'video') {
      el.innerHTML = `<iframe src="https://vdo.ninja/?view=xYuuWBy&label=ffm_listening_room&cleanoutput&autoplay" style="width:100%;height:100%;border:none;display:block" allow="autoplay;camera;microphone" allowfullscreen></iframe>`;
    } else if (m.type === 'screen') {
      el.innerHTML = `<iframe src="https://vdo.ninja/?view=xYuuWBysc&cleanoutput&autoplay" style="width:100%;height:100%;border:none;display:block" allow="autoplay" allowfullscreen></iframe>`;
    } else if (m.type === 'text') {
      el.style.cssText += `color:#f0e0a8;white-space:pre-wrap;word-break:break-word;font-size:${m.config?.fontSize||16}px;padding:0.5em;font-family:'Hind',sans-serif;`;
      el.textContent = m.config?.content || '';
    } else if (m.type === 'image') {
      el.innerHTML = `<img src="${esc(m.config?.url||'')}" style="width:100%;height:100%;object-fit:contain;display:block;" alt=""/>`;
    }
    return el;
  }

  function renderScene(scene) {
    const mods = scene?.modules ?? [];

    if (!mods.length) {
      sceneLayer.style.display = 'none';
      if (standbyScreen) standbyScreen.style.display = '';
      _sceneEls.forEach(el => el.remove());
      _sceneEls.clear();
      return;
    }

    if (standbyScreen) standbyScreen.style.display = 'none';
    sceneLayer.style.display = 'block';

    const incoming = new Set(mods.map(m => m.id));

    /* Remove elements no longer in scene */
    _sceneEls.forEach((el, id) => {
      if (!incoming.has(id)) { el.remove(); _sceneEls.delete(id); }
    });

    /* Add or update each module */
    for (const m of mods) {
      let el = _sceneEls.get(m.id);

      if (!el || el.dataset.modType !== m.type) {
        /* New or type-changed module — create fresh */
        if (el) el.remove();
        el = buildModuleEl(m);
        sceneLayer.appendChild(el);
        _sceneEls.set(m.id, el);
      } else {
        /* Existing module — update position/size only, never touch iframes */
        el.style.left   = m.x + '%';
        el.style.top    = m.y + '%';
        el.style.width  = m.w + '%';
        el.style.height = m.h + '%';

        if (m.type === 'text') {
          const content = m.config?.content || '';
          if (el.textContent !== content) el.textContent = content;
        }
      }
    }
  }

  function applyNP(d) {
    if (!d) return;
    if ('scene' in d) renderScene(d.scene);
    syncAudio(d);

    const hasContent = d.track_title || d.artist;
    npBar.classList.toggle('visible', !!hasContent);

    const track = [d.track_title, d.artist].filter(Boolean).join(' — ');
    npTrackLine.textContent = track || '';

    const meta = [d.archive_source].filter(Boolean).join(' · ');
    npMetaLine.textContent = meta || '';

    if (d.translation) {
      npTranslation.textContent = d.translation;
      npTranslation.style.display = '';
    } else {
      npTranslation.style.display = 'none';
    }

    if (d.image_url) {
      npImageBg.style.backgroundImage = `url("${d.image_url.replace(/"/g,'%22')}")`;
      npImageBg.classList.add('show');
    } else {
      npImageBg.classList.remove('show');
    }

    npPlayerRow.style.display = (d.is_playing && d.audio_url) ? '' : 'none';
  }

  (async () => {
    const { data } = await db.from('now_playing')
      .select('*').eq('id', '00000000-0000-0000-0000-000000000001').maybeSingle();
    if (data) applyNP(data);
  })();

  db.channel('now-playing-listener')
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'now_playing' },
      payload => applyNP(payload.new))
    .subscribe();

  /* ── Presence ── */
  function showJoinToast(name) {
    const el = document.createElement('div');
    el.className = 'join-toast';
    el.textContent = `→ ${name} found their way in`;
    document.body.appendChild(el);
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('visible')));
    setTimeout(() => { el.classList.remove('visible'); setTimeout(() => el.remove(), 400); }, 3200);
  }

  const presenceChannel = db.channel('fur-fm:room');
  presenceChannel
    .on('presence', { event: 'sync' }, () => {
      const count = Object.keys(presenceChannel.presenceState()).length;
      countEl.textContent = count === 1 ? '1 listening' : `${count} listening`;
    })
    .on('presence', { event: 'join' }, ({ newPresences }) => {
      newPresences.forEach(p => {
        if (p.username && p.username !== userName) showJoinToast(p.username);
      });
    })
    .subscribe(async status => {
      if (status === 'SUBSCRIBED') await presenceChannel.track({ username: userName });
    });

})();
</script>

</body>
</html>
