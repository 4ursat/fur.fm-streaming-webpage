<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fur FM</title>
  <link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500&family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap" rel="stylesheet">
  <script src="supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #16140f;
      font-family: 'Courier New', Courier, monospace;
      color: #f2ede0;
      -webkit-tap-highlight-color: transparent;
    }

    /* Grain texture — same speckle tile as every other page. A gentle
       twinkle (jump-cut, not a slide — real film grain doesn't glide) is
       the one bit of motion on an otherwise still page. */
    body::after {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background-image: url('grain.png');
      background-repeat: repeat;
      opacity: 0.32;
      pointer-events: none;
      animation: grain-twinkle 6s steps(6) infinite;
    }
    @keyframes grain-twinkle {
      0%   { background-position: 0 0; }
      16%  { background-position: -18px 7px; }
      33%  { background-position: 9px -14px; }
      50%  { background-position: -7px 17px; }
      66%  { background-position: 14px 9px; }
      83%  { background-position: -11px -6px; }
      100% { background-position: 0 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      body::after { animation: none; }
    }

    /* ── Stage: full viewport ── */
    .stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 1;
    }

    #obs-player {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      border: none; display: block;
    }

    /* ── Overlays — absolute inside stage (= fixed to viewport) ── */
    .ov {
      position: absolute;
      z-index: 10;
      pointer-events: none;
    }

    /* Top-right: Session info */
    .ov-tr { top: 2rem; right: 1.8rem; text-align: right; max-width: 46%; }
    .session-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.1rem; font-weight: 300; font-style: italic;
      color: #f2ede0;
    }
    /* Bottom-left: Chat */
    .ov-bl {
      bottom: 1.8rem; left: 1.8rem;
      width: min(250px, calc(44% - 1.8rem));
      pointer-events: all;
      display: flex; flex-direction: column;
    }
    .chat-name-row {
      background: rgba(22,20,15,0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 0.42rem 0.75rem 0.48rem;
      display: flex; align-items: center; gap: 0.5rem;
      border-bottom: 1px solid rgba(242,237,224,0.12);
    }
    .chat-name-row input {
      flex: 1; background: transparent; border: none;
      outline: none; padding: 0.14rem 0;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.8rem; font-style: italic;
      color: #f2ede0;
    }
    .chat-name-row input::placeholder { color: rgba(242,237,224,0.38); }
    .name-confirm {
      background: none; border: none; padding: 0; flex-shrink: 0;
      font-size: 0.9rem; color: #a89f8c; cursor: pointer;
      transition: color 0.2s; line-height: 1;
    }
    .name-confirm:hover { color: #f2ede0; }
    .messages {
      max-height: 180px; overflow-y: auto;
      display: flex; flex-direction: column; gap: 0.55rem;
      padding: 0.65rem 0.75rem 0.55rem;
      background: rgba(22,20,15,0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      scrollbar-width: none;
    }
    .messages::-webkit-scrollbar { display: none; }
    .msg { display: flex; flex-direction: column; gap: 0.04rem; }
    .msg-sender {
      font-size: 0.7rem; letter-spacing: 0.06em;
      color: #a89f8c;
    }
    .msg-text {
      font-size: 0.84rem; color: #f2ede0;
      line-height: 1.45; word-break: break-word;
    }
    .msg.system .msg-sender { color: rgba(242,237,224,0.42); }
    .msg.system .msg-text {
      font-style: italic; color: rgba(242,237,224,0.45); font-size: 0.72rem;
    }
    .chat-input-area {
      background: rgba(22,20,15,0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 0.42rem 0.75rem 0.48rem;
      display: flex; align-items: center; gap: 0.5rem;
      border-top: 1px solid rgba(242,237,224,0.12);
    }
    .chat-input-area input {
      flex: 1; background: transparent; border: none;
      border-bottom: 1px solid rgba(242,237,224,0.32);
      outline: none; padding: 0.14rem 0;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.8rem; font-style: italic;
      color: #f2ede0;
    }
    .chat-input-area input::placeholder { color: rgba(242,237,224,0.38); }
    .send-btn {
      background: none; border: none; padding: 0; flex-shrink: 0;
      font-size: 0.9rem; color: #a89f8c; cursor: pointer;
      transition: color 0.2s; line-height: 1;
    }
    .send-btn:hover { color: #f2ede0; }

    /* Bottom-right: Leave */
    .ov-br {
      bottom: 1.8rem; right: 1.8rem;
      pointer-events: all;
    }
    .nav-leave {
      background: none; border: none; padding: 0;
      width: 1.3rem; height: 1.3rem;
      display: flex; align-items: center; justify-content: center;
      color: rgba(242,237,224,0.35); cursor: pointer;
      transition: color 0.2s; pointer-events: all;
    }
    .nav-leave svg { width: 100%; height: 100%; display: block; }
    .nav-leave:hover { color: #f2ede0; }

    /* Archive image bg */
    .np-image-bg {
      position: absolute; inset: 0; z-index: 0;
      background-size: cover; background-position: center;
      opacity: 0; transition: opacity 0.6s;
    }
    .np-image-bg.show { opacity: 0.28; }

    /* ── Scene modules (broadcaster-placed video/screen/text/image) ──
       Physics-driven: each one drops in under gravity and settles (heavier
       types thud, lighter ones bounce a little), then hangs and sways like
       it's on a string once at rest. Grab and fling one and it drifts with
       real momentum before easing back home. No CSS transition here on
       purpose — the transform is set fresh every animation frame by the
       physics loop below, and a transition would fight that. */
    .scene-module {
      pointer-events: auto;
      border-radius: 4px;
      cursor: grab;
      touch-action: none;
    }
    .scene-module.dragging { cursor: grabbing; }

    /* ── Audio unlock prompt ── */
    .audio-prompt {
      position: fixed; bottom: 1.8rem; left: 50%;
      transform: translateX(-50%);
      z-index: 80; display: none; align-items: center; gap: 0.5rem;
      background: rgba(22,20,15,0.95);
      border: 1px solid rgba(242,237,224,0.28);
      color: #f2ede0;
      font-size: 0.62rem; letter-spacing: 0.12em; text-transform: uppercase;
      padding: 0.5rem 1rem; cursor: pointer;
    }
    .audio-prompt.visible { display: flex; }

    /* ── iOS tap-to-watch ── */
    .tap-overlay {
      position: absolute; inset: 0; z-index: 5;
      display: flex; align-items: center; justify-content: center;
      background: rgba(22,20,15,0.75); cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .tap-overlay span {
      font-size: 0.76rem; letter-spacing: 0.22em; text-transform: uppercase;
      color: rgba(242,237,224,0.9);
      border: 1px solid rgba(242,237,224,0.3);
      padding: 0.5rem 1.3rem;
    }

    /* ── Mobile ── */
    @media (max-width: 600px) {
      .ov-tr { top: 1.2rem; right: 1rem; max-width: 55%; }
      .ov-bl { bottom: 1rem; left: 1rem; width: min(190px, calc(56% - 1rem)); }
      .ov-br { bottom: 1rem; right: 1rem; }
      .messages { max-height: 90px; }
      .session-title { font-size: 0.9rem; }
    }

    @media (max-height: 480px) and (orientation: landscape) {
      .ov-br { bottom: 0.5rem; }
      .ov-bl { bottom: 0.5rem; }
    }

  </style>
</head>
<body>

<!-- Full-viewport stage -->
<div class="stage">

  <iframe
    id="obs-player"
    src="https://vdo.ninja/?view=xYuuWBy&label=ffm_listening_room&cleanoutput&autoplay"
    allow="autoplay;camera;microphone;fullscreen;picture-in-picture;display-capture;midi;encrypted-media"
    allowfullscreen
    title="Fur FM live stream"
    style="display:none"
  ></iframe>

  <!-- iOS tap-to-watch -->
  <div class="tap-overlay" id="tap-overlay" style="display:none">
    <span>tap to watch</span>
  </div>

  <!-- Scene layer -->
  <div id="scene-layer" style="display:none; position:absolute; inset:0; z-index:3; pointer-events:none; overflow:hidden;"></div>

  <!-- Archive image background -->
  <div class="np-image-bg" id="np-image-bg"></div>

  <!-- Top-right: Session name -->
  <div class="ov ov-tr">
    <div class="session-title" id="prog-title">Live Session</div>
  </div>

  <!-- Bottom-left: Chat -->
  <div class="ov ov-bl">
    <div class="chat-name-row" id="chat-name-row">
      <input type="text" id="name-input" placeholder="choose a name" maxlength="24" autocomplete="off" />
      <button class="name-confirm" id="name-confirm">→</button>
    </div>
    <div class="messages" id="chat-messages" role="log" aria-live="polite"></div>
    <div class="chat-input-area">
      <input type="text" id="chat-input" placeholder="whisper..."
             maxlength="200" autocomplete="off" />
      <button class="send-btn" id="send-btn">→</button>
    </div>
  </div>

  <!-- Bottom-right: Leave -->
  <div class="ov ov-br">
    <button class="nav-leave" title="leave quietly" aria-label="leave quietly">
      <svg viewBox="0 0 20 20" fill="none"><path d="M8 3.5H5a1.2 1.2 0 0 0-1.2 1.2v10.6A1.2 1.2 0 0 0 5 16.5h3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M8.5 10h8m0 0-2.8-2.8M16.5 10l-2.8 2.8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

</div><!-- /.stage -->

<audio id="np-audio" style="display:none" preload="auto"></audio>
<div class="audio-prompt" id="audio-prompt">tap to enable audio</div>

<script>
(async () => {
  const { createClient } = window.supabase;
  const db = createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

  /* ── iOS tap-to-watch ── */
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  if (isIOS) {
    const tapOverlay = document.getElementById('tap-overlay');
    const iframe     = document.getElementById('obs-player');
    tapOverlay.style.display = 'flex';
    tapOverlay.addEventListener('click', () => {
      tapOverlay.remove();
      iframe.src = iframe.src; /* reload inside gesture = iOS autoplay allowed */
    });
  }

  /* ── Identity ── anyone can join directly, no login required. Default
     name uses the same generator and localStorage key as the homepage
     lounge, so a listener's identity carries over between the two pages;
     the name field (bottom-right) lets them override it. */
  const isBroadcaster = window.location.hash === '#broadcast';

  const ADJS  = ['velvet','amber','silver','crimson','golden','azure','ivory','onyx','jade','cobalt',
                  'sable','ochre','cedar','coral','ember','frost','dusk','lunar','solar','hollow',
                  'mossy','burnt','still','muted','copper'];
  const NOUNS = ['moth','crane','raven','finch','fox','wolf','sparrow','hawk','owl','hare',
                  'deer','fern','reed','mist','tide','wave','stone','bloom','creek','petal',
                  'ash','birch','dune','pine','flint'];
  function genName() {
    return ADJS[Math.floor(Math.random() * ADJS.length)] + '-' + NOUNS[Math.floor(Math.random() * NOUNS.length)];
  }

  let userName = isBroadcaster ? 'Broadcaster' : (localStorage.getItem('fur-fm-name') || genName());
  if (!isBroadcaster) localStorage.setItem('fur-fm-name', userName);
  let myUserId = null;

  const sessionId = new Date().toISOString().slice(0, 10);
  let dbSessionId  = null;

  /* ── User interaction gate for audio autoplay ── */
  let userHasInteracted = false;
  document.addEventListener('click', () => { userHasInteracted = true; }, { once: true, capture: true });

  /* Track whether vdo.ninja already wrote stream_started_at this session
     to prevent repeated reconnect events from resetting it */
  let _vdoDidStartTimer = false;
  window.addEventListener('message', e => {
    if (!String(e.origin).includes('vdo.ninja')) return;
    const msg = e.data; if (!msg) return;
    const action = msg.action || msg.type || '';
    if (/view|join|connect|stream/i.test(action)) {
      if (dbSessionId && !sessionIsLive && !_vdoDidStartTimer) {
        _vdoDidStartTimer = true;
        db.from('sessions').update({ stream_started_at: new Date().toISOString() })
          .eq('id', dbSessionId).is('stream_started_at', null).then(() => {});
      }
    }
  });

  /* ── Leave quietly ── */
  document.querySelector('.nav-leave').addEventListener('click', () => {
    window.location.href = 'index.html';
  });

  /* ── Choose a name — shown once, as part of the chat panel. Confirming
     (arrow or Enter, even with no change) picks it, hides the row for
     good, and re-tracks presence under that name so it shows up correctly
     for other listeners immediately. ── */
  const nameRow     = document.getElementById('chat-name-row');
  const nameInput   = document.getElementById('name-input');
  const nameConfirm = document.getElementById('name-confirm');
  const nameChosen  = localStorage.getItem('fur-fm-name-confirmed') === '1';

  if (nameChosen || isBroadcaster) {
    nameRow.remove();
  } else {
    nameInput.value = userName;
    function chooseName() {
      const v = nameInput.value.trim();
      userName = v || userName;
      localStorage.setItem('fur-fm-name', userName);
      localStorage.setItem('fur-fm-name-confirmed', '1');
      presenceChannel.track({ username: userName });
      nameRow.remove();
    }
    nameConfirm.addEventListener('click', chooseName);
    nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); chooseName(); } });
  }

  /* ── Chat ── */
  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  const log   = document.getElementById('chat-messages');
  const input = document.getElementById('chat-input');
  const btn   = document.getElementById('send-btn');

  function appendMessage(sender, text, type = 'user') {
    const msg = document.createElement('div');
    msg.className = `msg${type === 'system' ? ' system' : ''}`;
    msg.innerHTML = `<span class="msg-sender">${esc(sender)}</span><span class="msg-text">${esc(text)}</span>`;
    gsap.set(msg, { opacity: 0, y: 5 });
    log.appendChild(msg);
    gsap.to(msg, { opacity: 1, y: 0, duration: 0.3, ease: 'power2.out' });
    log.scrollTop = log.scrollHeight;
  }

  const { data: history } = await db
    .from('chat_messages')
    .select('user_id, username, content')
    .eq('session_id', sessionId)
    .order('created_at', { ascending: true })
    .limit(60);

  if (history && history.length > 0) {
    log.innerHTML = '';
    history.forEach(m => appendMessage(m.username || 'Listener', m.content));
  }

  /* Track IDs of messages we sent locally so we don't echo them
     when the realtime event arrives. Using IDs (not user_id) is the
     only safe way — broadcaster has user_id=null, same as unauthenticated
     listeners, so null !== null comparison fails silently. */
  const _sentMsgIds = new Set();

  db.channel('chat:stream')
    .on('postgres_changes', {
      event: 'INSERT', schema: 'public', table: 'chat_messages',
      // No server-side filter — Supabase requires REPLICA IDENTITY FULL
      // on non-PK columns for row filters; without it no events fire.
      // We filter client-side instead.
    }, payload => {
      if (_sentMsgIds.has(payload.new.id)) return; // skip our own echo
      appendMessage(payload.new.username || 'Listener', payload.new.content);
    })
    .subscribe();

  async function send() {
    const text = input.value.trim();
    if (!text) return;
    input.value = ''; input.focus();
    const { data: ins } = await db.from('chat_messages').insert({
      user_id: myUserId, username: userName,
      content: text, session_id: sessionId,
    }).select('id').single();
    // Show own message only after confirmed DB insert (so we have the ID)
    if (ins?.id) {
      _sentMsgIds.add(ins.id);
      appendMessage(userName, text);
    }
  }
  btn.addEventListener('click', send);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });

  /* ── Programme info ── no visible timer, just the session name; we still
     track whether a session is "live" internally (sessionIsLive) since the
     vdo.ninja listener above and the broadcaster toggle below both need to
     know that without a clock to read it off of. */
  const titleEl = document.getElementById('prog-title');
  let sessionIsLive = false;

  function markSessionLive()   { sessionIsLive = true; }
  function markSessionStopped(){ sessionIsLive = false; }

  /* Load current session */
  try {
    const { data: sessionRow } = await db
      .from('sessions')
      .select('id, title, stream_started_at')
      .order('date', { ascending: false })
      .limit(1)
      .single();
    if (sessionRow) {
      dbSessionId = sessionRow.id;
      if (sessionRow.title) titleEl.textContent = sessionRow.title;
      if (sessionRow.stream_started_at) markSessionLive();
    }
  } catch (_) {}

  /* Realtime: sync "is live" state across all viewers */
  db.channel('sessions-timer')
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'sessions' }, payload => {
      if (!dbSessionId || payload.new.id !== dbSessionId) return;
      if (payload.new.stream_started_at) markSessionLive(); else markSessionStopped();
    }).subscribe();

  /* Click the session name to start/stop — only works with #broadcast in URL */
  if (window.location.hash === '#broadcast') {
    titleEl.parentElement.style.pointerEvents = 'all';
    titleEl.style.pointerEvents = 'all';
    titleEl.style.cursor = 'pointer';
    titleEl.style.outline = '1px solid rgba(242,237,224,0.3)';
    titleEl.style.padding = '0.1rem 0.3rem';
    titleEl.title = 'click to start / stop';
    titleEl.addEventListener('click', async () => {
      if (!dbSessionId) {
        if (sessionIsLive) markSessionStopped(); else markSessionLive();
        return;
      }
      if (sessionIsLive) {
        await db.from('sessions').update({ stream_started_at: null }).eq('id', dbSessionId);
      } else {
        await db.from('sessions').update({ stream_started_at: new Date().toISOString() }).eq('id', dbSessionId);
      }
    });
  }

  /* ── Archival now-playing ── */
  const npImageBg   = document.getElementById('np-image-bg');
  const npAudio     = document.getElementById('np-audio');
  const audioPrompt = document.getElementById('audio-prompt');

  /* ── Synced audio playback (archival tracks) ── */
  let wantPlaying = false;
  let wantUrl     = null;

  function attemptPlay() {
    npAudio.play().then(() => {
      audioPrompt.classList.remove('visible');
    }).catch(() => {
      audioPrompt.classList.add('visible');
    });
  }

  function syncAudio(d) {
    const url = d.audio_url || null;
    wantPlaying = !!d.is_playing;

    if (url !== wantUrl) {
      wantUrl = url;
      if (url) {
        npAudio.src = url;
        npAudio.currentTime = d.playhead_pos || 0;
      } else {
        npAudio.removeAttribute('src');
      }
    } else if (url && typeof d.playhead_pos === 'number'
               && Math.abs(npAudio.currentTime - d.playhead_pos) > 1.5) {
      npAudio.currentTime = d.playhead_pos;
    }

    if (wantPlaying && url) {
      // Only auto-play after a user gesture — prevents audio starting
      // mid-session because the DB still has is_playing=true from a
      // previous broadcast that wasn't cleanly stopped.
      if (npAudio.paused && userHasInteracted) attemptPlay();
    } else {
      npAudio.pause();
    }
  }

  document.addEventListener('click', () => {
    userHasInteracted = true;
    if (wantPlaying && npAudio.paused) attemptPlay();
  }, true);
  audioPrompt.addEventListener('click', () => attemptPlay());

  /* ── Scene renderer (incremental — never destroys live iframes) ── */
  const sceneLayer    = document.getElementById('scene-layer');
  const obsPlayer     = document.getElementById('obs-player');
  const _sceneEls     = new Map(); // moduleId → DOM element

  /* ── Module physics ──────────────────────────────────────────────────
     Every module is a mass on an invisible spring anchored to its
     broadcaster-set position ("home" = transform: translate(0,0)).

       enter  — spawns above home and drops under a mass-scaled spring;
                heavy modules (video) are over-damped and thud straight
                down, light ones (text) are under-damped and bounce a
                little before settling. This is "weight".
       idle   — once settled, sways like it's hanging on a string: a
                lightly-damped pendulum that never fully stops, nudged
                back to life by tiny random impulses now and then.
       drag   — grabbing a module (mouse or touch) follows the pointer
                directly; releasing it hands its recent velocity to...
       settle — ...the same spring as `enter`, so a flung module drifts
                with real momentum and eases back home on an elastic
                tether, then drops back into `idle` once it's calm.
     One shared requestAnimationFrame loop steps every module each frame;
     dragging modules are skipped since the pointer already owns them. */
  const _phys = new Map(); // moduleId → physics state
  let _physRAF = null, _physLastTs = null;

  function massFor(m) {
    const area = Math.max(4, (m.w || 10) * (m.h || 10));
    const typeMul = (m.type === 'video' || m.type === 'screen') ? 1.6
                  : (m.type === 'image') ? 1.1 : 0.55; // text is lightest
    return Math.max(0.4, (area / 300) * typeMul);
  }

  function physicsStep(dt, now) {
    _phys.forEach(s => {
      if (s.phase === 'drag') return;

      if (s.phase === 'enter' || s.phase === 'settle') {
        const k     = 46;
        const zeta  = (s.phase === 'enter' ? 0.3 : 0.45) + s.mass * 0.55; // heavier = less bounce
        const c     = 2 * Math.sqrt(k * s.mass) * zeta;
        const ax    = (-k * s.ox - c * s.vx) / s.mass;
        const ay    = (-k * s.oy - c * s.vy) / s.mass;
        s.vx += ax * dt; s.vy += ay * dt;
        s.ox += s.vx * dt; s.oy += s.vy * dt;

        if (Math.abs(s.ox) < 0.4 && Math.abs(s.oy) < 0.4 && Math.abs(s.vx) < 4 && Math.abs(s.vy) < 4) {
          s.ox = s.oy = s.vx = s.vy = 0;
          s.phase = 'idle';
        }
      } else if (s.phase === 'idle') {
        const omega0  = 0.9 / Math.sqrt(s.mass);   // heavier → slower sway
        const damping = 0.12 * Math.sqrt(s.mass);  // heavier → more damped
        const accel   = -omega0 * omega0 * s.theta - 2 * damping * omega0 * s.omega;
        s.omega += accel * dt;
        s.theta += s.omega * dt;

        if (now > s.nextImpulseAt) {
          s.omega += (Math.random() * 2 - 1) * 0.06;
          s.nextImpulseAt = now + 3500 + Math.random() * 4500;
        }

        const L = 9 + s.mass * 3;
        s.ox = L * Math.sin(s.theta);
        s.oy = L * (1 - Math.cos(s.theta)) * 0.5;
      }

      s.el.style.transform = `translate(${s.ox.toFixed(1)}px, ${s.oy.toFixed(1)}px)`;
    });
  }

  function physicsLoop(ts) {
    _physRAF = requestAnimationFrame(physicsLoop);
    if (_physLastTs == null) _physLastTs = ts;
    const dt = Math.min((ts - _physLastTs) / 1000, 0.05); // clamp tab-switch jumps
    _physLastTs = ts;
    physicsStep(dt, performance.now());
  }

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  function attachDragHandlers(el, id) {
    let dragging = false, moved = false;
    let startX, startY, startOx, startOy, lastX, lastY, lastT, velX, velY;

    function down(x, y) {
      const s = _phys.get(id);
      if (!s) return;
      dragging = true; moved = false;
      s.phase = 'drag';
      el.classList.add('dragging');
      startX = x; startY = y; startOx = s.ox; startOy = s.oy;
      lastX = x; lastY = y; lastT = performance.now();
      velX = 0; velY = 0;
    }
    function move(x, y) {
      if (!dragging) return;
      const s = _phys.get(id);
      if (!s) return;
      const dx = x - startX, dy = y - startY;
      if (Math.abs(dx) > 3 || Math.abs(dy) > 3) moved = true;
      s.ox = startOx + dx; s.oy = startOy + dy;
      el.style.transform = `translate(${s.ox.toFixed(1)}px, ${s.oy.toFixed(1)}px)`;
      const now = performance.now();
      const dt = Math.max(1, now - lastT);
      velX = (x - lastX) / dt * 1000;
      velY = (y - lastY) / dt * 1000;
      lastX = x; lastY = y; lastT = now;
    }
    function up() {
      if (!dragging) return;
      dragging = false;
      el.classList.remove('dragging');
      const s = _phys.get(id);
      if (!s) return;
      if (moved) {
        s.vx = clamp(velX, -900, 900);
        s.vy = clamp(velY, -900, 900);
      } else {
        // Tap-to-nudge: a light poke in a random direction when the
        // module is clicked/tapped rather than dragged.
        const ang = Math.random() * Math.PI * 2;
        const mag = 70 + Math.random() * 60;
        s.vx = Math.cos(ang) * mag;
        s.vy = Math.sin(ang) * mag * 0.6;
      }
      s.phase = 'settle';
    }

    el.addEventListener('mousedown', e => {
      e.preventDefault();
      down(e.clientX, e.clientY);
      const mm = e2 => move(e2.clientX, e2.clientY);
      const mu = () => { up(); window.removeEventListener('mousemove', mm); window.removeEventListener('mouseup', mu); };
      window.addEventListener('mousemove', mm);
      window.addEventListener('mouseup', mu);
    });
    el.addEventListener('touchstart', e => { const t = e.touches[0]; down(t.clientX, t.clientY); }, { passive: true });
    el.addEventListener('touchmove',  e => { const t = e.touches[0]; move(t.clientX, t.clientY); }, { passive: true });
    el.addEventListener('touchend',   () => up(), { passive: true });
  }

  function initPhysics(el, m) {
    const mass = massFor(m);
    _phys.set(m.id, {
      el, mass,
      ox: 0, oy: -220 - Math.random() * 60,
      vx: 0, vy: 0,
      theta: (Math.random() * 2 - 1) * 0.15, omega: 0,
      nextImpulseAt: performance.now() + 3000 + Math.random() * 4000,
      phase: 'enter',
    });
    attachDragHandlers(el, m.id);
    if (_physRAF == null) _physRAF = requestAnimationFrame(physicsLoop);
  }

  function buildModuleEl(m) {
    const el = document.createElement('div');
    el.className = 'scene-module';
    el.dataset.modId   = m.id;
    el.dataset.modType = m.type;
    el.style.cssText   = `position:absolute;left:${m.x}%;top:${m.y}%;width:${m.w}%;height:${m.h}%;overflow:hidden;`;
    if (m.type === 'video') {
      el.innerHTML = `<iframe src="https://vdo.ninja/?view=xYuuWBy&label=ffm_listening_room&cleanoutput&autoplay" style="width:100%;height:100%;border:none;display:block" allow="autoplay;camera;microphone" allowfullscreen></iframe>`;
    } else if (m.type === 'screen') {
      el.innerHTML = `<iframe src="https://vdo.ninja/?view=xYuuWBysc&cleanoutput&autoplay" style="width:100%;height:100%;border:none;display:block" allow="autoplay" allowfullscreen></iframe>`;
    } else if (m.type === 'text') {
      el.style.cssText += `color:#f2ede0;white-space:pre-wrap;word-break:break-word;font-size:${m.config?.fontSize||16}px;padding:0.5em;font-family:'Hind',sans-serif;`;
      el.textContent = m.config?.content || '';
    } else if (m.type === 'image') {
      el.innerHTML = `<img src="${esc(m.config?.url||'')}" style="width:100%;height:100%;object-fit:contain;display:block;" alt=""/>`;
    }
    return el;
  }

  function renderScene(scene) {
    const mods = scene?.modules ?? [];

    if (!mods.length) {
      sceneLayer.style.display = 'none';
      _sceneEls.forEach((el, id) => _phys.delete(id));
      _sceneEls.forEach(el => el.remove());
      _sceneEls.clear();
      return;
    }

    sceneLayer.style.display = 'block';

    const incoming = new Set(mods.map(m => m.id));

    /* Remove elements no longer in scene */
    _sceneEls.forEach((el, id) => {
      if (!incoming.has(id)) { _phys.delete(id); el.remove(); _sceneEls.delete(id); }
    });

    /* Add or update each module */
    for (const m of mods) {
      let el = _sceneEls.get(m.id);

      if (!el || el.dataset.modType !== m.type) {
        /* New or type-changed module — create fresh */
        if (el) { _phys.delete(m.id); el.remove(); }
        el = buildModuleEl(m);
        sceneLayer.appendChild(el);
        _sceneEls.set(m.id, el);
        initPhysics(el, m);
      } else {
        /* Existing module — update position/size only, never touch iframes */
        el.style.left   = m.x + '%';
        el.style.top    = m.y + '%';
        el.style.width  = m.w + '%';
        el.style.height = m.h + '%';

        if (m.type === 'text') {
          const content = m.config?.content || '';
          if (el.textContent !== content) el.textContent = content;
        }
      }
    }
  }

  function applyNP(d) {
    if (!d) return;
    if ('scene' in d) renderScene(d.scene);
    syncAudio(d);

    if (d.image_url) {
      npImageBg.style.backgroundImage = `url("${d.image_url.replace(/"/g,'%22')}")`;
      npImageBg.classList.add('show');
    } else {
      npImageBg.classList.remove('show');
    }
  }

  (async () => {
    const { data } = await db.from('now_playing')
      .select('*').eq('id', '00000000-0000-0000-0000-000000000001').maybeSingle();
    if (data) applyNP(data);
  })();

  db.channel('now-playing-listener')
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'now_playing' },
      payload => applyNP(payload.new))
    .subscribe();

  /* ── Presence ── */
  const presenceChannel = db.channel('fur-fm:room');
  presenceChannel
    .subscribe(async status => {
      if (status === 'SUBSCRIBED') await presenceChannel.track({ username: userName });
    });

})();
</script>

</body>
