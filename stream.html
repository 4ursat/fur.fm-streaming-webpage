<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fur FM</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
  <script src="supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #141414;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
    }

    /* ── Full-page centring shell ── */
    .page-wrap {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.8rem 2.5rem;
    }

    /* ── Column: above + stage + below, all same width ── */
    .content-col {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      width: 88vw;
      /* max-width: tallest possible stage given vh, plus strip heights + gaps */
      max-width: calc((100vh - 9rem) * 1.7778);
    }

    /* ── Above-video strip ── */
    .above {
      display: flex;
      justify-content: flex-end;
    }

    .session-notice {
      font-size: 0.84rem; letter-spacing: 0.03em;
      color: rgba(255,255,255,0.8);
      line-height: 1.5;
    }

    /* ── Contained video stage ── */
    .stage {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      outline: 1px solid rgba(255,255,255,0.07);
      flex-shrink: 0;
    }

    #obs-player {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(1.35);
      width: 100%; height: 100%;
      border: none; display: block;
    }

    /* ── Overlays — absolutely positioned inside .stage ── */
    .ov {
      position: absolute;
      z-index: 10;
      pointer-events: none;
    }

    /* Top-left: Logo */
    .ov-tl { top: 1.2rem; left: 1.4rem; }

    .logo { display: flex; align-items: flex-start; gap: 0.5rem; }
    .logo-name {
      font-size: 1.05rem; font-weight: bold; letter-spacing: 0.07em;
      color: rgba(255,255,255,0.95); line-height: 1;
      text-shadow: 0 1px 12px rgba(0,0,0,0.8);
    }
    .logo-dot {
      display: inline-block; width: 3px; height: 3px;
      background: rgba(255,255,255,0.85); border-radius: 50%;
      vertical-align: middle; margin: 0 0.18em;
      position: relative; top: -1px;
    }

    /* Live rings */
    #ring-inner  { opacity: 0.65; }
    #ring-mid    { opacity: 0.44; }
    #ring-outer  { opacity: 0.26; }
    .logo.is-live #ring-inner { animation: ring-broadcast 2.4s ease-in-out infinite; }
    .logo.is-live #ring-mid   { animation: ring-broadcast 2.4s ease-in-out 0.5s infinite; }
    .logo.is-live #ring-outer { animation: ring-broadcast 2.4s ease-in-out 1s infinite; }
    @keyframes ring-broadcast {
      0%, 100% { opacity: 0.06; }
      40%      { opacity: 0.9; }
    }

    /* Top-right: Session info */
    .ov-tr { top: 1.2rem; right: 1.4rem; text-align: right; max-width: 50%; }
    .session-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.05rem; font-weight: 300; font-style: italic;
      color: rgba(255,255,255,0.95);
    }
    .session-timer {
      font-size: 1.0rem; letter-spacing: 0.14em;
      color: rgba(255,255,255,0.95);
      margin-top: 0.3rem; text-align: right;
      font-variant-numeric: tabular-nums;
    }

    /* Bottom-left: Listener count */
    .ov-bl { bottom: 1.3rem; left: 1.4rem; }
    .listener-count {
      font-size: 0.86rem; letter-spacing: 0.06em;
      color: rgba(255,255,255,0.85); font-style: italic;
    }

    /* Bottom-right: Chat overlay */
    .ov-br {
      bottom: 1.3rem; right: 1.4rem;
      width: min(240px, calc(50% - 1.8rem));
      pointer-events: all;
      display: flex; flex-direction: column;
    }
    .messages {
      max-height: 190px; overflow-y: auto;
      display: flex; flex-direction: column; gap: 0.65rem;
      padding: 0.65rem 0.75rem 0.55rem;
      background: rgba(0,0,0,0.22);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      scrollbar-width: none;
    }
    .messages::-webkit-scrollbar { display: none; }
    .msg { display: flex; flex-direction: column; gap: 0.04rem; }
    .msg-sender {
      font-size: 0.72rem; letter-spacing: 0.06em;
      color: rgba(255,255,255,0.72);
    }
    .msg-text {
      font-size: 0.82rem; color: rgba(255,255,255,0.92);
      line-height: 1.45; word-break: break-word;
    }
    .msg.system .msg-sender { color: rgba(255,255,255,0.45); }
    .msg.system .msg-text {
      font-style: italic; color: rgba(255,255,255,0.6); font-size: 0.72rem;
    }
    .chat-input-area {
      background: rgba(0,0,0,0.28);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 0.4rem 0.75rem 0.5rem;
      display: flex; align-items: center; gap: 0.55rem;
      border-top: 1px solid rgba(255,255,255,0.05);
    }
    .chat-input-area input {
      flex: 1; background: transparent; border: none;
      border-bottom: 1px solid rgba(255,255,255,0.18);
      outline: none; padding: 0.15rem 0;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.76rem; font-style: italic;
      color: rgba(255,255,255,0.88);
    }
    .chat-input-area input::placeholder { color: rgba(255,255,255,0.5); }
    .send-btn {
      background: none; border: none; padding: 0; flex-shrink: 0;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase;
      color: rgba(255,255,255,0.65); cursor: pointer; transition: color 0.2s;
    }
    .send-btn:hover { color: rgba(255,255,255,0.9); }

    /* ── Below-video strip ── */
    .below {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-link {
      font-size: 0.9rem; letter-spacing: 0.08em; text-transform: uppercase;
      color: rgba(255,255,255,0.75); text-decoration: none;
      background: none; border: none; padding: 0;
      font-family: 'Courier New', Courier, monospace;
      cursor: pointer; transition: color 0.2s;
    }
    .nav-link:hover { color: rgba(255,255,255,0.95); }

    /* ── Join toast ── */
    .join-toast {
      position: fixed; bottom: 2.2rem; left: 50%;
      transform: translateX(-50%) translateY(8px);
      z-index: 20; pointer-events: none;
      font-size: 0.68rem; letter-spacing: 0.12em;
      color: rgba(255,255,255,0.68);
      background: rgba(0,0,0,0.52);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.06);
      padding: 0.36rem 0.9rem;
      opacity: 0; white-space: nowrap;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }
    .join-toast.visible {
      opacity: 1; transform: translateX(-50%) translateY(0);
    }

    /* ── Responsive ── */

    /* Tablet (portrait iPad etc.) */
    @media (max-width: 768px) {
      .content-col { width: 94vw; }
      .page-wrap { padding: 1.4rem 1.2rem; }
    }

    /* Phone */
    @media (max-width: 600px) {
      .content-col { width: 98vw; }
      .page-wrap { padding: 0.9rem 0.6rem; }

      /* tighter overlay insets */
      .ov-tl { top: 0.6rem; left: 0.7rem; }
      .ov-tr { top: 0.6rem; right: 0.7rem; max-width: 56%; }
      .ov-bl { bottom: 0.65rem; left: 0.7rem; }
      .ov-br { bottom: 0.65rem; right: 0.7rem;
               width: min(190px, calc(55% - 0.7rem)); }

      /* overlay text */
      .logo-name    { font-size: 0.88rem; }
      .session-title { font-size: 0.82rem; }
      .session-timer { font-size: 0.8rem; letter-spacing: 0.08em; }
      .listener-count { font-size: 0.74rem; }

      /* shorter chat so it doesn't dominate the small video */
      .messages { max-height: 100px; }
      .msg-text { font-size: 0.72rem; }
      .msg-sender { font-size: 0.62rem; }
      .chat-input-area { padding: 0.3rem 0.55rem 0.35rem; }
      .chat-input-area input { font-size: 0.68rem; }
      .send-btn { font-size: 0.65rem; }

      /* strips outside video */
      .session-notice { font-size: 0.74rem; }
      .nav-link { font-size: 0.78rem; }
      .content-col { gap: 0.6rem; }
    }

    /* Landscape phone — maximize video height */
    @media (max-height: 480px) and (orientation: landscape) {
      .page-wrap { padding: 0.5rem; }
      .content-col { gap: 0.45rem; }
      .above, .below { display: none; }  /* hide strips, give video full space */
      .content-col { max-width: calc(100vh * 1.7778); width: 100vw; }
    }
  </style>
</head>
<body>

<div class="page-wrap">
  <div class="content-col">

    <!-- Above video: notice right-aligned -->
    <div class="above">
      <div class="session-notice">This session will not be recorded.</div>
    </div>

    <!-- Video stage with overlays inside -->
    <div class="stage">

      <iframe
        id="obs-player"
        src="https://vdo.ninja/?view=xYuuWBy&label=ffm_listening_room&cleanoutput&autoplay&stretch"
        allow="autoplay;camera;microphone;fullscreen;picture-in-picture;display-capture;midi;encrypted-media"
        allowfullscreen
        title="Fur FM live stream"
      ></iframe>

      <!-- Top-left: Logo -->
      <div class="ov ov-tl">
        <div class="logo" id="live-badge">
          <svg viewBox="0 0 36 20" width="26" height="15" fill="none">
            <defs>
              <clipPath id="ov-rings-clip">
                <rect x="-500" y="-1000" width="1000" height="1014"/>
              </clipPath>
            </defs>
            <g clip-path="url(#ov-rings-clip)">
              <circle id="ring-inner" cx="18" cy="11" r="6"  stroke="#fff" stroke-width="1.3"/>
              <circle id="ring-mid"   cx="18" cy="11" r="11" stroke="#fff" stroke-width="1.0"/>
              <circle id="ring-outer" cx="18" cy="11" r="16" stroke="#fff" stroke-width="0.75"/>
            </g>
            <circle cx="18" cy="11" r="2.2" fill="#fff"/>
          </svg>
          <div class="logo-name">FUR<span class="logo-dot"></span>FM</div>
        </div>
      </div>

      <!-- Top-right: Session info -->
      <div class="ov ov-tr">
        <div class="session-title" id="prog-title">Live Session</div>
        <div class="session-timer" id="session-timer">00:00:00</div>
      </div>

      <!-- Bottom-left: Listener count -->
      <div class="ov ov-bl">
        <div class="listener-count" id="listener-count">—</div>
      </div>

      <!-- Bottom-right: Chat overlay -->
      <div class="ov ov-br">
        <div class="messages" id="chat-messages" role="log" aria-live="polite"></div>
        <div class="chat-input-area">
          <input type="text" id="chat-input" placeholder=""
                 maxlength="200" autocomplete="off" />
          <button class="send-btn" id="send-btn">send →</button>
        </div>
      </div>

    </div><!-- /.stage -->

    <!-- Below video -->
    <div class="below">
      <button class="nav-link nav-leave">leave quietly</button>
      <button class="nav-link nav-fullscreen">⤢ fullscreen</button>
    </div>

  </div><!-- /.content-col -->
</div><!-- /.page-wrap -->

<script>
(async () => {
  const { createClient } = window.supabase;
  const db = createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

  /* ── Auth gate ── */
  const { data: { session } } = await db.auth.getSession();
  if (!session) { window.location.replace('index.html'); return; }

  const user     = session.user;
  let userName = user.user_metadata?.username || user.email?.split('@')[0] || 'Listener';

  let myUserId = null;
  const { data: profile } = await db.from('users').select('id, name').eq('auth_id', user.id).single();
  if (profile) {
    myUserId = profile.id;
    if (profile.name) userName = profile.name;
  }

  const sessionId = new Date().toISOString().slice(0, 10);
  const countEl   = document.getElementById('listener-count');

  /* ── Live badge ── */
  const liveBadge = document.getElementById('live-badge');
  function setLive(isLive) { liveBadge.classList.toggle('is-live', isLive); }

  window.addEventListener('message', e => {
    if (!String(e.origin).includes('vdo.ninja')) return;
    const msg = e.data; if (!msg) return;
    const action = msg.action || msg.type || '';
    if (/view|join|connect|stream/i.test(action)) setLive(true);
    if (/hangup|disconnect|leave/i.test(action))  setLive(false);
  });

  /* ── Leave quietly ── */
  document.querySelector('.nav-leave').addEventListener('click', async () => {
    await db.auth.signOut();
    window.location.href = 'index.html';
  });

  /* ── Fullscreen ── */
  const fsBtn = document.querySelector('.nav-fullscreen');
  fsBtn.addEventListener('click', () => {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen().catch(() => {});
    }
  });
  document.addEventListener('fullscreenchange', () => {
    fsBtn.textContent = document.fullscreenElement ? '↙ exit fullscreen' : '⤢ fullscreen';
  });

  /* ── Chat ── */
  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  const log   = document.getElementById('chat-messages');
  const input = document.getElementById('chat-input');
  const btn   = document.getElementById('send-btn');

  function appendMessage(sender, text, type = 'user') {
    const msg = document.createElement('div');
    msg.className = `msg${type === 'system' ? ' system' : ''}`;
    msg.innerHTML = `<span class="msg-sender">${esc(sender)}</span><span class="msg-text">${esc(text)}</span>`;
    gsap.set(msg, { opacity: 0, y: 5 });
    log.appendChild(msg);
    gsap.to(msg, { opacity: 1, y: 0, duration: 0.3, ease: 'power2.out' });
    log.scrollTop = log.scrollHeight;
  }

  const { data: history } = await db
    .from('chat_messages')
    .select('user_id, username, content')
    .eq('session_id', sessionId)
    .order('created_at', { ascending: true })
    .limit(60);

  if (history && history.length > 0) {
    log.innerHTML = '';
    history.forEach(m => appendMessage(m.username || 'Listener', m.content));
  }

  db.channel(`chat:${sessionId}`)
    .on('postgres_changes', {
      event: 'INSERT', schema: 'public', table: 'chat_messages',
      filter: `session_id=eq.${sessionId}`,
    }, payload => {
      if (payload.new.user_id !== myUserId)
        appendMessage(payload.new.username || 'Listener', payload.new.content);
    })
    .subscribe();

  async function send() {
    const text = input.value.trim();
    if (!text) return;
    appendMessage(userName, text);
    input.value = ''; input.focus();
    await db.from('chat_messages').insert({
      user_id: myUserId, username: userName,
      content: text, session_id: sessionId,
    });
  }
  btn.addEventListener('click', send);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });

  /* ── Programme info + timer (counts from page load) ── */
  const timerEl    = document.getElementById('session-timer');
  const titleEl    = document.getElementById('prog-title');

  const pageLoadMs = Date.now();
  setInterval(() => {
    const s = Math.floor((Date.now() - pageLoadMs) / 1000);
    timerEl.textContent = [
      Math.floor(s / 3600),
      Math.floor((s % 3600) / 60),
      s % 60,
    ].map(n => String(n).padStart(2, '0')).join(':');
  }, 1000);

  /* ── Presence ── */
  function showJoinToast(name) {
    const el = document.createElement('div');
    el.className = 'join-toast';
    el.textContent = `→ ${name} found their way in`;
    document.body.appendChild(el);
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('visible')));
    setTimeout(() => { el.classList.remove('visible'); setTimeout(() => el.remove(), 400); }, 3200);
  }

  const presenceChannel = db.channel('fur-fm:room');
  presenceChannel
    .on('presence', { event: 'sync' }, () => {
      const count = Object.keys(presenceChannel.presenceState()).length;
      countEl.textContent = count === 1 ? '1 listening' : `${count} listening`;
    })
    .on('presence', { event: 'join' }, ({ newPresences }) => {
      newPresences.forEach(p => {
        if (p.username && p.username !== userName) showJoinToast(p.username);
      });
    })
    .subscribe(async status => {
      if (status === 'SUBSCRIBED') await presenceChannel.track({ username: userName });
    });

})();
</script>

</body>
</html>
