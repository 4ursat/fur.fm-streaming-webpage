<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fur.FM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500&family=Yatra+One&display=swap" rel="stylesheet">
  <script src="supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Palette (black & white):
       bg      #000000  base
       ink     #ffffff  primary text / accents
       muted   #999999  secondary text / borders
    */

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000000;
      font-family: 'Hind', sans-serif;
      color: #ffffff;
      -webkit-tap-highlight-color: transparent;
    }

    body::after {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background-image: radial-gradient(circle, rgba(255,255,255,0.045) 1px, transparent 1px);
      background-size: 26px 26px;
      pointer-events: none;
    }

    /* ── UI chrome ───────────────────────────────────────────── */
    #ui-chrome {
      position: fixed; inset: 0; z-index: 20;
      pointer-events: none;
    }

    #top-left {
      position: absolute; top: 4.8rem; left: 1.5rem;
      display: flex; flex-direction: column; gap: 0.42rem;
    }
    #live-indicator {
      display: none;
      font-size: 0.75rem;
      pointer-events: auto;
    }
    #live-indicator .dot {
      color: #ffffff;
      animation: blink 1.8s ease-in-out infinite;
    }
    #live-link {
      color: #ffffff;
      text-decoration: none;
      margin-left: 0.28em;
    }
    #live-link:hover { color: white; text-decoration: underline; }

    #notif-tray {
      position: absolute; top: 4.5rem; right: 1.5rem;
      display: flex; flex-direction: column; gap: 0.5rem;
      align-items: flex-end;
      pointer-events: auto;
    }

    /* ── Session / join cards ────────────────────────────────── */
    #session-card, #session-card-static {
      position: fixed;
      z-index: 25;
      display: none;
      flex-direction: column;
      gap: 0.22rem;
      padding: 0.75rem 1rem;
      background: rgba(0,0,0,0.92);
      border: 1px solid #999999;
      max-width: 210px;
      line-height: 1.55;
      pointer-events: auto;
    }
    #session-card {
      top: 0; left: 0;
      will-change: transform;
    }
    #session-card-static {
      bottom: 4.8rem; left: 50%;
      transform: translateX(-50%);
    }
    #sc-title, .sc-card-title {
      font-family: 'Yatra One', serif;
      font-size: 0.95rem;
      color: #ffffff;
      line-height: 1.35;
    }
    #sc-date, .sc-card-date {
      font-size: 0.68rem; letter-spacing: 0.04em;
      color: #999999;
    }
    #sc-join, #sc-static-join {
      background: transparent; border: none;
      font-family: 'Hind', sans-serif;
      font-size: 0.72rem; letter-spacing: 0.05em;
      color: #ffffff;
      cursor: pointer; padding: 0; margin-top: 0.3rem;
      text-align: left; touch-action: manipulation;
      transition: color 0.15s;
    }
    #sc-join:hover, #sc-static-join:hover { color: #ffffff; }

    /* ── Sur peti instrument ─────────────────────────────────── */
    #surpeti-wrap {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 22;
      display: flex; flex-direction: column; align-items: center;
      gap: 0.9rem;
    }
    #surpeti-panel {
      display: flex;
      align-items: flex-end;
      gap: 0.6rem;
      padding: 2.2rem 1.6rem 1rem;
      border: 1.5px solid rgba(255,255,255,0.55);
      background: rgba(0,0,0,0.3);
      max-width: 92vw;
      flex-wrap: nowrap;
      overflow-x: auto;
    }
    .sargam-key {
      appearance: none;
      background: rgba(255,255,255,0.04);
      border: 1.5px solid rgba(255,255,255,0.45);
      border-radius: 14px 14px 4px 4px;
      color: rgba(255,255,255,0.75);
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.78rem;
      letter-spacing: 0.02em;
      width: 44px; height: 74px;
      display: flex; align-items: flex-end; justify-content: center;
      padding-bottom: 0.6rem;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }
    .sargam-key.sharp { margin-bottom: 0.85rem; }
    .sargam-key:hover { border-color: rgba(255,255,255,0.75); }
    .sargam-key.active {
      background: rgba(255,255,255,0.18);
      border-color: #ffffff;
      color: #ffffff;
      transform: translateY(10px);
    }
    #surpeti-caption {
      font-family: 'Hind', sans-serif;
      font-style: italic;
      font-size: 0.74rem;
      letter-spacing: 0.02em;
      color: rgba(255,255,255,0.55);
      text-align: center;
      user-select: none;
    }

    .notif-card {
      background: rgba(0,0,0,0.92);
      border: 1px solid #999999;
      padding: 0.65rem 0.95rem;
      font-size: 0.75rem;
      color: #ffffff;
      max-width: 230px;
      line-height: 1.6;
      transform: translateX(14px);
      opacity: 0;
      transition: transform 0.32s ease, opacity 0.32s ease;
    }
    .notif-card.visible { transform: translateX(0); opacity: 1; }
    .notif-card a {
      color: #ffffff;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .notif-card em {
      color: #ffffff;
      font-family: 'Yatra One', serif;
      font-size: 0.88rem;
      font-style: normal;
    }
    .notif-card .dot { color: #ffffff; }

    /* ── Brand ───────────────────────────────────────────────── */
    #brand {
      position: fixed;
      top: 1.4rem; left: 1.5rem;
      z-index: 30;
      pointer-events: none;
      user-select: none;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.18rem;
    }
    #brand svg { opacity: 0.9; width: 100%; height: auto; }
    #brand-tagline {
      font-family: 'Hind', sans-serif;
      font-size: 0.6rem;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.55);
      margin-top: 0;
      white-space: nowrap;
      text-align: left;
    }

    /* ── Site nav ────────────────────────────────────────────── */
    #site-nav {
      position: fixed;
      top: 1.7rem; right: 1.5rem;
      z-index: 30;
      display: flex;
      gap: 1.5rem;
      pointer-events: auto;
    }
    .nav-link {
      font-family: 'Hind', sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.55);
      text-decoration: none;
      transition: color 0.15s;
    }
    .nav-link:hover { color: #ffffff; }

    @media (max-width: 560px) {
      #site-nav { gap: 0.9rem; top: 1.5rem; right: 1rem; }
      .nav-link { font-size: 0.62rem; letter-spacing: 0.08em; }
      #brand { top: 1.2rem; left: 1rem; }
    }

    /* ── Join / OTP modal ────────────────────────────────────── */
    #join-modal {
      position: fixed; inset: 0; z-index: 50;
      background: rgba(0,0,0,0.97);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity 0.28s ease;
    }
    #join-modal.open { opacity: 1; pointer-events: auto; }

    #join-panel {
      position: relative;
      width: 100%; max-width: 280px;
      padding: 0 1.5rem;
      display: flex; flex-direction: column;
    }
    #join-close {
      position: absolute; top: -2.2rem; right: 1.5rem;
      cursor: pointer; font-size: 1.1rem;
      color: #999999;
      background: none; border: none;
      font-family: inherit; touch-action: manipulation;
      transition: color 0.15s;
    }
    #join-close:hover { color: #ffffff; }

    .join-heading {
      font-family: 'Yatra One', serif;
      font-size: 1rem; letter-spacing: 0.02em;
      color: #ffffff;
      margin-bottom: 0.35rem;
    }
    .join-sub {
      font-size: 0.72rem; color: #999999;
      margin-bottom: 1.4rem; line-height: 1.55;
    }
    .join-input {
      background: transparent; border: none;
      border-bottom: 1px solid #999999;
      color: #ffffff;
      font-family: 'Hind', sans-serif; font-size: 0.9rem;
      padding: 0.4rem 0; outline: none; width: 100%;
      margin-bottom: 1.2rem;
    }
    .join-input::placeholder { color: rgba(255,255,255,0.4); }
    .join-submit {
      background: transparent; border: none;
      font-family: 'Hind', sans-serif;
      font-size: 0.8rem; letter-spacing: 0.05em;
      color: #ffffff;
      cursor: pointer; padding: 0; text-align: left;
      touch-action: manipulation; transition: color 0.15s;
    }
    .join-submit:hover { color: #ffffff; }
    .join-submit:disabled { color: rgba(255,255,255,0.3); cursor: default; }
    .join-err {
      font-size: 0.68rem; color: #ffffff;
      margin-top: 0.8rem; min-height: 1rem; line-height: 1.5;
    }
    .join-back {
      font-size: 0.68rem; color: #999999;
      cursor: pointer; background: none; border: none;
      font-family: inherit; padding: 0; margin-top: 1.2rem;
      touch-action: manipulation;
    }
    .join-back:hover { color: #ffffff; }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }
  </style>
</head>
<body>

<div id="brand">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 168 34" width="140" height="29" fill="none">
    <text x="0" y="26"
      font-family="'Courier New',Courier,monospace"
      font-size="24" font-weight="700" letter-spacing="1"
      fill="#ffffff">FurFM</text>
  </svg>
  <div id="brand-tagline">Intentional Listening Space</div>
</div>

<nav id="site-nav">
  <a class="nav-link" href="stream.html">Live</a>
  <a class="nav-link" href="fursat.html">Fursat</a>
  <a class="nav-link" href="studio.html">Studio</a>
  <a class="nav-link" href="shop.html">Shop</a>
</nav>

<div id="ui-chrome">
  <div id="top-left">
    <div id="live-indicator">
      <span class="dot">●</span><a href="stream.html" target="_blank" id="live-link">live now · join →</a>
    </div>
  </div>
  <div id="notif-tray"></div>
</div>

<!-- Drifting session / join card — shown when a session is scheduled -->
<div id="session-card">
  <div id="sc-title"></div>
  <div id="sc-date"></div>
  <button id="sc-join">enter room →</button>
</div>

<!-- Static join card — shown when no session is scheduled, doesn't drift -->
<div id="session-card-static">
  <div class="sc-card-title">fur fm</div>
  <div class="sc-card-date">sessions coming soon</div>
  <button id="sc-static-join">enter room →</button>
</div>

<!-- Sur peti instrument — click a key to toggle it, no gate, no login -->
<div id="surpeti-wrap">
  <div id="surpeti-panel"></div>
  <div id="surpeti-caption">the sound changes. you don't have to.</div>
</div>

<!-- Join / OTP modal -->
<div id="join-modal">
  <div id="join-panel">
    <button id="join-close">×</button>

    <!-- Step 1: email -->
    <div id="step-email">
      <div class="join-heading">join the session</div>
      <div class="join-sub">we'll send a one-time code to your email</div>
      <input class="join-input" id="join-email" type="email" placeholder="your@email.com" autocomplete="email" />
      <button class="join-submit" id="join-send">send code →</button>
      <div class="join-err" id="join-err1"></div>
    </div>

    <!-- Step 2: OTP code -->
    <div id="step-otp" style="display:none">
      <div class="join-heading">check your email</div>
      <div class="join-sub" id="otp-sub">enter the 6-digit code we sent</div>
      <input class="join-input" id="join-otp" type="text" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="one-time-code" />
      <button class="join-submit" id="join-verify">verify →</button>
      <div class="join-err" id="join-err2"></div>
      <button class="join-back" id="join-back">← use a different email</button>
    </div>

  </div>
</div>

<script>
(async () => {

  /* ── Supabase ──────────────────────────────────────────────────────── */
  const { createClient } = window.supabase;
  const db = createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

  /* ── XSS helper ────────────────────────────────────────────────────── */
  function esc(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  /* ── Username ──────────────────────────────────────────────────────── */
  const ADJS  = ['velvet','amber','silver','crimson','golden','azure','ivory','onyx','jade','cobalt',
                  'sable','ochre','cedar','coral','ember','frost','dusk','lunar','solar','hollow',
                  'mossy','burnt','still','muted','copper'];
  const NOUNS = ['moth','crane','raven','finch','fox','wolf','sparrow','hawk','owl','hare',
                  'deer','fern','reed','mist','tide','wave','stone','bloom','creek','petal',
                  'ash','birch','dune','pine','flint'];

  function genName() {
    return ADJS[Math.floor(Math.random()*ADJS.length)] + '-' + NOUNS[Math.floor(Math.random()*NOUNS.length)];
  }

  let myId = localStorage.getItem('fur-fm-id');
  if (!myId) { myId = crypto.randomUUID(); localStorage.setItem('fur-fm-id', myId); }

  let myName = localStorage.getItem('fur-fm-name');
  if (!myName) { myName = genName(); localStorage.setItem('fur-fm-name', myName); }

  /* ── Notifications ─────────────────────────────────────────────────── */
  const notifTray = document.getElementById('notif-tray');

  function showNotif(html, autoDismissMs = 6500) {
    const card = document.createElement('div');
    card.className = 'notif-card';
    card.innerHTML = html;
    notifTray.appendChild(card);
    requestAnimationFrame(() => requestAnimationFrame(() => card.classList.add('visible')));
    if (autoDismissMs > 0) {
      setTimeout(() => {
        card.classList.remove('visible');
        setTimeout(() => card.remove(), 400);
      }, autoDismissMs);
    }
    return card;
  }

  /* ── Live indicator + now_playing watch ────────────────────────────── */
  const liveEl      = document.getElementById('live-indicator');
  const liveLinkEl  = document.getElementById('live-link');
  let   liveCard    = null;
  let   wasLive     = false;

  function setLive(on, label) {
    liveEl.style.display = on ? '' : 'none';
    if (on && label) liveLinkEl.textContent = label + ' · join →';
  }

  /* ── Session card (drifting, when a session is scheduled) ───────────── */
  const sessionCard   = document.getElementById('session-card');
  const scTitle       = document.getElementById('sc-title');
  const scDate        = document.getElementById('sc-date');
  const scJoinBtn     = document.getElementById('sc-join');
  const sessionCardStatic = document.getElementById('session-card-static');
  const scStaticJoinBtn   = document.getElementById('sc-static-join');
  let   driftTimer  = null;

  function startDrift() {
    sessionCard.style.display = 'flex';

    function moveTo() {
      const cw   = sessionCard.offsetWidth  || 170;
      const ch   = sessionCard.offsetHeight || 85;
      const padX = 28;
      const padY = 28;
      const maxX = window.innerWidth  - cw - padX;
      const maxY = window.innerHeight * 0.74 - ch;
      const x    = padX + Math.random() * Math.max(0, maxX - padX);
      const y    = padY + Math.random() * Math.max(0, maxY - padY);
      sessionCard.style.transform = `translate(${x}px, ${y}px)`;
    }

    // Snap to first position instantly, then begin smooth drift
    sessionCard.style.transition = 'none';
    moveTo();
    setTimeout(() => {
      sessionCard.style.transition = 'transform 7s ease-in-out';
      moveTo();
      driftTimer = setInterval(moveTo, 7500);
    }, 80);
  }

  (async () => {
    // Upcoming session → populate drifting card
    const today = new Date().toISOString().slice(0, 10);
    const { data: next } = await db.from('sessions')
      .select('title, date')
      .gte('date', today)
      .order('date', { ascending: true })
      .limit(1)
      .maybeSingle();

    if (next?.title) {
      scTitle.textContent = next.title;
      scDate.textContent  = next.date
        ? new Date(next.date + 'T12:00:00').toLocaleDateString('en-US', { month: 'long', day: 'numeric' })
        : '';
      scJoinBtn.addEventListener('click', () => openJoinModal());
      startDrift();
    } else {
      // No session scheduled — static card, no drift.
      sessionCardStatic.style.display = 'flex';
      scStaticJoinBtn.addEventListener('click', () => openJoinModal());
    }

    // Current live state
    const { data: np } = await db.from('now_playing')
      .select('is_playing, archive_header, track_title')
      .eq('id', '00000000-0000-0000-0000-000000000001')
      .maybeSingle();

    if (np?.is_playing) {
      wasLive = true;
      setLive(true, np.archive_header || np.track_title || 'Session');
    }

    // Realtime watch
    db.channel('lounge-np')
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'now_playing' }, ({ new: d }) => {
        if (d.is_playing && !wasLive) {
          wasLive = true;
          const label = d.archive_header || d.track_title || 'Session';
          setLive(true, label);
          liveCard = showNotif(
            `<span class="dot">●</span> live now · <em>${esc(label)}</em><br><a href="stream.html" target="_blank">join the session →</a>`,
            0
          );
        } else if (!d.is_playing && wasLive) {
          wasLive = false;
          setLive(false);
          if (liveCard) {
            liveCard.classList.remove('visible');
            setTimeout(() => { liveCard?.remove(); liveCard = null; }, 400);
          }
        }
      })
      .subscribe();
  })();

  /* ── Presence ──────────────────────────────────────────────────────── */
  let presenceChannel = db.channel('fur-fm:room');
  presenceChannel
    .subscribe(async status => {
      if (status === 'SUBSCRIBED') await presenceChannel.track({ username: myName });
    });

  /* ── Sur peti instrument ───────────────────────────────────────────────
     8 independent, polyphonic click-toggle voices. Fully self-contained —
     no shared/server state, no gate. AudioContext inits lazily on the
     first key click. Evolution timings are the tunable knobs here. ──── */
  const FADE_IN_MS        = 400;    // base tone fade-in
  const DETUNE_RAMP_MS    = 18000;  // chorus (detuned) oscillator ramp-in
  const NOISE_RAMP_MS     = 22000;  // filtered-noise breath ramp-in
  const LFO_DEPTH_RAMP_MS = 20000;  // pitch-drift LFO depth ramp-in
  const RELEASE_MS        = 1200;   // fade-out on toggle-off
  const LFO_RATE_HZ       = 0.12;
  const DETUNE_CENTS      = 6;      // chorus detune amount
  const LFO_MAX_CENTS     = 5;      // max pitch-drift depth once fully ramped in
  const NOISE_Q           = 4;

  const SARGAM = [
    { name: 'Sa',  hz: 130.81, sharp: false },
    { name: 'Re',  hz: 146.83, sharp: true  },
    { name: 'Ga',  hz: 164.81, sharp: false },
    { name: 'Ma',  hz: 174.61, sharp: true  },
    { name: 'Pa',  hz: 196.00, sharp: false },
    { name: 'Dha', hz: 220.00, sharp: true  },
    { name: 'Ni',  hz: 246.94, sharp: false },
    { name: "Sa'", hz: 261.63, sharp: true  },
  ];

  let ctx = null;
  let noiseBufferCache = null;
  const voices = {}; // idx -> { voiceGain, baseOsc, detOsc, lfo, noiseSrc }

  function ensureCtx() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  function getNoiseBuffer() {
    if (noiseBufferCache) return noiseBufferCache;
    const len  = ctx.sampleRate * 2;
    const buf  = ctx.createBuffer(1, len, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    noiseBufferCache = buf;
    return buf;
  }

  function startVoice(idx) {
    const freq = SARGAM[idx].hz;
    const now  = ctx.currentTime;

    const voiceGain = ctx.createGain();
    voiceGain.gain.value = 1;
    voiceGain.connect(ctx.destination);

    // 1. Base tone — clean fade-in
    const baseOsc  = ctx.createOscillator();
    baseOsc.type = 'triangle';
    baseOsc.frequency.value = freq;
    const baseGain = ctx.createGain();
    baseGain.gain.setValueAtTime(0, now);
    baseGain.gain.linearRampToValueAtTime(0.28, now + FADE_IN_MS / 1000);
    baseOsc.connect(baseGain); baseGain.connect(voiceGain);
    baseOsc.start(now);

    // 2. Detuned chorus oscillator — inaudible at first, ramps in slowly
    const detOsc = ctx.createOscillator();
    detOsc.type = 'triangle';
    detOsc.frequency.value = freq;
    detOsc.detune.value    = DETUNE_CENTS;
    const detGain = ctx.createGain();
    detGain.gain.setValueAtTime(0, now);
    detGain.gain.linearRampToValueAtTime(0.14, now + DETUNE_RAMP_MS / 1000);
    detOsc.connect(detGain); detGain.connect(voiceGain);
    detOsc.start(now);

    // 3. Slow LFO on the chorus oscillator's pitch, depth ramps in over time
    const lfo = ctx.createOscillator();
    lfo.type = 'sine';
    lfo.frequency.value = LFO_RATE_HZ;
    const lfoDepth = ctx.createGain();
    lfoDepth.gain.setValueAtTime(0, now);
    lfoDepth.gain.linearRampToValueAtTime(LFO_MAX_CENTS, now + LFO_DEPTH_RAMP_MS / 1000);
    lfo.connect(lfoDepth); lfoDepth.connect(detOsc.detune);
    lfo.start(now);

    // 4. Filtered noise — soft breath-like texture, ramps in slowest
    const noiseSrc = ctx.createBufferSource();
    noiseSrc.buffer = getNoiseBuffer();
    noiseSrc.loop   = true;
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = freq;
    bp.Q.value = NOISE_Q;
    const noiseGain = ctx.createGain();
    noiseGain.gain.setValueAtTime(0, now);
    noiseGain.gain.linearRampToValueAtTime(0.10, now + NOISE_RAMP_MS / 1000);
    noiseSrc.connect(bp); bp.connect(noiseGain); noiseGain.connect(voiceGain);
    noiseSrc.start(now);

    voices[idx] = { voiceGain, baseOsc, detOsc, lfo, noiseSrc };
  }

  function stopVoice(idx) {
    const v = voices[idx];
    if (!v) return;
    delete voices[idx];
    const now = ctx.currentTime;
    v.voiceGain.gain.cancelScheduledValues(now);
    v.voiceGain.gain.setValueAtTime(v.voiceGain.gain.value, now);
    v.voiceGain.gain.linearRampToValueAtTime(0, now + RELEASE_MS / 1000);
    const stopAt = now + RELEASE_MS / 1000 + 0.05;
    [v.baseOsc, v.detOsc, v.lfo, v.noiseSrc].forEach(n => { try { n.stop(stopAt); } catch (_) {} });
  }

  const surpetiPanel = document.getElementById('surpeti-panel');
  SARGAM.forEach((note, idx) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'sargam-key' + (note.sharp ? ' sharp' : '');
    btn.textContent = note.name;
    btn.addEventListener('click', () => {
      ensureCtx();
      const isActive = btn.classList.toggle('active');
      if (isActive) startVoice(idx); else stopVoice(idx);
    });
    surpetiPanel.appendChild(btn);
  });

  /* ── Join session / OTP modal ─────────────────────────────────────── */
  const joinModal    = document.getElementById('join-modal');
  const joinClose    = document.getElementById('join-close');
  const stepEmail    = document.getElementById('step-email');
  const stepOtp      = document.getElementById('step-otp');
  const joinEmailEl  = document.getElementById('join-email');
  const joinSendBtn  = document.getElementById('join-send');
  const joinOtpEl    = document.getElementById('join-otp');
  const joinVerifyBtn= document.getElementById('join-verify');
  const joinErr1     = document.getElementById('join-err1');
  const joinErr2     = document.getElementById('join-err2');
  const joinBackBtn  = document.getElementById('join-back');
  const otpSubEl     = document.getElementById('otp-sub');

  let otpEmail = '';

  function openJoinModal() {
    stepEmail.style.display = '';
    stepOtp.style.display   = 'none';
    joinErr1.textContent    = '';
    joinEmailEl.value       = '';
    joinModal.classList.add('open');
    setTimeout(() => joinEmailEl.focus(), 50);
  }

  function closeJoinModal() {
    joinModal.classList.remove('open');
  }

  joinClose.addEventListener('click', closeJoinModal);
  joinModal.addEventListener('click', e => { if (e.target === joinModal) closeJoinModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeJoinModal(); });

  joinBackBtn.addEventListener('click', () => {
    stepOtp.style.display   = 'none';
    stepEmail.style.display = '';
    joinEmailEl.focus();
  });

  // Step 1 — send OTP email
  async function sendOtp() {
    const email = joinEmailEl.value.trim();
    if (!email || !email.includes('@')) { joinErr1.textContent = 'enter a valid email address'; return; }
    joinErr1.textContent    = '';
    joinSendBtn.disabled    = true;
    joinSendBtn.textContent = 'sending…';
    const { error } = await db.auth.signInWithOtp({ email, options: { shouldCreateUser: true } });
    joinSendBtn.disabled    = false;
    joinSendBtn.textContent = 'send code →';
    if (error) { joinErr1.textContent = error.message; return; }
    otpEmail = email;
    otpSubEl.textContent    = `enter the code we sent to ${email}`;
    joinErr2.textContent    = '';
    joinOtpEl.value         = '';
    stepEmail.style.display = 'none';
    stepOtp.style.display   = '';
    setTimeout(() => joinOtpEl.focus(), 50);
  }

  joinSendBtn.addEventListener('click', sendOtp);
  joinEmailEl.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); sendOtp(); } });

  // Step 2 — verify OTP
  async function verifyOtp() {
    const token = joinOtpEl.value.trim().replace(/\D/g,'');
    if (token.length < 6) { joinErr2.textContent = 'enter the 6-digit code from your email'; return; }
    joinErr2.textContent     = '';
    joinVerifyBtn.disabled   = true;
    joinVerifyBtn.textContent= 'verifying…';
    const { data, error } = await db.auth.verifyOtp({ email: otpEmail, token, type: 'email' });
    joinVerifyBtn.disabled   = false;
    joinVerifyBtn.textContent= 'verify →';
    if (error) { joinErr2.textContent = error.message; return; }
    closeJoinModal();
    window.location.href = 'stream.html';
  }

  joinVerifyBtn.addEventListener('click', verifyOtp);
  joinOtpEl.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); verifyOtp(); } });

})();
</script>

</body>
</html>
