<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fur.FM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500&family=Yatra+One&display=swap" rel="stylesheet">
  <script src="supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Palette:
       bg       #0d1c15  dark Mughal forest
       cream    #f0e0a8  miniature parchment
       saffron  #e07828  figure robes
       gold     #c89020  jewellery / borders
    */

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #0d1c15;
      font-family: 'Hind', sans-serif;
      color: #f0e0a8;
      -webkit-tap-highlight-color: transparent;
    }

    body::after {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background-image: radial-gradient(circle, rgba(200,144,32,0.045) 1px, transparent 1px);
      background-size: 26px 26px;
      pointer-events: none;
    }

    /* ── Floating layer ──────────────────────────────────────── */
    #floating-layer {
      position: fixed; inset: 0; z-index: 10;
      pointer-events: none; overflow: hidden;
    }
    .float-msg {
      position: absolute;
      bottom: 5.5rem;
      white-space: nowrap;
      font-size: 0.85rem;
      pointer-events: none;
      animation: float-up 7s ease-out forwards;
    }
    .f-sender { color: #c89020; }
    .f-text   { color: #f0e0a8; margin-left: 0.42em; }

    @keyframes float-up {
      0%   { transform: translateY(0);     opacity: 0; }
      8%   { opacity: 1; }
      78%  { opacity: 0.9; }
      100% { transform: translateY(-72vh); opacity: 0; }
    }

    /* ── UI chrome ───────────────────────────────────────────── */
    #ui-chrome {
      position: fixed; inset: 0; z-index: 20;
      pointer-events: none;
    }

    #top-left {
      position: absolute; top: 1.5rem; left: 1.5rem;
      display: flex; flex-direction: column; gap: 0.42rem;
    }
    #drone-label {
      font-size: 0.72rem; letter-spacing: 0.05em;
      color: #c89020;
    }
    #live-indicator {
      display: none;
      font-size: 0.75rem;
      pointer-events: auto;
    }
    #live-indicator .dot {
      color: #e07828;
      animation: blink 1.8s ease-in-out infinite;
    }
    #live-link {
      color: #f0e0a8;
      text-decoration: none;
      margin-left: 0.28em;
    }
    #live-link:hover { color: white; text-decoration: underline; }

    #notif-tray {
      position: absolute; top: 4.5rem; right: 1.5rem;
      display: flex; flex-direction: column; gap: 0.5rem;
      align-items: flex-end;
      pointer-events: auto;
    }

    /* ── Drifting session card ───────────────────────────────── */
    #session-card {
      position: fixed;
      top: 0; left: 0;
      z-index: 25;
      display: none;
      flex-direction: column;
      gap: 0.22rem;
      padding: 0.75rem 1rem;
      background: rgba(13,28,21,0.92);
      border: 1px solid #c89020;
      max-width: 210px;
      line-height: 1.55;
      will-change: transform;
      pointer-events: auto;
    }
    #sc-title {
      font-family: 'Yatra One', serif;
      font-size: 0.95rem;
      color: #f0e0a8;
      line-height: 1.35;
    }
    #sc-date {
      font-size: 0.68rem; letter-spacing: 0.04em;
      color: #c89020;
    }
    #sc-join {
      background: transparent; border: none;
      font-family: 'Hind', sans-serif;
      font-size: 0.72rem; letter-spacing: 0.05em;
      color: #e07828;
      cursor: pointer; padding: 0; margin-top: 0.3rem;
      text-align: left; touch-action: manipulation;
      transition: color 0.15s;
    }
    #sc-join:hover { color: #f0e0a8; }

    .notif-card {
      background: rgba(13,28,21,0.92);
      border: 1px solid #c89020;
      padding: 0.65rem 0.95rem;
      font-size: 0.75rem;
      color: #f0e0a8;
      max-width: 230px;
      line-height: 1.6;
      transform: translateX(14px);
      opacity: 0;
      transition: transform 0.32s ease, opacity 0.32s ease;
    }
    .notif-card.visible { transform: translateX(0); opacity: 1; }
    .notif-card a {
      color: #e07828;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .notif-card em {
      color: #f0e0a8;
      font-family: 'Yatra One', serif;
      font-size: 0.88rem;
      font-style: normal;
    }
    .notif-card .dot { color: #e07828; }

    #bottom-left {
      position: absolute;
      bottom: 4.8rem; left: 1.5rem;
      pointer-events: none;
    }
    #listener-count {
      font-size: 0.7rem; letter-spacing: 0.05em;
      color: #c89020;
    }

    #bottom-right {
      position: absolute;
      bottom: 4.8rem; right: 1.5rem;
      display: flex; align-items: center; gap: 0.4rem;
      pointer-events: auto;
    }
    #username-text { font-size: 0.72rem; color: #c89020; }
    #username-edit {
      background: transparent; border: none;
      color: rgba(200,144,32,0.55); cursor: pointer;
      font-size: 0.78rem; padding: 0 0.1rem; line-height: 1;
      touch-action: manipulation;
    }
    #username-edit:hover { color: #f0e0a8; }
    #username-input {
      background: transparent; border: none;
      border-bottom: 1px solid #c89020;
      color: #f0e0a8;
      font-family: 'Hind', sans-serif; font-size: 0.72rem;
      padding: 0.1rem 0; outline: none; width: 130px;
    }

    /* ── Chat bar ────────────────────────────────────────────── */
    #chat-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      z-index: 30;
      padding: 0.75rem 1.5rem;
      padding-bottom: max(1rem, env(safe-area-inset-bottom));
      background: linear-gradient(to top, rgba(13,28,21,0.98) 55%, transparent);
      display: flex; align-items: center; gap: 0.75rem;
    }
    #chat-input {
      flex: 1; background: transparent; border: none;
      border-bottom: 1px solid rgba(200,144,32,0.4);
      color: #f0e0a8;
      font-family: 'Hind', sans-serif; font-size: 0.85rem;
      padding: 0.35rem 0; outline: none;
    }
    #chat-input::placeholder { color: rgba(200,144,32,0.45); }
    #send-btn {
      background: transparent; border: none;
      color: #c89020; cursor: pointer;
      font-size: 1rem; padding: 0 0.15rem;
      transition: color 0.15s; touch-action: manipulation;
    }
    #send-btn:hover { color: #f0e0a8; }

    /* ── Brand ───────────────────────────────────────────────── */
    #brand {
      position: fixed;
      top: 1.4rem; right: 1.5rem;
      z-index: 30;
      pointer-events: none;
      user-select: none;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 0.18rem;
    }
    #brand svg { opacity: 0.9; width: 100%; height: auto; }
    #brand-tagline {
      font-family: 'Hind', sans-serif;
      font-size: 0.6rem;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: rgba(200,144,32,0.55);
      margin-top: 0;
      white-space: nowrap;
      text-align: right;
    }

    /* ── Tap overlay ─────────────────────────────────────────── */
    #tap-overlay {
      position: fixed; inset: 0; z-index: 100;
      background: #0d1c15;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 0.9rem;
      cursor: pointer; transition: opacity 0.55s ease;
      touch-action: manipulation;
    }
    #tap-logo { opacity: 0.55; }
    #tap-hint {
      font-family: 'Yatra One', serif;
      font-size: 0.82rem; letter-spacing: 0.18em;
      color: #c89020;
      user-select: none;
    }

    /* ── Join / OTP modal ────────────────────────────────────── */
    #join-modal {
      position: fixed; inset: 0; z-index: 50;
      background: rgba(13,28,21,0.97);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity 0.28s ease;
    }
    #join-modal.open { opacity: 1; pointer-events: auto; }

    #join-panel {
      position: relative;
      width: 100%; max-width: 280px;
      padding: 0 1.5rem;
      display: flex; flex-direction: column;
    }
    #join-close {
      position: absolute; top: -2.2rem; right: 1.5rem;
      cursor: pointer; font-size: 1.1rem;
      color: #c89020;
      background: none; border: none;
      font-family: inherit; touch-action: manipulation;
      transition: color 0.15s;
    }
    #join-close:hover { color: #f0e0a8; }

    .join-heading {
      font-family: 'Yatra One', serif;
      font-size: 1rem; letter-spacing: 0.02em;
      color: #f0e0a8;
      margin-bottom: 0.35rem;
    }
    .join-sub {
      font-size: 0.72rem; color: #c89020;
      margin-bottom: 1.4rem; line-height: 1.55;
    }
    .join-input {
      background: transparent; border: none;
      border-bottom: 1px solid #c89020;
      color: #f0e0a8;
      font-family: 'Hind', sans-serif; font-size: 0.9rem;
      padding: 0.4rem 0; outline: none; width: 100%;
      margin-bottom: 1.2rem;
    }
    .join-input::placeholder { color: rgba(200,144,32,0.4); }
    .join-submit {
      background: transparent; border: none;
      font-family: 'Hind', sans-serif;
      font-size: 0.8rem; letter-spacing: 0.05em;
      color: #e07828;
      cursor: pointer; padding: 0; text-align: left;
      touch-action: manipulation; transition: color 0.15s;
    }
    .join-submit:hover { color: #f0e0a8; }
    .join-submit:disabled { color: rgba(200,144,32,0.3); cursor: default; }
    .join-err {
      font-size: 0.68rem; color: #e05030;
      margin-top: 0.8rem; min-height: 1rem; line-height: 1.5;
    }
    .join-back {
      font-size: 0.68rem; color: #c89020;
      cursor: pointer; background: none; border: none;
      font-family: inherit; padding: 0; margin-top: 1.2rem;
      touch-action: manipulation;
    }
    .join-back:hover { color: #f0e0a8; }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }
  </style>
</head>
<body>

<div id="brand">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 168 34" width="140" height="29" fill="none">
    <text x="0" y="26"
      font-family="'Courier New',Courier,monospace"
      font-size="24" font-weight="700" letter-spacing="1"
      fill="#f0e0a8">Fur</text>
    <circle cx="63" cy="19" r="4.5" fill="#e07828"/>
    <text x="81" y="26"
      font-family="'Courier New',Courier,monospace"
      font-size="24" font-weight="700" letter-spacing="1"
      fill="#f0e0a8">FM</text>
  </svg>
  <div id="brand-tagline">Intentional Listening Space</div>
</div>

<div id="floating-layer"></div>

<div id="ui-chrome">
  <div id="top-left">
    <div id="drone-label">·</div>
    <div id="live-indicator">
      <span class="dot">●</span><a href="stream.html" target="_blank" id="live-link">live now · join →</a>
    </div>
  </div>
  <div id="notif-tray"></div>
  <div id="bottom-left">
    <div id="listener-count">·</div>
  </div>
  <div id="bottom-right">
    <span id="username-text"></span>
    <button id="username-edit" title="change name">✎</button>
    <input id="username-input" style="display:none" maxlength="28" autocomplete="off" spellcheck="false" />
  </div>
</div>

<div id="chat-bar">
  <input id="chat-input" type="text" placeholder="say something…" maxlength="200" autocomplete="off" />
  <button id="send-btn">→</button>
</div>

<!-- Drifting session / join card -->
<div id="session-card">
  <div id="sc-title"></div>
  <div id="sc-date"></div>
  <button id="sc-join">join →</button>
</div>

<div id="tap-overlay">
  <svg id="tap-logo" viewBox="0 0 280 108" width="160" height="62" fill="none">
    <defs>
      <clipPath id="tap-clip">
        <rect x="0" y="0" width="280" height="82"/>
      </clipPath>
    </defs>
    <g clip-path="url(#tap-clip)">
      <circle cx="138" cy="82" r="36"  stroke="#f0e0a8" stroke-width="1.3" opacity="0.65"/>
      <circle cx="138" cy="82" r="54"  stroke="#f0e0a8" stroke-width="1.0" opacity="0.44"/>
      <circle cx="138" cy="82" r="72"  stroke="#f0e0a8" stroke-width="0.75" opacity="0.26"/>
    </g>
    <circle cx="138" cy="82" r="5" fill="#f0e0a8"/>
    <text x="128" y="89" text-anchor="end"   font-family="'Courier New'" font-size="22" font-weight="bold" letter-spacing="4" fill="#f0e0a8">FUR</text>
    <text x="148" y="89" text-anchor="start" font-family="'Courier New'" font-size="22" font-weight="bold" letter-spacing="4" fill="#f0e0a8">FM</text>
  </svg>
  <div id="tap-hint">tap to listen</div>
</div>

<!-- Join / OTP modal -->
<div id="join-modal">
  <div id="join-panel">
    <button id="join-close">×</button>

    <!-- Step 1: email -->
    <div id="step-email">
      <div class="join-heading">join the session</div>
      <div class="join-sub">we'll send a one-time code to your email</div>
      <input class="join-input" id="join-email" type="email" placeholder="your@email.com" autocomplete="email" />
      <button class="join-submit" id="join-send">send code →</button>
      <div class="join-err" id="join-err1"></div>
    </div>

    <!-- Step 2: OTP code -->
    <div id="step-otp" style="display:none">
      <div class="join-heading">check your email</div>
      <div class="join-sub" id="otp-sub">enter the 6-digit code we sent</div>
      <input class="join-input" id="join-otp" type="text" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="one-time-code" />
      <button class="join-submit" id="join-verify">verify →</button>
      <div class="join-err" id="join-err2"></div>
      <button class="join-back" id="join-back">← use a different email</button>
    </div>

  </div>
</div>

<script>
(async () => {

  /* ── Supabase ──────────────────────────────────────────────────────── */
  const { createClient } = window.supabase;
  const db = createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

  /* ── XSS helper ────────────────────────────────────────────────────── */
  function esc(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  /* ── Username ──────────────────────────────────────────────────────── */
  const ADJS  = ['velvet','amber','silver','crimson','golden','azure','ivory','onyx','jade','cobalt',
                  'sable','ochre','cedar','coral','ember','frost','dusk','lunar','solar','hollow',
                  'mossy','burnt','still','muted','copper'];
  const NOUNS = ['moth','crane','raven','finch','fox','wolf','sparrow','hawk','owl','hare',
                  'deer','fern','reed','mist','tide','wave','stone','bloom','creek','petal',
                  'ash','birch','dune','pine','flint'];

  function genName() {
    return ADJS[Math.floor(Math.random()*ADJS.length)] + '-' + NOUNS[Math.floor(Math.random()*NOUNS.length)];
  }

  let myId = localStorage.getItem('fur-fm-id');
  if (!myId) { myId = crypto.randomUUID(); localStorage.setItem('fur-fm-id', myId); }

  let myName = localStorage.getItem('fur-fm-name');
  if (!myName) { myName = genName(); localStorage.setItem('fur-fm-name', myName); }

  const nameTextEl  = document.getElementById('username-text');
  const nameEditBtn = document.getElementById('username-edit');
  const nameInputEl = document.getElementById('username-input');

  function renderName() { nameTextEl.textContent = myName; }
  renderName();

  nameEditBtn.addEventListener('click', () => {
    nameInputEl.value = myName;
    nameInputEl.style.display   = '';
    nameTextEl.style.display    = 'none';
    nameEditBtn.style.display   = 'none';
    nameInputEl.focus();
    nameInputEl.select();
  });

  function commitName() {
    const v = nameInputEl.value.trim().replace(/[<>"&]/g,'').slice(0, 28);
    if (v && v !== myName) {
      myName = v;
      localStorage.setItem('fur-fm-name', myName);
      if (presenceChannel) presenceChannel.track({ username: myName });
    }
    nameInputEl.style.display  = 'none';
    nameTextEl.style.display   = '';
    nameEditBtn.style.display  = '';
    renderName();
  }

  nameInputEl.addEventListener('blur', commitName);
  nameInputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); nameInputEl.blur(); }
  });

  /* ── Floating messages ─────────────────────────────────────────────── */
  const floatLayer = document.getElementById('floating-layer');

  function floatMessage(sender, text) {
    const el = document.createElement('div');
    el.className  = 'float-msg';
    el.style.left = (8 + Math.random() * 70) + '%';
    el.innerHTML  = `<span class="f-sender">${esc(sender)}</span><span class="f-text">${esc(text)}</span>`;
    floatLayer.appendChild(el);
    setTimeout(() => el.remove(), 7500);
  }

  /* ── Notifications ─────────────────────────────────────────────────── */
  const notifTray = document.getElementById('notif-tray');

  function showNotif(html, autoDismissMs = 6500) {
    const card = document.createElement('div');
    card.className = 'notif-card';
    card.innerHTML = html;
    notifTray.appendChild(card);
    requestAnimationFrame(() => requestAnimationFrame(() => card.classList.add('visible')));
    if (autoDismissMs > 0) {
      setTimeout(() => {
        card.classList.remove('visible');
        setTimeout(() => card.remove(), 400);
      }, autoDismissMs);
    }
    return card;
  }

  /* ── Live indicator + now_playing watch ────────────────────────────── */
  const liveEl      = document.getElementById('live-indicator');
  const liveLinkEl  = document.getElementById('live-link');
  let   liveCard    = null;
  let   wasLive     = false;

  function setLive(on, label) {
    liveEl.style.display = on ? '' : 'none';
    if (on && label) liveLinkEl.textContent = label + ' · join →';
  }

  /* ── Drifting session card ─────────────────────────────────────────── */
  const sessionCard = document.getElementById('session-card');
  const scTitle     = document.getElementById('sc-title');
  const scDate      = document.getElementById('sc-date');
  const scJoinBtn   = document.getElementById('sc-join');
  let   driftTimer  = null;

  function startDrift() {
    sessionCard.style.display = 'flex';

    function moveTo() {
      const cw   = sessionCard.offsetWidth  || 170;
      const ch   = sessionCard.offsetHeight || 85;
      const padX = 28;
      const padY = 28;
      const maxX = window.innerWidth  - cw - padX;
      const maxY = window.innerHeight * 0.74 - ch; // stay clear of chat bar
      const x    = padX + Math.random() * Math.max(0, maxX - padX);
      const y    = padY + Math.random() * Math.max(0, maxY - padY);
      sessionCard.style.transform = `translate(${x}px, ${y}px)`;
    }

    // Snap to first position instantly, then begin smooth drift
    sessionCard.style.transition = 'none';
    moveTo();
    setTimeout(() => {
      sessionCard.style.transition = 'transform 7s ease-in-out';
      moveTo();
      driftTimer = setInterval(moveTo, 7500);
    }, 80);
  }

  (async () => {
    // Upcoming session → populate drifting card
    const today = new Date().toISOString().slice(0, 10);
    const { data: next } = await db.from('sessions')
      .select('title, date')
      .gte('date', today)
      .order('date', { ascending: true })
      .limit(1)
      .maybeSingle();

    if (next?.title) {
      scTitle.textContent = next.title;
      scDate.textContent  = next.date
        ? new Date(next.date + 'T12:00:00').toLocaleDateString('en-US', { month: 'long', day: 'numeric' })
        : '';
    } else {
      scTitle.textContent = 'fur fm';
      scDate.textContent  = 'sessions coming soon';
    }

    // Wire join button — skip modal if already authed
    const { data: { session: existing } } = await db.auth.getSession();
    if (existing) {
      scJoinBtn.textContent = 'enter room →';
      scJoinBtn.addEventListener('click', () => window.open('stream.html', '_blank'));
    } else {
      scJoinBtn.addEventListener('click', () => openJoinModal());
    }

    startDrift();

    // Current live state
    const { data: np } = await db.from('now_playing')
      .select('is_playing, archive_header, track_title')
      .eq('id', '00000000-0000-0000-0000-000000000001')
      .maybeSingle();

    if (np?.is_playing) {
      wasLive = true;
      setLive(true, np.archive_header || np.track_title || 'Session');
    }

    // Realtime watch
    db.channel('lounge-np')
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'now_playing' }, ({ new: d }) => {
        if (d.is_playing && !wasLive) {
          wasLive = true;
          const label = d.archive_header || d.track_title || 'Session';
          setLive(true, label);
          liveCard = showNotif(
            `<span class="dot">●</span> live now · <em>${esc(label)}</em><br><a href="stream.html" target="_blank">join the session →</a>`,
            0
          );
        } else if (!d.is_playing && wasLive) {
          wasLive = false;
          setLive(false);
          if (liveCard) {
            liveCard.classList.remove('visible');
            setTimeout(() => { liveCard?.remove(); liveCard = null; }, 400);
          }
        }
      })
      .subscribe();
  })();

  /* ── Chat ──────────────────────────────────────────────────────────── */
  const chatInputEl = document.getElementById('chat-input');
  const sendBtnEl   = document.getElementById('send-btn');
  const LOUNGE_ID   = 'lounge';

  const { data: history } = await db.from('chat_messages')
    .select('username, content')
    .eq('session_id', LOUNGE_ID)
    .order('created_at', { ascending: true })
    .limit(30);

  if (history?.length) {
    history.slice(-8).forEach((m, i) => {
      setTimeout(() => floatMessage(m.username || 'listener', m.content), i * 900 + 300);
    });
  }

  // Track recently sent messages to avoid echoing them back from realtime
  const recentSent = new Set();

  db.channel('lounge-chat')
    .on('postgres_changes', {
      event: 'INSERT', schema: 'public', table: 'chat_messages',
    }, ({ new: msg }) => {
      if (msg.session_id !== LOUNGE_ID) return;
      const key = (msg.username || '') + '\0' + (msg.content || '');
      if (!recentSent.has(key))
        floatMessage(msg.username || 'listener', msg.content);
    })
    .subscribe((status, err) => {
      if (err) console.error('[fur-fm] chat sub error:', err);
      else console.log('[fur-fm] chat sub status:', status);
    });

  async function sendMessage() {
    const text = chatInputEl.value.trim();
    if (!text) return;
    floatMessage(myName, text);
    chatInputEl.value = '';
    const key = myName + '\0' + text;
    recentSent.add(key);
    setTimeout(() => recentSent.delete(key), 5000);
    const { error } = await db.from('chat_messages').insert({
      user_id: null, username: myName,
      content: text, session_id: LOUNGE_ID,
    });
    if (error) console.error('[fur-fm] chat insert error:', error);
  }

  sendBtnEl.addEventListener('click', sendMessage);
  chatInputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  /* ── Presence ──────────────────────────────────────────────────────── */
  const countEl = document.getElementById('listener-count');
  let presenceChannel = null;

  presenceChannel = db.channel('fur-fm:room');
  presenceChannel
    .on('presence', { event: 'sync' }, () => {
      const n = Object.keys(presenceChannel.presenceState()).length;
      countEl.textContent = n === 1 ? '1 listening' : `${n} listening`;
    })
    .subscribe(async status => {
      if (status === 'SUBSCRIBED') await presenceChannel.track({ username: myName });
    });

  /* ── Drone synth ───────────────────────────────────────────────────── */
  const SLOT_MS       = 8 * 60 * 1000;   // 8-minute drone slots
  const LFO_PERIOD_MS = 30 * 1000;       // 30-second filter sweep

  const ROOTS = [
    { hz: 55.00,  name: 'A' },
    { hz: 73.42,  name: 'D' },
    { hz: 82.41,  name: 'E' },
    { hz: 98.00,  name: 'G' },
    { hz: 110.00, name: 'A' },
  ];

  // Deterministic pseudo-random from integer seed + index
  function seedRand(seed, n) {
    const x = Math.sin(seed * 127.1 + n * 311.7) * 43758.5453;
    return x - Math.floor(x);
  }

  function droneParams(seed) {
    const ri = Math.floor(seedRand(seed, 0) * ROOTS.length);
    return {
      rootHz:     ROOTS[ri].hz,
      rootName:   ROOTS[ri].name,
      detune2:    (seedRand(seed, 1) * 16) - 8,     // ±8 cents on fifth
      detune3:    (seedRand(seed, 2) * 16) - 8,     // ±8 cents on octave
      filterBase: 220 + seedRand(seed, 3) * 380,    // 220–600 Hz
      lfoDepth:   70  + seedRand(seed, 4) * 110,    // 70–180 Hz swing
      vol:        0.12 + seedRand(seed, 5) * 0.08,  // 0.12–0.20
    };
  }

  function lerp(a, b, t) { return a + (b - a) * t; }

  const droneLabelEl = document.getElementById('drone-label');
  let ctx, oscNodes, filterNode, masterNode, lfoTimer, currentParams;

  function updateDroneLabel() {
    if (!currentParams) return;
    const ms   = SLOT_MS - (Date.now() % SLOT_MS);
    const mins = Math.ceil(ms / 60000);
    droneLabelEl.textContent =
      `drone in ${currentParams.rootName} · shifting in ${mins < 2 ? 'soon' : mins + 'm'}`;
  }

  // LFO runs on a setInterval so phase is locked to wall-clock time —
  // all listeners at the same UTC moment compute the same phase.
  function startLFO(params, fromParams, transStart) {
    clearInterval(lfoTimer);
    const TRANS_MS = 12000;
    lfoTimer = setInterval(() => {
      let base  = params.filterBase;
      let depth = params.lfoDepth;
      if (fromParams && transStart) {
        const p = Math.min(1, (Date.now() - transStart) / TRANS_MS);
        base  = lerp(fromParams.filterBase, params.filterBase, p);
        depth = lerp(fromParams.lfoDepth,   params.lfoDepth,   p);
      }
      const phase  = ((Date.now() % LFO_PERIOD_MS) / LFO_PERIOD_MS) * Math.PI * 2;
      const cutoff = Math.max(60, base + Math.sin(phase) * depth);
      filterNode.frequency.setTargetAtTime(cutoff, ctx.currentTime, 0.35);
    }, 100);
  }

  function scheduleDroneSlot() {
    const msUntilNext = SLOT_MS - (Date.now() % SLOT_MS);
    setTimeout(() => {
      const newParams = droneParams(Math.floor(Date.now() / SLOT_MS));
      const t    = ctx.currentTime;
      const RAMP = 12; // seconds to crossfade
      oscNodes[0].osc.frequency.linearRampToValueAtTime(newParams.rootHz,       t + RAMP);
      oscNodes[1].osc.frequency.linearRampToValueAtTime(newParams.rootHz * 1.5, t + RAMP);
      oscNodes[2].osc.frequency.linearRampToValueAtTime(newParams.rootHz * 2,   t + RAMP);
      oscNodes[1].osc.detune.linearRampToValueAtTime(newParams.detune2, t + RAMP);
      oscNodes[2].osc.detune.linearRampToValueAtTime(newParams.detune3, t + RAMP);
      masterNode.gain.linearRampToValueAtTime(newParams.vol, t + RAMP);
      startLFO(newParams, currentParams, Date.now());
      currentParams = newParams;
      updateDroneLabel();
      scheduleDroneSlot(); // schedule the one after
    }, msUntilNext);
  }

  function buildDrone() {
    const seed = Math.floor(Date.now() / SLOT_MS);
    currentParams = droneParams(seed);
    const p = currentParams;

    ctx = new (window.AudioContext || window.webkitAudioContext)();

    // Root + fifth + octave, each slightly detuned for warmth
    const cfgs = [
      { freq: p.rootHz,       detune: 0,         vol: 0.62 },
      { freq: p.rootHz * 1.5, detune: p.detune2,  vol: 0.36 },
      { freq: p.rootHz * 2,   detune: p.detune3,  vol: 0.18 },
    ];

    oscNodes = cfgs.map(({ freq, detune, vol }) => {
      const osc = ctx.createOscillator();
      const g   = ctx.createGain();
      osc.type            = 'sine';
      osc.frequency.value = freq;
      osc.detune.value    = detune;
      g.gain.value        = vol;
      osc.connect(g);
      return { osc, g };
    });

    // Low-pass filter (driven by LFO)
    filterNode = ctx.createBiquadFilter();
    filterNode.type            = 'lowpass';
    filterNode.Q.value         = 0.9;
    filterNode.frequency.value = p.filterBase;

    // Three comb-filter delays for a long reverb tail
    function makeComb(dt, fb) {
      const d  = ctx.createDelay(4); d.delayTime.value = dt;
      const fg = ctx.createGain();   fg.gain.value     = fb;
      d.connect(fg); fg.connect(d);
      return d;
    }
    const c1 = makeComb(0.233, 0.70);
    const c2 = makeComb(0.413, 0.65);
    const c3 = makeComb(0.173, 0.60);

    const dryG = ctx.createGain();  dryG.gain.value  = 0.42;
    const w1   = ctx.createGain();  w1.gain.value    = 0.28;
    const w2   = ctx.createGain();  w2.gain.value    = 0.20;
    const w3   = ctx.createGain();  w3.gain.value    = 0.14;

    masterNode = ctx.createGain();
    masterNode.gain.value = 0; // starts silent, fades in

    oscNodes.forEach(({ g }) => g.connect(filterNode));
    filterNode.connect(dryG); dryG.connect(masterNode);
    filterNode.connect(c1);   c1.connect(w1); w1.connect(masterNode);
    filterNode.connect(c2);   c2.connect(w2); w2.connect(masterNode);
    filterNode.connect(c3);   c3.connect(w3); w3.connect(masterNode);
    masterNode.connect(ctx.destination);

    oscNodes.forEach(({ osc }) => osc.start());
    masterNode.gain.linearRampToValueAtTime(p.vol, ctx.currentTime + 3);

    startLFO(currentParams);
    updateDroneLabel();
    scheduleDroneSlot();
    setInterval(updateDroneLabel, 60000);
  }

  /* ── Join session / OTP modal ─────────────────────────────────────── */
  const joinModal    = document.getElementById('join-modal');
  const joinClose    = document.getElementById('join-close');
  const stepEmail    = document.getElementById('step-email');
  const stepOtp      = document.getElementById('step-otp');
  const joinEmailEl  = document.getElementById('join-email');
  const joinSendBtn  = document.getElementById('join-send');
  const joinOtpEl    = document.getElementById('join-otp');
  const joinVerifyBtn= document.getElementById('join-verify');
  const joinErr1     = document.getElementById('join-err1');
  const joinErr2     = document.getElementById('join-err2');
  const joinBackBtn  = document.getElementById('join-back');
  const otpSubEl     = document.getElementById('otp-sub');

  let otpEmail = '';

  function openJoinModal() {
    stepEmail.style.display = '';
    stepOtp.style.display   = 'none';
    joinErr1.textContent    = '';
    joinEmailEl.value       = '';
    joinModal.classList.add('open');
    setTimeout(() => joinEmailEl.focus(), 50);
  }

  function closeJoinModal() {
    joinModal.classList.remove('open');
  }

  joinClose.addEventListener('click', closeJoinModal);
  joinModal.addEventListener('click', e => { if (e.target === joinModal) closeJoinModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeJoinModal(); });

  joinBackBtn.addEventListener('click', () => {
    stepOtp.style.display   = 'none';
    stepEmail.style.display = '';
    joinEmailEl.focus();
  });

  // Step 1 — send OTP email
  async function sendOtp() {
    const email = joinEmailEl.value.trim();
    if (!email || !email.includes('@')) { joinErr1.textContent = 'enter a valid email address'; return; }
    joinErr1.textContent    = '';
    joinSendBtn.disabled    = true;
    joinSendBtn.textContent = 'sending…';
    const { error } = await db.auth.signInWithOtp({ email, options: { shouldCreateUser: true } });
    joinSendBtn.disabled    = false;
    joinSendBtn.textContent = 'send code →';
    if (error) { joinErr1.textContent = error.message; return; }
    otpEmail = email;
    otpSubEl.textContent    = `enter the code we sent to ${email}`;
    joinErr2.textContent    = '';
    joinOtpEl.value         = '';
    stepEmail.style.display = 'none';
    stepOtp.style.display   = '';
    setTimeout(() => joinOtpEl.focus(), 50);
  }

  joinSendBtn.addEventListener('click', sendOtp);
  joinEmailEl.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); sendOtp(); } });

  // Step 2 — verify OTP
  async function verifyOtp() {
    const token = joinOtpEl.value.trim().replace(/\D/g,'');
    if (token.length < 6) { joinErr2.textContent = 'enter the 6-digit code from your email'; return; }
    joinErr2.textContent     = '';
    joinVerifyBtn.disabled   = true;
    joinVerifyBtn.textContent= 'verifying…';
    const { data, error } = await db.auth.verifyOtp({ email: otpEmail, token, type: 'email' });
    joinVerifyBtn.disabled   = false;
    joinVerifyBtn.textContent= 'verify →';
    if (error) { joinErr2.textContent = error.message; return; }
    closeJoinModal();
    window.location.href = 'stream.html';
  }

  joinVerifyBtn.addEventListener('click', verifyOtp);
  joinOtpEl.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); verifyOtp(); } });

  /* ── Tap overlay ───────────────────────────────────────────────────── */
  const tapOverlay = document.getElementById('tap-overlay');
  tapOverlay.addEventListener('click', () => {
    buildDrone();
    tapOverlay.style.opacity      = '0';
    tapOverlay.style.pointerEvents = 'none';
    setTimeout(() => tapOverlay.remove(), 600);
  }, { once: true });

})();
</script>

</body>
</html>
