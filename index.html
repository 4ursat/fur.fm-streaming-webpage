<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fur.FM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500&family=Yatra+One&display=swap" rel="stylesheet">
  <script src="supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Palette (black & white):
       bg      #ffffff  base
       ink     #000000  primary text / accents
       muted   #666666  secondary text / borders
    */

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #ffffff;
      font-family: 'Yatra One', serif;
      color: #000000;
      -webkit-tap-highlight-color: transparent;
    }

    /* Grain texture — same speckle tile as the visualizer, so every page
       shares one consistent grainy, textured feel. */
    body::after {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background-image: url('grain.png');
      background-repeat: repeat;
      opacity: 0.2;
      pointer-events: none;
    }

    /* ── UI chrome ───────────────────────────────────────────── */
    #ui-chrome {
      position: fixed; inset: 0; z-index: 20;
      pointer-events: none;
    }

    #top-left {
      position: absolute; top: 6.2rem; left: 1.5rem;
      display: flex; flex-direction: column; gap: 0.42rem;
    }
    #live-indicator {
      display: none;
      font-size: 0.75rem;
      pointer-events: auto;
    }
    #live-indicator .dot {
      color: #000000;
      animation: blink 1.8s ease-in-out infinite;
    }
    #live-link {
      color: #000000;
      text-decoration: none;
      margin-left: 0.28em;
    }
    #live-link:hover { color: #000000; text-decoration: underline; }

    #notif-tray {
      position: absolute; top: 4.5rem; right: 1.5rem;
      display: flex; flex-direction: column; gap: 0.5rem;
      align-items: flex-end;
      pointer-events: auto;
    }

    /* ── Session / join card ─────────────────────────────────── */
    #session-card {
      position: fixed;
      z-index: 25;
      display: none;
      flex-direction: column;
      gap: 0.22rem;
      padding: 0.75rem 1rem;
      background: rgba(255,255,255,0.92);
      border: 1px solid #666666;
      max-width: 210px;
      line-height: 1.55;
      pointer-events: auto;
      top: 0; left: 0;
      will-change: transform;
    }
    #sc-title {
      font-family: 'Yatra One', serif;
      font-size: 0.95rem;
      color: #000000;
      line-height: 1.35;
    }
    #sc-date {
      font-size: 0.68rem; letter-spacing: 0.04em;
      color: #666666;
    }
    #sc-join {
      display: inline-block;
      background: transparent; border: none;
      font-family: 'Yatra One', serif;
      font-size: 0.72rem; letter-spacing: 0.05em;
      color: #000000;
      text-decoration: none;
      cursor: pointer; padding: 0; margin-top: 0.3rem;
      text-align: left; touch-action: manipulation;
      transition: color 0.15s;
    }
    #sc-join:hover { color: #000000; }

    /* ── Ambient wave visualizer ─────────────────────────────── */
    #wave-canvas {
      position: fixed;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
    }
    #ambient-controls {
      position: fixed;
      bottom: 2rem; left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 1.1rem;
    }
    #ambient-play {
      appearance: none;
      background: transparent;
      border: 1.5px solid rgba(0,0,0,0.5);
      border-radius: 999px;
      color: rgba(0,0,0,0.85);
      font-family: 'Yatra One', serif;
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.4rem 1.15rem;
      cursor: pointer;
      touch-action: manipulation;
      transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
    }
    #ambient-play:hover { border-color: #000000; color: #000000; }
    #ambient-play.active {
      background: rgba(0,0,0,0.18);
      border-color: #000000;
      color: #000000;
    }
    #ambient-volume-wrap {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    #ambient-volume-wrap label {
      font-size: 0.6rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(0,0,0,0.5);
    }
    #ambient-volume {
      -webkit-appearance: none;
      appearance: none;
      width: 90px;
      height: 2px;
      background: rgba(0,0,0,0.3);
      outline: none;
      cursor: pointer;
    }
    #ambient-volume::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #000000;
      cursor: pointer;
    }
    #ambient-volume::-moz-range-thumb {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #000000;
      border: none;
      cursor: pointer;
    }
    @media (max-width: 560px) {
      #ambient-controls { bottom: 1.4rem; gap: 0.8rem; }
      #ambient-volume { width: 64px; }
    }
    .notif-card {
      background: rgba(255,255,255,0.92);
      border: 1px solid #666666;
      padding: 0.65rem 0.95rem;
      font-size: 0.75rem;
      color: #000000;
      max-width: 230px;
      line-height: 1.6;
      transform: translateX(14px);
      opacity: 0;
      transition: transform 0.32s ease, opacity 0.32s ease;
    }
    .notif-card.visible { transform: translateX(0); opacity: 1; }
    .notif-card a {
      color: #000000;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .notif-card em {
      color: #000000;
      font-family: 'Yatra One', serif;
      font-size: 0.88rem;
      font-style: normal;
    }
    .notif-card .dot { color: #000000; }

    /* ── Brand ───────────────────────────────────────────────── */
    #brand {
      position: fixed;
      top: 1.4rem; left: 1.5rem;
      z-index: 30;
      user-select: none;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.18rem;
      text-decoration: none;
    }
    #brand svg { opacity: 1; width: 100%; height: auto; }

    /* ── Site nav ────────────────────────────────────────────── */
    #site-nav {
      position: fixed;
      top: 1.7rem; right: 1.5rem;
      z-index: 30;
      display: flex;
      gap: 1.5rem;
      pointer-events: auto;
    }

    /* Page icons live on their own, away from Live and the brand mark. */
    #page-nav {
      position: fixed;
      left: 1.5rem;
      top: 50%;
      transform: translateY(-50%);
      z-index: 30;
      display: flex;
      flex-direction: column;
      gap: 1.4rem;
      pointer-events: auto;
    }
    .nav-link {
      font-family: 'Yatra One', serif;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(0,0,0,0.55);
      text-decoration: none;
      transition: color 0.15s;
      display: flex;
      align-items: center;
    }
    .nav-link:hover { color: #000000; }

    .nav-live {
      background: rgba(210, 110, 120, 0.08);
      color: #b8505f;
      padding: 0.32rem 0.85rem;
      border-radius: 999px;
      font-weight: 700;
      animation: live-halo-pulse 2.8s ease-in-out infinite;
      transition: background 0.15s, color 0.15s;
    }
    .nav-live:hover { background: rgba(210, 110, 120, 0.14); color: #9c3f4d; }
    @keyframes live-halo-pulse {
      0%, 100% { box-shadow: 0 0 8px 1px rgba(210, 110, 120, 0.18); }
      50%      { box-shadow: 0 0 16px 4px rgba(210, 110, 120, 0.35); }
    }

    .nav-icon {
      position: relative;
      width: 1.3rem;
      height: 1.3rem;
      justify-content: center;
    }
    .nav-icon svg { width: 100%; height: 100%; display: block; }
    .nav-icon::after {
      content: attr(aria-label);
      position: absolute;
      left: calc(100% + 0.7rem);
      top: 50%;
      transform: translateY(-50%);
      font-family: 'Yatra One', serif;
      font-size: 0.66rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(0,0,0,0.62);
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
    }
    .nav-icon:hover::after { opacity: 1; }

    @media (max-width: 560px) {
      #site-nav { gap: 0.9rem; top: 1.5rem; right: 1rem; }
      .nav-link { font-size: 0.62rem; letter-spacing: 0.08em; }
      .nav-icon { width: 1.1rem; height: 1.1rem; }
      #page-nav { left: 1rem; gap: 1.1rem; }
      #brand { top: 1.2rem; left: 1rem; }
      /* No real hover on touch — show the label permanently instead of
         gating it behind a gesture mobile can't reliably trigger. */
      .nav-icon::after {
        opacity: 1;
        left: calc(100% + 0.5rem);
        font-size: 0.58rem;
      }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }
  </style>
</head>
<body>

<a id="brand" href="index.html">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 168 64" width="140" height="53" fill="none">
    <text x="0" y="24"
      font-family="'Courier New',Courier,monospace"
      font-size="24" font-weight="700" letter-spacing="1"
      fill="#000000">Fursat FM</text>
    <line x1="1" y1="31" x2="37" y2="31" stroke="rgba(0,0,0,0.4)" stroke-width="1"/>
    <text x="1" y="50"
      font-family="'Yatra One', serif"
      font-size="18"
      fill="rgba(0,0,0,0.75)">फ़ुर्सत</text>
  </svg>
</a>

<nav id="site-nav">
  <a class="nav-link nav-live" href="stream.html">Live</a>
</nav>

<nav id="page-nav">
  <a class="nav-link nav-icon" href="music.html" aria-label="Music" title="Music">
    <svg viewBox="0 0 20 20" fill="none"><path d="M2.3 10.5h1.3l1-4.4 2.1 9 2.3-12.2 2.1 15 2.1-9 1-3.4h1.3" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/></svg>

    <svg viewBox="0 0 20 20" fill="none"><path d="M3 15.5a7 7 0 0 1 14 0" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M10 15.5l3.2-5.7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><circle cx="10" cy="15.5" r="1" fill="currentColor"/></svg>

  <a class="nav-link nav-icon" href="shop.html" aria-label="Shop" title="Shop">

  <a class="nav-link nav-icon" href="contact.html" aria-label="Contact" title="Contact">
    <svg viewBox="0 0 20 20" fill="none"><rect x="2.5" y="4.5" width="15" height="11" rx="1.2" stroke="currentColor" stroke-width="1.4"/><path d="M3 5.5l7 5.5 7-5.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>

<div id="ui-chrome">
  <div id="top-left">
    <div id="live-indicator">
      <span class="dot">●</span><a href="stream.html" target="_blank" id="live-link">live now · join →</a>
    </div>
  </div>
  <div id="notif-tray"></div>
</div>

<!-- Drifting session / join card — shown when a session is scheduled -->
<div id="session-card">
  <div id="sc-title"></div>
  <div id="sc-date"></div>
  <a id="sc-join" href="stream.html" target="_blank">enter room →</a>
</div>


<!-- Ambient wave visualizer — full-screen canvas, audio-reactive via an
     AnalyserNode tapped off the synth's final output. Click anywhere on it
     (or the Play button) to start/stop. -->
<canvas id="wave-canvas"></canvas>

<div id="ambient-controls">
  <button id="ambient-play" type="button">Play</button>
  <div id="ambient-volume-wrap">
    <label for="ambient-volume">vol</label>
    <input type="range" id="ambient-volume" min="0" max="1" step="0.01" value="1" />
  </div>
</div>

<script>
(async () => {

  /* ── Supabase ──────────────────────────────────────────────────────── */
  const { createClient } = window.supabase;
  const db = createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

  /* ── XSS helper ────────────────────────────────────────────────────── */
  function esc(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  /* ── Username ──────────────────────────────────────────────────────── */
  const ADJS  = ['velvet','amber','silver','crimson','golden','azure','ivory','onyx','jade','cobalt',
                  'sable','ochre','cedar','coral','ember','frost','dusk','lunar','solar','hollow',
                  'mossy','burnt','still','muted','copper'];
  const NOUNS = ['moth','crane','raven','finch','fox','wolf','sparrow','hawk','owl','hare',
                  'deer','fern','reed','mist','tide','wave','stone','bloom','creek','petal',
                  'ash','birch','dune','pine','flint'];

  function genName() {
    return ADJS[Math.floor(Math.random()*ADJS.length)] + '-' + NOUNS[Math.floor(Math.random()*NOUNS.length)];
  }

  let myId = localStorage.getItem('fur-fm-id');
  if (!myId) { myId = crypto.randomUUID(); localStorage.setItem('fur-fm-id', myId); }

  let myName = localStorage.getItem('fur-fm-name');
  if (!myName) { myName = genName(); localStorage.setItem('fur-fm-name', myName); }

  /* ── Notifications ─────────────────────────────────────────────────── */
  const notifTray = document.getElementById('notif-tray');

  function showNotif(html, autoDismissMs = 6500) {
    const card = document.createElement('div');
    card.className = 'notif-card';
    card.innerHTML = html;
    notifTray.appendChild(card);
    requestAnimationFrame(() => requestAnimationFrame(() => card.classList.add('visible')));
    if (autoDismissMs > 0) {
      setTimeout(() => {
        card.classList.remove('visible');
        setTimeout(() => card.remove(), 400);
      }, autoDismissMs);
    }
    return card;
  }

  /* ── Live indicator + now_playing watch ────────────────────────────── */
  const liveEl      = document.getElementById('live-indicator');
  const liveLinkEl  = document.getElementById('live-link');
  let   liveCard    = null;
  let   wasLive     = false;

  function setLive(on, label) {
    liveEl.style.display = on ? '' : 'none';
    if (on && label) liveLinkEl.textContent = label + ' · join →';
  }

  /* ── Session card (drifting, when a session is scheduled) ───────────── */
  const sessionCard   = document.getElementById('session-card');
  const scTitle       = document.getElementById('sc-title');
  const scDate        = document.getElementById('sc-date');
  let   driftTimer  = null;

  function startDrift() {
    sessionCard.style.display = 'flex';

    function moveTo() {
      const cw   = sessionCard.offsetWidth  || 170;
      const ch   = sessionCard.offsetHeight || 85;
      const padX = 28;
      const padY = 28;
      const maxX = window.innerWidth  - cw - padX;
      const maxY = window.innerHeight * 0.74 - ch;
      const x    = padX + Math.random() * Math.max(0, maxX - padX);
      const y    = padY + Math.random() * Math.max(0, maxY - padY);
      sessionCard.style.transform = `translate(${x}px, ${y}px)`;
    }

    // Snap to first position instantly, then begin smooth drift
    sessionCard.style.transition = 'none';
    moveTo();
    setTimeout(() => {
      sessionCard.style.transition = 'transform 7s ease-in-out';
      moveTo();
      driftTimer = setInterval(moveTo, 7500);
    }, 80);
  }

  (async () => {
    // Upcoming session → populate drifting card
    const today = new Date().toISOString().slice(0, 10);
    const { data: next } = await db.from('sessions')
      .select('title, date')
      .gte('date', today)
      .order('date', { ascending: true })
      .limit(1)
      .maybeSingle();

    if (next?.title) {
      scTitle.textContent = next.title;
      scDate.textContent  = next.date
        ? new Date(next.date + 'T12:00:00').toLocaleDateString('en-US', { month: 'long', day: 'numeric' })
        : '';
      startDrift();
    }

    // Current live state
    const { data: np } = await db.from('now_playing')
      .select('is_playing, archive_header, track_title')
      .eq('id', '00000000-0000-0000-0000-000000000001')
      .maybeSingle();

    if (np?.is_playing) {
      wasLive = true;
      setLive(true, np.archive_header || np.track_title || 'Session');
    }

    // Realtime watch
    db.channel('lounge-np')
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'now_playing' }, ({ new: d }) => {
        if (d.is_playing && !wasLive) {
          wasLive = true;
          const label = d.archive_header || d.track_title || 'Session';
          setLive(true, label);
          liveCard = showNotif(
            `<span class="dot">●</span> live now · <em>${esc(label)}</em><br><a href="stream.html" target="_blank">join the session →</a>`,
            0
          );
        } else if (!d.is_playing && wasLive) {
          wasLive = false;
          setLive(false);
          if (liveCard) {
            liveCard.classList.remove('visible');
            setTimeout(() => { liveCard?.remove(); liveCard = null; }, 400);
          }
        }
      })
      .subscribe();
  })();

  /* ── Presence ──────────────────────────────────────────────────────── */
  let presenceChannel = db.channel('fur-fm:room');
  presenceChannel
    .subscribe(async status => {
      if (status === 'SUBSCRIBED') await presenceChannel.track({ username: myName });
    });

  /* ── Ambient drone engine ─────────────────────────────────────────────
     Autonomous generative synth, no note-picking UI — Play starts a few
     random voices and an "evolve" timer keeps adding/removing notes over
     time (see scheduleEvolve, further down). Each voice sits at a fixed
     stereo position with a slow auto-pan wobble, passes through its own
     drifting lowpass filter, and feeds a shared procedural reverb —
     detune/LFO/filter/pan/reverb all keep wandering indefinitely (see the
     various scheduleXDrift functions) so it never settles into a static
     sound. The final output feeds an AnalyserNode that drives the
     full-screen wave visualizer below. ─────────────────────────────────── */
  const FADE_IN_MS        = 600;    // base tone fade-in
  const DETUNE_RAMP_MS    = 18000;  // chorus (detuned) oscillator ramp-in
  const BREATH_RAMP_MS    = 24000;  // filtered-noise breath ramp-in
  const LFO_DEPTH_RAMP_MS = 20000;  // pitch-drift LFO depth ramp-in
  const REED_RAMP_MS      = 13000;  // reedy harmonic layer ramp-in
  const RELEASE_MS        = 2200;   // fade-out on toggle-off — long enough to trail into the reverb tail
  const LFO_RATE_HZ       = 0.11;
  const DETUNE_CENTS      = 6;      // chorus detune amount
  const LFO_MAX_CENTS     = 5;      // max pitch-drift depth once fully ramped in
  const BASE_LEVEL        = 0.2;
  const CHORUS_LEVEL      = 0.1;
  const BREATH_LEVEL      = 0.07;   // per-voice filtered-noise "air"
  const BREATH_FILTER_Q   = 0.5;    // lowpass, not resonant bandpass — softer, less whistly
  const REED_LEVEL         = 0.045; // subtle — blends under the base tone
  const REED_DETUNE_CENTS  = -4;    // reed beats against the base + chorus tones
  const REED_FILTER_Q      = 0.5;   // gentle rolloff, no resonant peak
  const REED_CUTOFF_MULT   = 3;     // × fundamental

  // Per-voice tone filter — the whole voice (all 4 layers) passes through
  // this on top of the reed's own filter, and it slowly drifts brighter/
  // darker for a classic filter-sweep pad movement.
  const VOICE_FILTER_INITIAL     = 2600;
  const VOICE_FILTER_Q           = 0.5;
  const DRIFT_VOICE_FILTER_RANGE = [1300, 3600];

  // Stereo spread — each note sits at a fixed pan position across the
  // field, plus a very slow independent auto-pan wobble for movement.
  const PAN_SPREAD    = 0.6;   // outermost notes sit at ±this
  const PAN_LFO_RANGE = [0.02, 0.06]; // Hz, randomized per voice
  const PAN_LFO_DEPTH = 0.16;

  // Slow, indefinite parameter drift once a voice has settled in.
  const DRIFT_MIN_INTERVAL_MS = 14000;
  const DRIFT_MAX_INTERVAL_MS = 26000;
  const DRIFT_RAMP_S          = 10;
  const DRIFT_DETUNE_RANGE    = [3, 8];       // cents
  const DRIFT_LFO_RATE_RANGE  = [0.06, 0.22]; // Hz
  const DRIFT_LFO_DEPTH_RANGE = [3, 9];       // cents
  const DRIFT_REED_CUTOFF_MULT_RANGE = [2, 4]; // × fundamental
  const DRIFT_BREATH_LEVEL_RANGE = [0.04, 0.08];

  const WHITE_NOISE_LEVEL   = 0.05;
  const WHITE_NOISE_RAMP_S  = 1.5;

  // Global ambient noise layer (pink, see getNoiseBuffer) keeps slowly
  // wandering in tone/level while it's on.
  const WHITE_NOISE_DRIFT_MIN_MS = 10000;
  const WHITE_NOISE_DRIFT_MAX_MS = 20000;
  const WHITE_NOISE_DRIFT_RAMP_S = 6;
  const WHITE_NOISE_CUTOFF_RANGE = [900, 2200];
  const WHITE_NOISE_LEVEL_RANGE  = [0.025, 0.06];

  // Master bus — slow filter drift for overall movement, plus a
  // procedurally-generated reverb (no external IR file needed) that's what
  // actually turns bare oscillators into something that feels like a space.
  const MASTER_FILTER_INITIAL      = 3400;
  const MASTER_FILTER_Q            = 0.4;
  const DRIFT_MASTER_FILTER_RANGE  = [1800, 4200];
  const MASTER_FILTER_DRIFT_MIN_MS = 20000;
  const MASTER_FILTER_DRIFT_MAX_MS = 38000;
  const MASTER_FILTER_DRIFT_RAMP_S = 16;

  function randInRange([min, max]) { return min + Math.random() * (max - min); }

  const SARGAM = [
    { name: 'Sa',  hz: 130.81, sharp: false },
    { name: 'Re',  hz: 146.83, sharp: true  },
    { name: 'Ma',  hz: 174.61, sharp: false },
    { name: 'Pa',  hz: 196.00, sharp: true  },
    { name: 'Dha', hz: 220.00, sharp: false },
    { name: "Sa'", hz: 261.63, sharp: true  },
  ];

  // All 6 SARGAM notes sit within a single octave (130-262Hz) — even
  // "different" simultaneous voices end up close in pitch, which compounds
  // clashing/beating. Upper voices now get a random octave on top of their
  // note, and any two simultaneous voices must be at least a fourth apart
  // (see isFarEnoughFromActive), so the ensemble actually spreads out.
  const OCTAVE_OFFSETS     = [-1, 0, 1];
  const MIN_VOICE_GAP_CENTS = 500; // ~a perfect fourth
  const MAX_PICK_ATTEMPTS   = 30;

  function voiceFreq(idx, octaveOffset) {
    return SARGAM[idx].hz * Math.pow(2, octaveOffset);
  }
  function voiceKey(idx, octaveOffset) {
    return idx + ':' + octaveOffset;
  }
  function centsBetween(freqA, freqB) {
    return Math.abs(1200 * Math.log2(freqA / freqB));
  }
  function isFarEnoughFromActive(freq, activeFreqs) {
    return activeFreqs.every(f => centsBetween(freq, f) >= MIN_VOICE_GAP_CENTS);
  }

  // Dedicated low anchor — always on Sa (the tonic), two octaves down
  // (~32.7Hz), simple and unmodulated so it stays a clean, stable bass
  // foundation rather than another evolving/detuned voice.
  const BASS_NOTE_IDX      = 0;
  const BASS_OCTAVE_OFFSET = -2;
  const BASS_LEVEL         = 0.26;
  const BASS_FADE_IN_MS    = 2600;
  const BASS_FILTER_Q      = 0.5;

  const REVERB_WET_DEFAULT = 0.38;
  const REVERB_PRE_DELAY_S = 0.035;

  // Slow tidal rise/fall in overall level — waves washing in and out,
  // rather than a flat, static loudness the whole time.
  const SWELL_RATE_RANGE = [1 / 52, 1 / 30]; // Hz (~30-52s period)
  const SWELL_DEPTH       = 0.16;
  const SWELL_FADE_IN_S    = 15;

  let ctx = null;
  let masterGain = null;
  let masterFilter = null;
  let reverbNode = null;
  let reverbWetGain = null;
  let analyser = null;
  let analyserData = null;
  let whiteNoiseGain = null;
  let whiteNoiseFilter = null;
  let whiteNoiseOn = false;
  let whiteNoiseDriftTimer = null;
  let noiseBufferCache = null;
  let bassVoice = null; // { osc, gain, filter } — separate from `voices`, always-on anchor
  const voices = {}; // "idx:octaveOffset" -> { freq, voiceGain, voiceFilter, pan, panLfo, baseOsc, detOsc, lfo, lfoDepth, noiseSrc, breathFilter, noiseGain, reedOsc, reedFilter, driftTimer }

  function ensureCtx() {
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();

      masterGain = ctx.createGain();
      masterGain.gain.value = parseFloat(volumeSlider.value);

      // Master filter — slow independent drift keeps the whole mix's
      // brightness breathing over time, layered on top of each voice's own
      // filter movement.
      masterFilter = ctx.createBiquadFilter();
      masterFilter.type = 'lowpass';
      masterFilter.frequency.value = MASTER_FILTER_INITIAL;
      masterFilter.Q.value = MASTER_FILTER_Q;

      // Safety limiter — with several voices each running several layers,
      // it's easy to sum past 0dBFS and get harsh digital clipping. This
      // catches peaks well before that point.
      const limiter = ctx.createDynamicsCompressor();
      limiter.threshold.value = -22;
      limiter.knee.value      = 18;
      limiter.ratio.value     = 6;
      limiter.attack.value    = 0.01;
      limiter.release.value   = 0.3;

      // Analyser sits inline in the final output path (not just tapped off
      // to the side) so the wave visualizer reads the actual sound reaching
      // the speakers, post-limiter. Frequency-domain data (not time-domain
      // waveform samples) — the browser smooths it via smoothingTimeConstant,
      // so it drives the visuals with a gentle swell instead of raw per-pixel
      // waveform jitter.
      analyser = ctx.createAnalyser();
      analyser.fftSize = 1024;
      analyser.smoothingTimeConstant = 0.88;
      analyserData = new Uint8Array(analyser.frequencyBinCount);

      limiter.connect(analyser);
      analyser.connect(ctx.destination);

      const dryGain = ctx.createGain();
      dryGain.gain.value = 1;
      dryGain.connect(limiter);

      // Procedurally-generated reverb — this is what actually turns bare
      // oscillators into something that feels like an ambient space, rather
      // than just tweaking individual oscillator levels. No IR file needed.
      // A short pre-delay before the tail gives it a sense of size rather
      // than sounding glued directly to the dry signal.
      const preDelay = ctx.createDelay(0.2);
      preDelay.delayTime.value = REVERB_PRE_DELAY_S;
      reverbNode = ctx.createConvolver();
      reverbNode.buffer = makeReverbImpulse(ctx);
      reverbWetGain = ctx.createGain();
      reverbWetGain.gain.value = REVERB_WET_DEFAULT;
      preDelay.connect(reverbNode);
      reverbNode.connect(reverbWetGain);
      reverbWetGain.connect(limiter);

      // Tidal swell — sits between masterGain (user volume) and everything
      // downstream, so it multiplies whatever level the user has set rather
      // than fighting with it.
      const swellGain = ctx.createGain();
      swellGain.gain.value = 1;
      const swellLfo = ctx.createOscillator();
      swellLfo.type = 'sine';
      swellLfo.frequency.value = randInRange(SWELL_RATE_RANGE);
      const swellDepth = ctx.createGain();
      swellDepth.gain.setValueAtTime(0, ctx.currentTime);
      swellDepth.gain.linearRampToValueAtTime(SWELL_DEPTH, ctx.currentTime + SWELL_FADE_IN_S);
      swellLfo.connect(swellDepth);
      swellDepth.connect(swellGain.gain);
      swellLfo.start();

      masterGain.connect(swellGain);
      swellGain.connect(masterFilter);
      masterFilter.connect(dryGain);
      masterFilter.connect(preDelay);
      scheduleMasterFilterDrift();

      // Global broadband "breath" layer, blended in automatically while
      // playing. Created once and left running at zero gain so ramping it
      // in/out is instant and click-free.
      const noiseSrc = ctx.createBufferSource();
      noiseSrc.buffer = getNoiseBuffer();
      noiseSrc.loop   = true;
      whiteNoiseFilter = ctx.createBiquadFilter();
      whiteNoiseFilter.type = 'lowpass';
      whiteNoiseFilter.frequency.value = 1600;
      whiteNoiseGain = ctx.createGain();
      whiteNoiseGain.gain.value = 0;
      noiseSrc.connect(whiteNoiseFilter); whiteNoiseFilter.connect(whiteNoiseGain); whiteNoiseGain.connect(masterGain);
      noiseSrc.start();
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  // A short burst of exponentially-decaying noise makes a perfectly
  // serviceable diffuse reverb impulse response without needing to ship an
  // audio file.
  function makeReverbImpulse(ctx, durationSec = 4.2, decay = 3.0) {
    const rate    = ctx.sampleRate;
    const length  = Math.floor(rate * durationSec);
    const impulse = ctx.createBuffer(2, length, rate);
    for (let ch = 0; ch < 2; ch++) {
      const data = impulse.getChannelData(ch);
      for (let i = 0; i < length; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, decay);
      }
    }
    return impulse;
  }

  function scheduleMasterFilterDrift() {
    const delay = MASTER_FILTER_DRIFT_MIN_MS + Math.random() * (MASTER_FILTER_DRIFT_MAX_MS - MASTER_FILTER_DRIFT_MIN_MS);
    setTimeout(() => {
      const t = ctx.currentTime;
      masterFilter.frequency.cancelScheduledValues(t);
      masterFilter.frequency.setValueAtTime(masterFilter.frequency.value, t);
      masterFilter.frequency.linearRampToValueAtTime(randInRange(DRIFT_MASTER_FILTER_RANGE), t + MASTER_FILTER_DRIFT_RAMP_S);
      scheduleMasterFilterDrift();
    }, delay);
  }

  // Pink noise (equal energy per octave) rather than white noise (flat
  // across the whole spectrum) — white noise reads as harsh hiss/static;
  // pink noise is what rain, wind and surf actually sound like. Paul
  // Kellet's well-known economy pink-noise filter, run once into a
  // buffer rather than live so both the per-voice breath layer and the
  // global ambient noise layer can share it cheaply.
  function getNoiseBuffer() {
    if (noiseBufferCache) return noiseBufferCache;
    const len  = ctx.sampleRate * 2;
    const buf  = ctx.createBuffer(1, len, ctx.sampleRate);
    const data = buf.getChannelData(0);
    let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
    for (let i = 0; i < len; i++) {
      const white = Math.random() * 2 - 1;
      b0 = 0.99886 * b0 + white * 0.0555179;
      b1 = 0.99332 * b1 + white * 0.0750759;
      b2 = 0.96900 * b2 + white * 0.1538520;
      b3 = 0.86650 * b3 + white * 0.3104856;
      b4 = 0.55000 * b4 + white * 0.5329522;
      b5 = -0.7616 * b5 - white * 0.0168980;
      const pink = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
      b6 = white * 0.115926;
      data[i] = pink * 0.11;
    }
    noiseBufferCache = buf;
    return buf;
  }

  function startVoice(idx, octaveOffset) {
    const freq = voiceFreq(idx, octaveOffset);
    const key  = voiceKey(idx, octaveOffset);
    const now  = ctx.currentTime;

    const voiceGain = ctx.createGain();
    voiceGain.gain.value = 1;

    // Per-voice tone filter — the whole voice (all 4 layers below) passes
    // through this, and it slowly drifts brighter/darker independently of
    // every other voice — a classic filter-sweep pad movement.
    const voiceFilter = ctx.createBiquadFilter();
    voiceFilter.type = 'lowpass';
    voiceFilter.frequency.value = VOICE_FILTER_INITIAL;
    voiceFilter.Q.value = VOICE_FILTER_Q;

    // Random stereo position (notes can now repeat at different octaves,
    // so a fixed by-note position isn't meaningful anymore), plus a slow
    // independent auto-pan wobble so the drone has some movement in space.
    const pan = ctx.createStereoPanner();
    pan.pan.value = (Math.random() * 2 - 1) * PAN_SPREAD;
    const panLfo = ctx.createOscillator();
    panLfo.type = 'sine';
    panLfo.frequency.value = randInRange(PAN_LFO_RANGE);
    const panLfoDepth = ctx.createGain();
    panLfoDepth.gain.value = PAN_LFO_DEPTH;
    panLfo.connect(panLfoDepth); panLfoDepth.connect(pan.pan);
    panLfo.start(now);

    voiceGain.connect(voiceFilter);
    voiceFilter.connect(pan);
    pan.connect(masterGain);

    // 1. Base tone — clean fade-in
    const baseOsc  = ctx.createOscillator();
    baseOsc.type = 'sine';
    baseOsc.frequency.value = freq;
    const baseGain = ctx.createGain();
    baseGain.gain.setValueAtTime(0, now);
    baseGain.gain.linearRampToValueAtTime(BASE_LEVEL, now + FADE_IN_MS / 1000);
    baseOsc.connect(baseGain); baseGain.connect(voiceGain);
    baseOsc.start(now);

    // 2. Detuned chorus oscillator — inaudible at first, ramps in slowly
    const detOsc = ctx.createOscillator();
    detOsc.type = 'sine';
    detOsc.frequency.value = freq;
    detOsc.detune.value    = DETUNE_CENTS;
    const detGain = ctx.createGain();
    detGain.gain.setValueAtTime(0, now);
    detGain.gain.linearRampToValueAtTime(CHORUS_LEVEL, now + DETUNE_RAMP_MS / 1000);
    detOsc.connect(detGain); detGain.connect(voiceGain);
    detOsc.start(now);

    // 3. Slow LFO on the chorus oscillator's pitch, depth ramps in over time
    //    and keeps wandering afterwards (see scheduleDrift).
    const lfo = ctx.createOscillator();
    lfo.type = 'sine';
    lfo.frequency.value = LFO_RATE_HZ;
    const lfoDepth = ctx.createGain();
    lfoDepth.gain.setValueAtTime(0, now);
    lfoDepth.gain.linearRampToValueAtTime(LFO_MAX_CENTS, now + LFO_DEPTH_RAMP_MS / 1000);
    lfo.connect(lfoDepth); lfoDepth.connect(detOsc.detune);
    lfo.start(now);

    // 4. Filtered noise — soft breath-like air. Lowpassed rather than a
    //    resonant bandpass, so it reads as texture, not a whistle.
    const noiseSrc = ctx.createBufferSource();
    noiseSrc.buffer = getNoiseBuffer();
    noiseSrc.loop   = true;
    const breathFilter = ctx.createBiquadFilter();
    breathFilter.type = 'lowpass';
    breathFilter.frequency.value = freq * 2.2;
    breathFilter.Q.value = BREATH_FILTER_Q;
    const noiseGain = ctx.createGain();
    noiseGain.gain.setValueAtTime(0, now);
    noiseGain.gain.linearRampToValueAtTime(BREATH_LEVEL, now + BREATH_RAMP_MS / 1000);
    noiseSrc.connect(breathFilter); breathFilter.connect(noiseGain); noiseGain.connect(voiceGain);
    noiseSrc.start(now);

    // 5. Third detuned layer — plain sine, no harmonic content at all.
    //    Was a custom harmonic "reed" wave; switched to sine to rule out
    //    waveform harmonics as the source of persistent harshness reports.
    const reedOsc = ctx.createOscillator();
    reedOsc.type = 'sine';
    reedOsc.frequency.value = freq;
    reedOsc.detune.value    = REED_DETUNE_CENTS;
    const reedFilter = ctx.createBiquadFilter();
    reedFilter.type = 'lowpass';
    reedFilter.frequency.value = freq * REED_CUTOFF_MULT;
    reedFilter.Q.value = REED_FILTER_Q;
    const reedGain = ctx.createGain();
    reedGain.gain.setValueAtTime(0, now);
    reedGain.gain.linearRampToValueAtTime(REED_LEVEL, now + REED_RAMP_MS / 1000);
    reedOsc.connect(reedFilter); reedFilter.connect(reedGain); reedGain.connect(voiceGain);
    reedOsc.start(now);

    const voice = {
      freq, voiceGain, voiceFilter, pan, panLfo,
      baseOsc, detOsc, lfo, lfoDepth,
      noiseSrc, noiseGain,
      reedOsc, reedFilter,
      driftTimer: null
    };
    voices[key] = voice;
    scheduleDrift(key);
  }

  // Keeps a running voice's detune, vibrato rate/depth, reed filter, breath
  // level, and overall tone filter slowly wandering forever, so the drone
  // never settles into a fixed, static sound.
  function scheduleDrift(key) {
    const delay = DRIFT_MIN_INTERVAL_MS + Math.random() * (DRIFT_MAX_INTERVAL_MS - DRIFT_MIN_INTERVAL_MS);
    const timer = setTimeout(() => {
      const v = voices[key];
      if (!v) return;
      const t = ctx.currentTime;

      v.detOsc.detune.cancelScheduledValues(t);
      v.detOsc.detune.setValueAtTime(v.detOsc.detune.value, t);
      v.detOsc.detune.linearRampToValueAtTime(randInRange(DRIFT_DETUNE_RANGE), t + DRIFT_RAMP_S);

      // lfo is the modulation *rate* — ramp its frequency param directly.
      v.lfo.frequency.cancelScheduledValues(t);
      v.lfo.frequency.setValueAtTime(v.lfo.frequency.value, t);
      v.lfo.frequency.linearRampToValueAtTime(randInRange(DRIFT_LFO_RATE_RANGE), t + DRIFT_RAMP_S);

      v.lfoDepth.gain.cancelScheduledValues(t);
      v.lfoDepth.gain.setValueAtTime(v.lfoDepth.gain.value, t);
      v.lfoDepth.gain.linearRampToValueAtTime(randInRange(DRIFT_LFO_DEPTH_RANGE), t + DRIFT_RAMP_S);

      v.reedFilter.frequency.cancelScheduledValues(t);
      v.reedFilter.frequency.setValueAtTime(v.reedFilter.frequency.value, t);
      v.reedFilter.frequency.linearRampToValueAtTime(
        v.freq * randInRange(DRIFT_REED_CUTOFF_MULT_RANGE), t + DRIFT_RAMP_S
      );

      v.noiseGain.gain.cancelScheduledValues(t);
      v.noiseGain.gain.setValueAtTime(v.noiseGain.gain.value, t);
      v.noiseGain.gain.linearRampToValueAtTime(randInRange(DRIFT_BREATH_LEVEL_RANGE), t + DRIFT_RAMP_S);

      v.voiceFilter.frequency.cancelScheduledValues(t);
      v.voiceFilter.frequency.setValueAtTime(v.voiceFilter.frequency.value, t);
      v.voiceFilter.frequency.linearRampToValueAtTime(randInRange(DRIFT_VOICE_FILTER_RANGE), t + DRIFT_RAMP_S);

      scheduleDrift(key);
    }, delay);
    voices[key].driftTimer = timer;
  }

  function stopVoice(key) {
    const v = voices[key];
    if (!v) return;
    delete voices[key];
    if (v.driftTimer) clearTimeout(v.driftTimer);
    const now = ctx.currentTime;
    v.voiceGain.gain.cancelScheduledValues(now);
    v.voiceGain.gain.setValueAtTime(v.voiceGain.gain.value, now);
    v.voiceGain.gain.linearRampToValueAtTime(0, now + RELEASE_MS / 1000);
    const stopAt = now + RELEASE_MS / 1000 + 0.05;
    [v.baseOsc, v.detOsc, v.lfo, v.noiseSrc, v.reedOsc, v.panLfo].forEach(n => { try { n.stop(stopAt); } catch (_) {} });
  }

  // Dedicated bass anchor — clean sine, no chorus/reed/vibrato layers (those
  // add pleasant complexity up top but just turn into low-frequency mud on
  // a sub-bass tone), centered rather than panned since bass isn't very
  // directional anyway.
  function startBass() {
    if (bassVoice) return;
    const freq = SARGAM[BASS_NOTE_IDX].hz * Math.pow(2, BASS_OCTAVE_OFFSET);
    const now  = ctx.currentTime;

    const bassFilter = ctx.createBiquadFilter();
    bassFilter.type = 'lowpass';
    bassFilter.frequency.value = freq * 6;
    bassFilter.Q.value = BASS_FILTER_Q;

    const bassGain = ctx.createGain();
    bassGain.gain.setValueAtTime(0, now);
    bassGain.gain.linearRampToValueAtTime(BASS_LEVEL, now + BASS_FADE_IN_MS / 1000);

    const bassOsc = ctx.createOscillator();
    bassOsc.type = 'sine';
    bassOsc.frequency.value = freq;
    bassOsc.connect(bassFilter); bassFilter.connect(bassGain); bassGain.connect(masterGain);
    bassOsc.start(now);

    bassVoice = { osc: bassOsc, gain: bassGain, filter: bassFilter };
  }

  function stopBass() {
    if (!bassVoice) return;
    const now = ctx.currentTime;
    bassVoice.gain.gain.cancelScheduledValues(now);
    bassVoice.gain.gain.setValueAtTime(bassVoice.gain.gain.value, now);
    bassVoice.gain.gain.linearRampToValueAtTime(0, now + RELEASE_MS / 1000);
    const stopAt = now + RELEASE_MS / 1000 + 0.05;
    try { bassVoice.osc.stop(stopAt); } catch (_) {}
    bassVoice = null;
  }

  // Keeps the ambient noise layer's tone/level slowly wandering while it's on,
  // same idea as scheduleDrift for the note voices — never a flat static hiss.
  function scheduleWhiteNoiseDrift() {
    const delay = WHITE_NOISE_DRIFT_MIN_MS + Math.random() * (WHITE_NOISE_DRIFT_MAX_MS - WHITE_NOISE_DRIFT_MIN_MS);
    whiteNoiseDriftTimer = setTimeout(() => {
      if (!whiteNoiseOn) return;
      const t = ctx.currentTime;

      whiteNoiseFilter.frequency.cancelScheduledValues(t);
      whiteNoiseFilter.frequency.setValueAtTime(whiteNoiseFilter.frequency.value, t);
      whiteNoiseFilter.frequency.linearRampToValueAtTime(randInRange(WHITE_NOISE_CUTOFF_RANGE), t + WHITE_NOISE_DRIFT_RAMP_S);

      whiteNoiseGain.gain.cancelScheduledValues(t);
      whiteNoiseGain.gain.setValueAtTime(whiteNoiseGain.gain.value, t);
      whiteNoiseGain.gain.linearRampToValueAtTime(randInRange(WHITE_NOISE_LEVEL_RANGE), t + WHITE_NOISE_DRIFT_RAMP_S);

      scheduleWhiteNoiseDrift();
    }, delay);
  }

  /* ── Autonomous ambient "composer" ──────────────────────────────────
     No note-picking UI — Play starts the bass anchor plus 2-3 random upper
     voices (spread across octaves, kept a minimum gap apart), then an
     evolve timer keeps adding/removing upper voices indefinitely so the
     harmonic bed itself changes over time, not just each note's internal
     drift. ─────────────────────────────────────────────────── */
  const MAX_ACTIVE_NOTES  = 3;
  const MIN_ACTIVE_NOTES  = 2;
  const EVOLVE_MIN_MS     = 25000;
  const EVOLVE_MAX_MS     = 45000;

  let isPlaying   = false;
  let evolveTimer = null;

  // All (idx, octaveOffset) combinations — the full pool upper voices are
  // drawn from.
  function allVoiceSlots() {
    const slots = [];
    SARGAM.forEach((_, idx) => OCTAVE_OFFSETS.forEach(oct => slots.push([idx, oct])));
    return slots;
  }

  // Picks a random slot at least MIN_VOICE_GAP_CENTS from every currently
  // active voice; falls back to whatever's least-close if nothing clears
  // the bar within a reasonable number of attempts (small pool, shouldn't
  // normally happen).
  function pickSpacedSlot(excludeKeys) {
    const activeFreqs = Object.values(voices).map(v => v.freq);
    const candidates = allVoiceSlots().filter(([idx, oct]) => !excludeKeys.includes(voiceKey(idx, oct)));
    if (!candidates.length) return null;

    for (let i = 0; i < MAX_PICK_ATTEMPTS; i++) {
      const [idx, oct] = candidates[Math.floor(Math.random() * candidates.length)];
      if (isFarEnoughFromActive(voiceFreq(idx, oct), activeFreqs)) return [idx, oct];
    }
    // Fallback: widest minimum gap available among the candidates.
    let best = candidates[0];
    let bestGap = -Infinity;
    candidates.forEach(([idx, oct]) => {
      const freq = voiceFreq(idx, oct);
      const gap = activeFreqs.length
        ? Math.min(...activeFreqs.map(f => centsBetween(freq, f)))
        : Infinity;
      if (gap > bestGap) { bestGap = gap; best = [idx, oct]; }
    });
    return best;
  }

  function scheduleEvolve() {
    const delay = EVOLVE_MIN_MS + Math.random() * (EVOLVE_MAX_MS - EVOLVE_MIN_MS);
    evolveTimer = setTimeout(() => {
      if (!isPlaying) return;
      const activeKeys = Object.keys(voices);

      const shouldRemove = activeKeys.length >= MAX_ACTIVE_NOTES
        || (activeKeys.length > MIN_ACTIVE_NOTES && Math.random() < 0.5);

      if (shouldRemove && activeKeys.length > MIN_ACTIVE_NOTES) {
        stopVoice(activeKeys[Math.floor(Math.random() * activeKeys.length)]);
      } else {
        const slot = pickSpacedSlot(activeKeys);
        if (slot) startVoice(slot[0], slot[1]);
      }
      scheduleEvolve();
    }, delay);
  }

  function startAmbient() {
    ensureCtx();
    if (isPlaying) return;
    isPlaying = true;
    playBtn.textContent = 'Stop';
    playBtn.classList.add('active');

    startBass();

    const count = 2 + Math.floor(Math.random() * 2); // 2 or 3 upper voices
    for (let i = 0; i < count; i++) {
      const slot = pickSpacedSlot(Object.keys(voices));
      if (slot) startVoice(slot[0], slot[1]);
    }

    whiteNoiseOn = true;
    whiteNoiseGain.gain.cancelScheduledValues(ctx.currentTime);
    whiteNoiseGain.gain.setValueAtTime(whiteNoiseGain.gain.value, ctx.currentTime);
    whiteNoiseGain.gain.linearRampToValueAtTime(WHITE_NOISE_LEVEL, ctx.currentTime + WHITE_NOISE_RAMP_S);
    scheduleWhiteNoiseDrift();

    scheduleEvolve();
  }

  function stopAmbient() {
    if (!isPlaying) return;
    isPlaying = false;
    playBtn.textContent = 'Play';
    playBtn.classList.remove('active');

    Object.keys(voices).forEach(key => stopVoice(key));
    stopBass();

    whiteNoiseOn = false;
    whiteNoiseGain.gain.cancelScheduledValues(ctx.currentTime);
    whiteNoiseGain.gain.setValueAtTime(whiteNoiseGain.gain.value, ctx.currentTime);
    whiteNoiseGain.gain.linearRampToValueAtTime(0, ctx.currentTime + WHITE_NOISE_RAMP_S);

    if (whiteNoiseDriftTimer) { clearTimeout(whiteNoiseDriftTimer); whiteNoiseDriftTimer = null; }
    if (evolveTimer) { clearTimeout(evolveTimer); evolveTimer = null; }
  }

  const playBtn      = document.getElementById('ambient-play');
  const volumeSlider = document.getElementById('ambient-volume');

  playBtn.addEventListener('click', () => {
    if (isPlaying) stopAmbient(); else startAmbient();
  });

  volumeSlider.addEventListener('input', () => {
    if (!masterGain) return;
    masterGain.gain.setTargetAtTime(parseFloat(volumeSlider.value), ctx.currentTime, 0.01);
  });

  /* ── Full-screen dune visualizer ──────────────────────────────────────
     Layered sand-dune silhouettes rather than plain wave lines — each
     ridge is 3 summed sine octaves (different frequency/speed per octave)
     for an irregular, organic contour instead of a pure sine curve, filled
     solid and drawn back-to-front so nearer dunes naturally occlude the
     ones behind them. Always gently shifting on their own (even in
     silence) with live audio pushed in as extra amplitude once something
     is playing — reads straight off the analyser tapped into the final
     output above, so it's genuinely in sync with what's audible, not a
     guess running on its own clock. ─────────────────────────────────── */
  const waveCanvas = document.getElementById('wave-canvas');
  const wctx = waveCanvas.getContext('2d');

  function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    waveCanvas.width  = window.innerWidth  * dpr;
    waveCanvas.height = window.innerHeight * dpr;
    waveCanvas.style.width  = window.innerWidth  + 'px';
    waveCanvas.style.height = window.innerHeight + 'px';
    wctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();
  wctx.fillStyle = '#ffffff';
  wctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

  // Layered meadow — same grainy, calm, full-bleed band structure as the
  // original dune version — plain layered bands, calm and static apart
  // from a gentle overall swell with the music's energy.
  const grainCanvas = document.createElement('canvas');
  grainCanvas.width = 220;
  grainCanvas.height = 220;
  const grainCtx = grainCanvas.getContext('2d');
  const grainImg = grainCtx.createImageData(220, 220);
  for (let i = 0; i < grainImg.data.length; i += 4) {
    const v = Math.random() < 0.5 ? 0 : 255;
    grainImg.data[i] = v; grainImg.data[i + 1] = v; grainImg.data[i + 2] = v;
    grainImg.data[i + 3] = Math.random() * 60;
  }
  grainCtx.putImageData(grainImg, 0, 0);
  const grainPattern = wctx.createPattern(grainCanvas, 'repeat');

  const BAND_COUNT = 6;
  const bandSeeds = Array.from({ length: BAND_COUNT }, () => {
    const amp1 = 34 + Math.random() * 20;
    return {
      freq1: 0.0014 + Math.random() * 0.0012, phase1: Math.random() * Math.PI * 2, speed1: 0.04 + Math.random() * 0.04, amp1,
      freq2: 0.0035 + Math.random() * 0.002,  phase2: Math.random() * Math.PI * 2, speed2: 0.06 + Math.random() * 0.06, amp2: amp1 * 0.2,
    };
  });

  // Motion clock only advances while playing — everything sits still on
  // load and freezes in place on stop, rather than animating on its own.
  let animClock = 0;
  let lastTick   = performance.now();
  let smoothedEnergy = 0;

  function drawWaves() {
    requestAnimationFrame(drawWaves);
    const w = window.innerWidth;
    const h = window.innerHeight;
    const now = performance.now();
    const dt  = (now - lastTick) / 1000;
    lastTick  = now;
    if (isPlaying) animClock += dt;
    const t = animClock;

    // Soft trailing fade rather than a hard clear — lines leave gentle
    // echoes as they move, which reads much more like flowing water.
    wctx.fillStyle = 'rgba(255,255,255,0.13)';
    wctx.fillRect(0, 0, w, h);

    let rawEnergy = 0;
    if (analyser && analyserData) {
      analyser.getByteFrequencyData(analyserData);
      let sum = 0;
      for (let i = 0; i < analyserData.length; i++) sum += analyserData[i];
      rawEnergy = sum / analyserData.length / 255;
    }
    smoothedEnergy += (rawEnergy - smoothedEnergy) * 0.05;
    const energy = smoothedEnergy;

    // Distant band's baseline sits safely above the top edge (well past
    // its own max wave amplitude) so its pale fill always fully covers
    // y=0 — the band effectively extends off-screen instead of starting
    // partway down, so there's no gap above it to begin with.
    const bandTop    = -90;
    const bandBottom = h * 1.02;
    const step       = 6;
    const ampScale   = 0.8 + energy * 0.6;

    for (let li = 0; li < BAND_COUNT; li++) {
      const seed = bandSeeds[li];
      const depth = li / (BAND_COUNT - 1); // 0 = distant/back, 1 = near/front
      const baseline = bandTop + depth * (bandBottom - bandTop);

      const ridgeY = x => baseline
        + Math.sin(x * seed.freq1 + seed.phase1 + t * seed.speed1) * seed.amp1 * ampScale
        + Math.sin(x * seed.freq2 + seed.phase2 + t * seed.speed2) * seed.amp2 * ampScale;

      wctx.beginPath();
      wctx.moveTo(0, h);
      for (let x = 0; x <= w; x += step) wctx.lineTo(x, ridgeY(x));
      wctx.lineTo(w, h);
      wctx.closePath();

      // Distant bands fade near-white (atmospheric haze), nearest band is
      // almost black.
      const gray = Math.round(236 - depth * 216);
      wctx.fillStyle = `rgb(${gray},${gray},${gray})`;
      wctx.fill();

      // Grain texture, clipped to this band's silhouette only — slowly
      // drifting for a subtle shimmer, like light catching a textured
      // surface as it shifts.
      wctx.save();
      wctx.clip();
      wctx.globalAlpha = 0.5;
      wctx.translate((t * 6) % 220, (t * 3) % 220);
      wctx.fillStyle = grainPattern;
      wctx.fillRect(-220, -220, w + 440, h + 440);
      wctx.restore();
    }
  }
  drawWaves();

})();
</script>

</body>
</html>
