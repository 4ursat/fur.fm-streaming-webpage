<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fur FM — Music</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500&family=Yatra+One&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      min-height: 100%;
      background: #000000;
      font-family: 'Yatra One', serif;
      color: #ffffff;
      -webkit-tap-highlight-color: transparent;
    }

    body::after {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background-image: radial-gradient(circle, rgba(255,255,255,0.045) 1px, transparent 1px);
      background-size: 26px 26px;
      pointer-events: none;
    }

    /* ── Brand ───────────────────────────────────────────────── */
    #brand {
      position: fixed;
      top: 1.4rem; left: 1.5rem;
      z-index: 30;
      user-select: none;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.18rem;
      text-decoration: none;
    }
    #brand svg { opacity: 0.9; width: 100%; height: auto; }

    /* ── Site nav ────────────────────────────────────────────── */
    #site-nav {
      position: fixed;
      top: 1.7rem; right: 1.5rem;
      z-index: 30;
      display: flex;
      gap: 1.5rem;
    }
    .nav-link {
      font-family: 'Yatra One', serif;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.55);
      text-decoration: none;
      transition: color 0.15s;
    }
    .nav-link:hover { color: #ffffff; }
    .nav-link.active { color: #ffffff; }

    @media (max-width: 560px) {
      #site-nav { gap: 0.9rem; top: 1.5rem; right: 1rem; }
      .nav-link { font-size: 0.62rem; letter-spacing: 0.08em; }
      #brand { top: 1.2rem; left: 1rem; }
    }

    /* ── Albums ──────────────────────────────────────────────── */
    #albums {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.6rem;
      padding: 8.5rem 1.5rem 4rem;
      max-width: 500px;
      margin: 0 auto;
    }
    .album-embed {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
    }
    .album-embed iframe {
      display: block;
      width: 100%;
      border: none;
    }
  </style>
</head>
<body>

<a id="brand" href="index.html">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 168 64" width="140" height="53" fill="none">
    <text x="0" y="24"
      font-family="'Courier New',Courier,monospace"
      font-size="24" font-weight="700" letter-spacing="1"
      fill="#ffffff">FursatFM</text>
    <line x1="1" y1="31" x2="37" y2="31" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
    <text x="1" y="50"
      font-family="'Yatra One', serif"
      font-size="18"
      fill="rgba(255,255,255,0.75)">फ़ुर्सत</text>
  </svg>
</a>

<nav id="site-nav">
  <a class="nav-link" href="stream.html">Live</a>
  <a class="nav-link active" href="music.html">Music</a>
  <a class="nav-link" href="studio.html">Studio</a>
  <a class="nav-link" href="shop.html">Shop</a>
  <a class="nav-link" href="cry.html">Cry</a>
</nav>

<div id="albums">
  <div class="album-embed">

      height="352" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
  </div>
  <div class="album-embed">

      height="352" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
  </div>
  <div class="album-embed">
    <iframe src="https://open.spotify.com/embed/album/6GI2F0no7956cSFsPD7XbC?utm_source=generator&theme=0"
      height="352" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
  </div>
</div>

</body>
</html>
