<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fur FM — Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500&family=Yatra+One&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      min-height: 100%;
      background: #000000;
      font-family: 'Yatra One', serif;
      color: #ffffff;
      -webkit-tap-highlight-color: transparent;
    }

    body::after {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background-image: radial-gradient(circle, rgba(255,255,255,0.045) 1px, transparent 1px);
      background-size: 26px 26px;
      pointer-events: none;
    }

    /* ── Brand ───────────────────────────────────────────────── */
    #brand {
      position: fixed;
      top: 1.4rem; left: 1.5rem;
      z-index: 30;
      user-select: none;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.18rem;
      text-decoration: none;
    }
    #brand svg { opacity: 0.9; width: 100%; height: auto; }

    /* ── Site nav ────────────────────────────────────────────── */
    #site-nav {
      position: fixed;
      top: 1.7rem; right: 1.5rem;
      z-index: 30;
      display: flex;
      gap: 1.5rem;
    }
    .nav-link {
      font-family: 'Yatra One', serif;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.55);
      text-decoration: none;
      transition: color 0.15s;
    }
    .nav-link:hover { color: #ffffff; }
    .nav-link.active { color: #ffffff; }

    @media (max-width: 560px) {
      #site-nav { gap: 0.9rem; top: 1.5rem; right: 1rem; }
      .nav-link { font-size: 0.62rem; letter-spacing: 0.08em; }
      #brand { top: 1.2rem; left: 1rem; }
    }

    @media (max-width: 620px) {
      #studio-layout { flex-direction: column; gap: 1.5rem; padding-top: 7rem; }
      #studio-nav { flex-direction: row; gap: 1.4rem; min-width: 0; }
    }

    /* ── Studio layout ───────────────────────────────────────── */
    #studio-layout {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: flex-start;
      gap: 2.5rem;
      max-width: 900px;
      margin: 0 auto;
      padding: 8.5rem 1.5rem 4rem;
    }
    #studio-nav {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      flex-shrink: 0;
      min-width: 130px;
      padding-top: 0.2rem;
    }
    .studio-nav-link {
      appearance: none;
      background: transparent;
      border: none;
      font-family: 'Yatra One', serif;
      font-size: 0.78rem;
      letter-spacing: 0.03em;
      text-align: left;
      color: rgba(255,255,255,0.5);
      cursor: pointer;
      padding: 0;
      transition: color 0.15s;
    }
    .studio-nav-link:hover { color: rgba(255,255,255,0.8); }
    .studio-nav-link.active { color: #ffffff; }

    #studio-content {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 1.6rem;
    }
    .studio-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.6rem;
    }
    .film-item {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .film-title {
      font-size: 0.9rem;
      letter-spacing: 0.03em;
      color: rgba(255,255,255,0.85);
      text-align: left;
    }
    .film-embed {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 */
      border-radius: 8px;
      overflow: hidden;
      background: rgba(255,255,255,0.03);
    }
    .film-embed iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
    }
    .track-embed {
      width: 100%;
      border-radius: 6px;
      overflow: hidden;
    }
    .track-embed iframe {
      width: 100%;
      height: 442px;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

<a id="brand" href="index.html">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 168 64" width="140" height="53" fill="none">
    <text x="0" y="24"
      font-family="'Courier New',Courier,monospace"
      font-size="24" font-weight="700" letter-spacing="1"
      fill="#ffffff">FursatFM</text>
    <line x1="1" y1="31" x2="37" y2="31" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
    <text x="1" y="50"
      font-family="'Yatra One', serif"
      font-size="18"
      fill="rgba(255,255,255,0.75)">फ़ुर्सत</text>
  </svg>
</a>

<nav id="site-nav">
  <a class="nav-link" href="stream.html">Live</a>
  <a class="nav-link" href="music.html">Music</a>
  <a class="nav-link active" href="studio.html">Studio</a>
  <a class="nav-link" href="shop.html">Shop</a>
  <a class="nav-link" href="cry.html">Cry</a>
  <a class="nav-link" href="contact.html">Contact</a>
</nav>

<div id="studio-layout">
  <nav id="studio-nav">
    <button class="studio-nav-link active" data-target="films" type="button">Music for Films</button>
    <button class="studio-nav-link" data-target="stock" type="button">Stock Music</button>
  </nav>

  <div id="studio-content">
    <div class="studio-section" id="section-films">
      <div class="film-item">
        <div class="film-title">Queen of Hearts</div>
        <div class="film-embed">
          <iframe src="https://player.vimeo.com/video/965231788?title=0&byline=0&portrait=0"
            allow="autoplay; fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe>
        </div>
      </div>
    </div>

    <div class="studio-section" id="section-stock" style="display:none;">
      <div class="film-item">
        <div class="film-title">black &amp; white is drowning</div>
        <div class="track-embed">
          <iframe src="https://bandcamp.com/EmbeddedPlayer/album=1619191446/size=large/bgcol=000000/linkcol=ffffff/tracklist=true/artwork=small/transparent=true/"
            seamless loading="lazy">
            <a href="https://4ursat.bandcamp.com/album/black-white-is-drowning">black &amp; white is drowning by Fursat FM</a>
          </iframe>
        </div>
      </div>
      <div class="film-item">
        <div class="film-title">is it today or tomorrow?</div>
        <div class="track-embed">
          <iframe src="https://bandcamp.com/EmbeddedPlayer/album=1620040497/size=large/bgcol=000000/linkcol=ffffff/tracklist=true/artwork=small/transparent=true/"
            seamless loading="lazy">
            <a href="https://4ursat.bandcamp.com/album/is-it-today-or-tomorrow">is it today or tomorrow? by Fursat FM</a>
          </iframe>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const studioNavLinks = document.querySelectorAll('.studio-nav-link');
  const studioSections = {
    films: document.getElementById('section-films'),
    stock: document.getElementById('section-stock'),
  };
  studioNavLinks.forEach(btn => {
    btn.addEventListener('click', () => {
      studioNavLinks.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      Object.entries(studioSections).forEach(([key, el]) => {
        el.style.display = key === btn.dataset.target ? '' : 'none';
      });
    });
  });
</script>

</body>
</html>
