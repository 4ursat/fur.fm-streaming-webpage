<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fur FM — Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500&family=Yatra+One&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      min-height: 100%;
      background: #ffffff;
      font-family: 'Yatra One', serif;
      color: #000000;
      -webkit-tap-highlight-color: transparent;
    }

    /* Grain texture — same speckle tile as the visualizer, so every page
       shares one consistent grainy, textured feel. */
    body::after {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background-image: url('grain.png');
      background-repeat: repeat;
      opacity: 0.2;
      pointer-events: none;
    }

    /* ── Brand ───────────────────────────────────────────────── */
    #brand {
      position: fixed;
      top: 1.4rem; left: 1.5rem;
      z-index: 30;
      user-select: none;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.18rem;
      text-decoration: none;
    }
    #brand svg { opacity: 0.9; width: 100%; height: auto; }

    /* ── Site nav ────────────────────────────────────────────── */
    #site-nav {
      position: fixed;
      top: 1.7rem; right: 1.5rem;
      z-index: 30;
      display: flex;
      gap: 1.5rem;
    }

    /* Page icons live on their own, away from Live and the brand mark. */
    #page-nav {
      position: fixed;
      left: 1.5rem;
      top: 50%;
      transform: translateY(-50%);
      z-index: 30;
      display: flex;
      flex-direction: column;
      gap: 1.4rem;
    }
    .nav-link {
      font-family: 'Yatra One', serif;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(0,0,0,0.55);
      text-decoration: none;
      transition: color 0.15s;
      display: flex;
      align-items: center;
    }
    .nav-link:hover { color: #000000; }
    .nav-link.active { color: #000000; }

    .nav-live {
      background: rgba(210, 110, 120, 0.08);
      color: #b8505f;
      padding: 0.32rem 0.85rem;
      border-radius: 999px;
      font-weight: 700;
      animation: live-halo-pulse 2.8s ease-in-out infinite;
      transition: background 0.15s, color 0.15s;
    }
    .nav-live:hover { background: rgba(210, 110, 120, 0.14); color: #9c3f4d; }
    @keyframes live-halo-pulse {
      0%, 100% { box-shadow: 0 0 8px 1px rgba(210, 110, 120, 0.18); }
      50%      { box-shadow: 0 0 16px 4px rgba(210, 110, 120, 0.35); }
    }

    .nav-icon {
      position: relative;
      width: 1.3rem;
      height: 1.3rem;
      justify-content: center;
    }
    .nav-icon svg { width: 100%; height: 100%; display: block; }
    .nav-icon::after {
      content: attr(aria-label);
      position: absolute;
      left: calc(100% + 0.7rem);
      top: 50%;
      transform: translateY(-50%);
      font-family: 'Yatra One', serif;
      font-size: 0.66rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(0,0,0,0.62);
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
    }
    .nav-icon:hover::after { opacity: 1; }

    @media (max-width: 560px) {
      #site-nav { gap: 0.9rem; top: 1.5rem; right: 1rem; }
      .nav-link { font-size: 0.62rem; letter-spacing: 0.08em; }
      .nav-icon { width: 1.1rem; height: 1.1rem; }
      #page-nav { left: 1rem; gap: 1.1rem; }
      #brand { top: 1.2rem; left: 1rem; }
    }

    @media (max-width: 620px) {
      #studio-layout { flex-direction: column; gap: 1.5rem; padding-top: 7rem; }
      #studio-nav { flex-direction: row; gap: 1.4rem; min-width: 0; }
    }

    /* ── Studio layout ───────────────────────────────────────── */
    #studio-layout {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: flex-start;
      gap: 2.5rem;
      max-width: 900px;
      margin: 0 auto;
      padding: 8.5rem 1.5rem 4rem;
    }
    #studio-nav {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      flex-shrink: 0;
      min-width: 130px;
      padding-top: 0.2rem;
    }
    .studio-nav-link {
      appearance: none;
      background: transparent;
      border: none;
      font-family: 'Yatra One', serif;
      font-size: 0.78rem;
      letter-spacing: 0.03em;
      text-align: left;
      color: rgba(0,0,0,0.5);
      cursor: pointer;
      padding: 0;
      transition: color 0.15s;
    }
    .studio-nav-link:hover { color: rgba(0,0,0,0.8); }
    .studio-nav-link.active { color: #000000; }

    #studio-content {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 1.6rem;
    }
    .studio-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.6rem;
    }
    .film-item {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .film-title {
      font-size: 0.9rem;
      letter-spacing: 0.03em;
      color: rgba(0,0,0,0.85);
      text-align: left;
    }
    .film-embed {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 */
      border-radius: 8px;
      overflow: hidden;
      background: rgba(0,0,0,0.03);
    }
    .film-embed iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
    }
    .track-embed {
      width: 100%;
      border-radius: 6px;
      overflow: hidden;
    }
    .track-embed iframe {
      width: 100%;
      height: 442px;
      border: none;
      display: block;
    }

    /* Clears the fixed left icon strip, and stretches studio-content to
       full width — placed after #studio-layout so it wins the cascade at
       this width. Without the align-items override, #studio-layout keeps
       its desktop align-items:flex-start once stacked into a column,
       which shrink-wraps #studio-content (and the film/track embeds
       inside it) to their intrinsic size instead of filling the row. */
    @media (max-width: 620px) {
      #studio-layout { padding-left: 3.4rem; align-items: stretch; }
    }
  </style>
</head>
<body>

<a id="brand" href="index.html">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 168 64" width="140" height="53" fill="none">
    <text x="0" y="24"
      font-family="'Courier New',Courier,monospace"
      font-size="24" font-weight="700" letter-spacing="1"
      fill="#000000">Fursat FM</text>
    <line x1="1" y1="31" x2="37" y2="31" stroke="rgba(0,0,0,0.4)" stroke-width="1"/>
    <text x="1" y="50"
      font-family="'Yatra One', serif"
      font-size="18"
      fill="rgba(0,0,0,0.75)">फ़ुर्सत</text>
  </svg>
</a>

<nav id="site-nav">
  <a class="nav-link nav-live" href="stream.html">Live</a>
</nav>

<nav id="page-nav">
  <a class="nav-link nav-icon" href="music.html" aria-label="Music" title="Music">
    <svg viewBox="0 0 20 20" fill="none"><path d="M2.3 10.5h1.3l1-4.4 2.1 9 2.3-12.2 2.1 15 2.1-9 1-3.4h1.3" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </a>
  <a class="nav-link nav-icon active" href="studio.html" aria-label="Studio" title="Studio">
    <svg viewBox="0 0 20 20" fill="none"><path d="M3 15.5a7 7 0 0 1 14 0" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M10 15.5l3.2-5.7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><circle cx="10" cy="15.5" r="1" fill="currentColor"/></svg>
  </a>
  <a class="nav-link nav-icon" href="shop.html" aria-label="Shop" title="Shop">
    <svg viewBox="0 0 20 20" fill="none"><path d="M5 7h10l-.8 9.2a1 1 0 0 1-1 .8H6.8a1 1 0 0 1-1-.8L5 7Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M7.5 7V5.5a2.5 2.5 0 0 1 5 0V7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
  </a>
  <a class="nav-link nav-icon" href="contact.html" aria-label="Contact" title="Contact">
    <svg viewBox="0 0 20 20" fill="none"><rect x="2.5" y="4.5" width="15" height="11" rx="1.2" stroke="currentColor" stroke-width="1.4"/><path d="M3 5.5l7 5.5 7-5.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </a>
</nav>

<div id="studio-layout">
  <nav id="studio-nav">
    <button class="studio-nav-link active" data-target="films" type="button">Music for Films</button>
    <button class="studio-nav-link" data-target="stock" type="button">Stock Music</button>
  </nav>

  <div id="studio-content">
    <div class="studio-section" id="section-films">
      <div class="film-item">
        <div class="film-title">Queen of Hearts</div>
        <div class="film-embed">
          <iframe src="https://player.vimeo.com/video/965231788?title=0&byline=0&portrait=0"
            allow="autoplay; fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe>
        </div>
      </div>
    </div>

    <div class="studio-section" id="section-stock" style="display:none;">
      <div class="film-item">
        <div class="film-title">feverish keys</div>
        <div class="track-embed">
          <iframe src="https://bandcamp.com/EmbeddedPlayer/album=670766895/size=large/bgcol=000000/linkcol=ffffff/tracklist=true/artwork=small/transparent=true/"
            seamless loading="lazy">
            <a href="https://4ursat.bandcamp.com/album/feverish-keys">feverish keys by Fursat FM</a>
          </iframe>
        </div>
      </div>
      <div class="film-item">
        <div class="film-title">black &amp; white is drowning</div>
        <div class="track-embed">
          <iframe src="https://bandcamp.com/EmbeddedPlayer/album=1619191446/size=large/bgcol=000000/linkcol=ffffff/tracklist=true/artwork=small/transparent=true/"
            seamless loading="lazy">
            <a href="https://4ursat.bandcamp.com/album/black-white-is-drowning">black &amp; white is drowning by Fursat FM</a>
          </iframe>
        </div>
      </div>
      <div class="film-item">
        <div class="film-title">is it today or tomorrow?</div>
        <div class="track-embed">
          <iframe src="https://bandcamp.com/EmbeddedPlayer/album=1620040497/size=large/bgcol=000000/linkcol=ffffff/tracklist=true/artwork=small/transparent=true/"
            seamless loading="lazy">
            <a href="https://4ursat.bandcamp.com/album/is-it-today-or-tomorrow">is it today or tomorrow? by Fursat FM</a>
          </iframe>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const studioNavLinks = document.querySelectorAll('.studio-nav-link');
  const studioSections = {
    films: document.getElementById('section-films'),
    stock: document.getElementById('section-stock'),
  };
  studioNavLinks.forEach(btn => {
    btn.addEventListener('click', () => {
      studioNavLinks.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      Object.entries(studioSections).forEach(([key, el]) => {
        el.style.display = key === btn.dataset.target ? '' : 'none';
      });
    });
  });
</script>

</body>
</html>
